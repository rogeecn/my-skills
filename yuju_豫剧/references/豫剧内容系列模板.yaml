豫剧内容系列模板:
  说明: 豫剧公众号3种系列类型的排期表格式和创作流程
  
  系列类型:
    时令系列:
      定义: 围绕一个时令周期（节日/节气/纪念月）规划3-7天内容
      排期表格式:
        系列名称: "{时令词}·豫剧{系列主题}"
        总天数: 3-7
        每天格式:
          DayN: 
            日期: YYYY-MM-DD
            选题: {具体选题}
            受众: {B_受众类型}
            品类: {A_子品类}
            基调: {叙事基调}
            字数: {字数范围}
            平台适配: {主平台+辅助平台}
      示例:
        系列名称: "清明·豫剧忠义七日"
        Day1: 选题: 涤耻血豫剧最早的抗日剧 / 受众: 文化爱好者 / 品类: 沿革历史×人物故事 / 基调: 家国燃型
        Day2: 选题: 常香玉捐飞机详细故事 / 受众: 河南老乡 / 品类: 人物故事 / 基调: 温暖燃型
        Day3: 选题: 陈素真抗日义演的壮举 / 受众: 老戏迷 / 品类: 流派名家×沿革历史 / 基调: 温暖型
        Day4: 选题: 程婴救孤的忠义密码 / 受众: 文化爱好者 / 品类: 经典剧目 / 基调: 赋能型
        Day5: 选题: 豫剧抗战义演的完整时间线 / 受众: 老戏迷 / 品类: 沿革历史 / 基调: 温暖型
        Day6: 选题: 清明听豫剧忠义唱段推荐 / 受众: 河南老乡 / 品类: 经典剧目×豫剧现场 / 基调: 温暖型
        Day7: 选题: 豫剧人从不出席家国大事缺席 / 受众: 年轻传承者 / 品类: 人物故事×传承创新 / 基调: 燃型
    
    主题系列:
      定义: 围绕一个主题深度展开5-10天内容
      排期表格式:
        系列名称: "豫剧{主题词}深度解读"
        总天数: 5-10
        每天覆盖一个维度或子品类
      示例:
        系列名称: "豫剧六大名旦深度解读"
        Day1: 陈素真·美腔与水袖功 / 受众: 老戏迷 / 品类: 流派名家 / 基调: 权威+温暖
        Day2: 常香玉·劲腔与家国情怀 / 受众: 河南老乡 / 品类: 流派名家×人物故事 / 基调: 温暖燃型
        Day3: 崔兰田·悲腔与苦戏美学 / 受众: 老戏迷 / 品类: 流派名家×唱腔音乐 / 基调: 权威型
        Day4: 马金凤·脆腔与刀马旦传奇 / 受众: 文化爱好者 / 品类: 流派名家 / 基调: 好奇+温暖
        Day5: 阎立品·秀腔与闺门旦含蓄美 / 受众: 老戏迷 / 品类: 流派名家 / 基调: 权威型
        Day6: 桑振君·巧腔与被遗忘的第六大名旦 / 受众: 文化爱好者 / 品类: 流派名家 / 基调: 好奇+温暖
    
    事件系列:
      定义: 围绕一个突发或周期性事件展开2-3天内容
      排期表格式:
        系列名称: "{事件名称}特别策划"
        总天数: 2-3
      示例:
        系列名称: "豫剧非遗纪念日特别策划"
        Day1: 豫剧非遗15年保护成就 / 受众: 文化爱好者 / 品类: 传承创新 / 基调: 赋能型
        Day2: 豫剧传承的困境与希望 / 受众: 老戏迷 / 品类: 传承创新×沿革历史 / 基调: 温暖+赋能
  
  系列创作流程:
    1. 确定系列类型和总天数
    2. 生成排期表（确保每天覆盖不同受众和品类）
    3. 每天按单篇创作流程（选题→创作→风格增强→自检→保存）
    4. 每天之间确保主题连贯但不重复
    5. 系列完成后追加一条series_plan.md
  
  系列触发条件:
    - 用户连续3次选择同品类选题
    - 用户提到"做几天""系列""一周内容"
    - 面临重大时令节点（春节/清明/中秋/非遗纪念日）
    - 面临重大事件（名家逝世/豫剧节/新戏首演）