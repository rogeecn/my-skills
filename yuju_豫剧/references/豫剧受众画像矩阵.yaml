        - 两岸交流史
        - 新时代发展
    
    传承创新:
      子品类:
        - 非遗保护
        - 新编戏创作
        - 跨界合作
        - 短视频传播
        - 年轻演员培养
        - 豫剧走出去
        - 科技赋能
    
    河南文化:
      子品类:
        - 豫剧与中原文化
        - 豫剧与河南方言
        - 乡村戏台记忆
        - 梨园春现象
        - 送戏下乡
        - 豫剧与河南身份认同
    
    人物故事:
      子品类:
        - 名家人生传记
        - 抗战义演故事
        - 常香玉捐飞机
        - 剧团往事
        - 学戏经历
        - 艺术家与时代
    
    豫剧科普:
      子品类:
        - 如何看懂豫剧
        - 行当入门
        - 唱腔入门
        - 与京剧区别
        - 豫剧术语解读
        - 豫剧礼仪
    
    豫剧现场:
      子品类:
        - 演出报道
        - 名段视频推荐
        - 演出预告
        - 梨园春赛况
        - 豫剧节活动
    
    豫剧影视:
      子品类:
        - 戏曲电影
        - 短视频改编
        - 电视栏目
        - 豫剧纪录片
    
    服饰化妆:
      子品类:
