王二顺:
     行当: 武生兼老生、花脸
     流派: 王派武生（豫剧唯一称门立派的武生流派）
     生卒: 1920-1977
     籍贯: 河南登封
     荣誉: "五把叉"美誉，中南区戏曲会演演员二等奖，河南省首届戏曲观摩会演演员一等奖
     艺术特色: 文武兼备、戏路宽广（一专多能的"五把叉"），豫西调大腔大口，本嗓下五音行腔，嗓音宏亮音域宽厚
     代表剧目:
       - 杨金花夺印（饰寇准）
       - 打金枝（饰唐王）
       - 反徐州（饰康茂才）
       - 投衙（饰田云山）
       - 收岑彭（1962年名老艺人座谈会录音）
       - 向阳商店（现代戏）
     重大事件:
       - 1954年随河南省歌剧团赴北京为第一届全国人民代表大会献演（《反徐州》饰康茂才）
       - 1956年随洛阳代表团参加河南省首届戏曲观摩会演获演员一等奖
       - 1962年豫剧名老艺人座谈会演出《收岑彭》，珍贵录音保留至今
       - 与马元风结婚，同为豫剧名家
