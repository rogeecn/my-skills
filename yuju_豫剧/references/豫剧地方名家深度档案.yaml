唐玉成:
     行当: 老生（红脸）
     流派: 唐门（豫东调红脸奠基人）
     生卒: 1895-1973
     籍贯: 河南虞城
     地位: 豫东调红脸流派的奠基者，"大公议班"五杆旗之大红旗
     艺术特色: 豫东调大本嗓红脸，以"唐门"区别于"唐派"（唐喜成的二红唱腔）
     代表剧目:
       - 火烧纪信（1962年音频流传至今，豫东红脸经典）
       - 反徐州
       - 杨金花夺印
     重大事件:
       - 20世纪三四十年代统领"大公议班"，培养大量豫东调人才
       - 弟子刘忠河后来成为"豫东红脸王之首"
       - 1962年豫剧名老艺人座谈会录音保留至今
