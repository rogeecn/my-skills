      刘派:
        创始人: 刘忠河
        行当: 老生
        代表剧目: 打金枝，三哭殿
        
      贾派:
        创始人: 贾廷聚
        行当: 老生
        特色: 国家级非遗传承人
        
    须生其他流派:
      王派武生:
        创始人: 王二顺
        行当: 武生兼老生
