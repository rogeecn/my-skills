    小生流派:
      黄派:
        创始人: 黄儒秀
        行当: 小生
        
      刘派小生:
        创始人: 刘法印
        行当: 小生
        
      赵派:
        创始人: 赵义庭
        行当: 小生
        
      王派小生:
        创始人: 王素君
        行当: 小生
        
    花脸流派:
      李派:
        创始人: 李斯忠
        行当: 正净（大花脸/黑脸）
        特色: 黑脸唱腔铿锵豪迈，包公戏代表
        代表剧目: 下陈州，铡美案
        
      吴派:
        创始人: 吴心平
        行当: 正净
        
    丑行流派:
      牛派:
        创始人: 牛得草
        行当: 丑
        特色: 豫剧丑角之冠，七品芝麻官闻名全国
        代表剧目: 唐知县审诰命，七品芝麻官
        
      高派:
        创始人: 高兴旺
        行当: 丑
        
    武旦流派:
      王派武旦:
        创始人: 王敬先
        行当: 武旦
        特色: 首创以武旦为主的豫剧流派
    
    台湾流派:
      张派:
        创始人: 张岫云
        行当: 旦
        荣誉: 豫剧皇太后（台湾）
        
      王海玲:
        荣誉: 豫剧皇后（台湾）
        
      萧扬玲:
        荣誉: 豫剧小天后（台湾）
  
  当代名家:
    李树建:
      行当: 老生
      生年: 1962
      籍贯: 河南汝州
      荣誉: 第十届和第二十五届中国戏剧梅花奖，国家级非遗传承人，河南豫剧二团团长
      代表剧目: 程婴救孤，清风亭上，苏武牧羊，义薄云天
      选题切入角度: 忠孝节义四部曲，豫剧守正创新代表
    
    汪荃珍:
      行当: 旦
      生年: 1962
      荣誉: 第十九届中国戏剧梅花奖，河南豫剧院三团团长
      代表剧目: 朝阳沟（复排），焦裕禄，香魂女
      选题切入角度: 豫剧现代戏领军人物
    
    王红丽:
      行当: 旦
      荣誉: 第十二届和第二十届中国戏剧梅花奖，小皇后豫剧团团长
      代表剧目: 铡刀下的红梅，风雨故园
      选题切入角度: 民营豫剧团的女当家
    
    金不换:
      行当: 丑
      荣誉: 第十七届中国戏剧梅花奖
      代表剧目: 七品芝麻官（传承版）
      选题切入角度: 牛派丑角传承
    
    虎美玲:
      行当: 旦
      生年: 1946
      荣誉: 第七届中国戏剧梅花奖，国家级非遗传承人
      代表剧目: 红楼梦，大祭桩
      选题切入角度: 郑州豫剧传承
    
    吴素真:
      行当: 旦
      荣誉: 第二十九届中国戏剧梅花奖
      选题切入角度: 新一代豫剧名家
    
    贾文龙:
      行当: 老生
      荣誉: 第二十届中国戏剧梅花奖
      代表剧目: 焦裕禄
      选题切入角度: 用豫剧演绎时代英雄
  
