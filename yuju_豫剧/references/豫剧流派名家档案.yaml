豫剧流派名家档案:
  说明: 豫剧六大名旦流派 + 地域流派 + 各行当流派 + 当代名家，2-3年内容创作的核心人物资源
  
  六大名旦流派:
    陈派:
      创始人: 陈素真
      行当: 旦（青衣/花旦/武旦）
      花喻: 梅花
      一字评: 美
      生卒: 1918-1994
      籍贯: 河南开封
      艺术特色: 豫剧舞蹈化技巧化形式美之先河，首创水袖功扇子功辫子功，唱念做打舞综合运用，首创哑剧混合运用，把古典舞蹈融入豫剧
      荣誉: 豫剧皇后，豫剧大王，河南梅兰芳，三鼎甲之首，梆子大王
      代表剧目:
        - 宇宙锋
        - 三上轿
        - 梵王宫
        - 春秋配
        - 桃花庵
        - 涤耻血
        - 凌云志
        - 义烈风
        - 三拂袖
      选题切入角度:
        - 豫剧从粗俗到雅致的革命者
        - 抗日义演与爱国情怀
        - 水袖功背后的苦练故事
        - 与樊粹庭合作的黄金时代
        - 从被逐出剧团到重返巅峰
    
    常派:
      创始人: 常香玉
      行当: 旦（青衣/花旦）
      花喻: 月季
      一字评: 劲
      生卒: 1923-2004
      籍贯: 河南巩义
      艺术特色: 高亢激昂，唱腔铿锵有力，将祥符调豫西调融合，以唱功取胜
      荣誉: 人民艺术家（国务院追封），爱国艺术家
      代表剧目:
        - 花木兰
        - 红娘
        - 白蛇传
        - 拷红
        - 断桥
        - 大祭桩
        - 人欢马叫
      选题切入角度:
        - 抗美援朝捐献香玉剧社号战斗机
        - 从农村女孩到人民艺术家
        - 花木兰唱段背后的家国情怀
        - 常派唱腔为什么这么有劲
        - 与梅兰芳程砚秋并列的抗日爱国艺术家
    
    崔派:
      创始人: 崔兰田
      行当: 旦（青衣）
      花喻: 菊花
      一字评: 韵
      生卒: 1926-2003
      籍贯: 河南曹县
      艺术特色: 韵味淳厚，悲剧唱功极佳，擅长演绎悲情角色，唱腔深沉含蓄婉转
      荣誉: 悲剧皇后
      代表剧目:
        - 秦香莲
        - 桃花庵
        - 三上轿
        - 卖苗郎
        - 陈三两爬堂
      选题切入角度:
        - 豫剧中最会唱苦戏的人
        - 崔派悲腔为什么让人泪流不止
        - 秦香莲唱段解析
        - 从十八兰到崔派掌门
    
    马派:
      创始人: 马金凤
      行当: 旦（老旦/刀马旦）
      花喻: 牡丹
      一字评: 脆
      生卒: 1922-2023
      籍贯: 山东曹县
      艺术特色: 大气响亮脆亮，刀马旦著称，唱腔嘹亮铿锵，擅演巾帼英雄
      荣誉: 第二批国家级非遗代表性传承人，豫剧刀马旦之冠
      代表剧目:
        - 穆桂英挂帅
        - 花打朝
        - 花枪缘
        - 五世请缨（百岁挂帅）
        - 罗成叫关
      选题切入角度:
        - 穆桂英挂帅为什么百看不厌
        - 101岁还在唱豫剧的马金凤
        - 刀马旦背后的体能训练
        - 五世请缨里的百岁挂帅精神
        - 马派脆腔的独特魅力
    
    阎派:
      创始人: 阎立品
      行当: 旦（闺门旦/正旦）
      花喻: 荷花
      一字评: 秀
      生卒: 1920-1996
      籍贯: 河南封丘
      艺术特色: 委婉含蓄清秀典雅，闺门旦著称，唱腔含蓄细腻讲究韵味
      荣誉: 闺门旦之冠
      代表剧目:
        - 秦雪梅吊孝
        - 蝴蝶杯
        - 盘夫索夫
        - 白莲花
        - 双绣鞋
      选题切入角度:
        - 阎派闺门旦如何演活古代少女
        - 秦雪梅吊孝为什么是经典
        - 含蓄之美在豫剧中的表达
        - 阎立品对豫剧雅化的贡献
    
    桑派:
      创始人: 桑振君
      行当: 旦（花旦/闺门旦）
      花喻: 兰花/幽花
      一字评: 巧
      生卒: 1929-2004
      籍贯: 河南开封
      艺术特色: 缠绵委婉巧妙灵活，唱腔委婉巧俏，擅长偷字闪板耍词技巧
      荣誉: 2000年正式承认桑派艺术
      代表剧目:
        - 白莲花
        - 蝴蝶杯
        - 秦雪梅吊孝
        - 对绣鞋
       选题切入角度:
        - 被遗忘的第六大名旦
        - 桑派偷字闪板的独特技巧
        - 从邯郸回到河南的故事
        - 巧腔巧唱背后的苦练
  
  地域流派:
    祥符调:
      中心: 开封
      特色: 豫剧母调，中州正韵，典雅规范
      代表人物: 陈素真，阎立品，桑振君
      历史地位: 豫剧最正统的声腔流派
    
    豫东调:
      中心: 商丘
      别称: 东路调
      特色: 高亢激昂，男声唱腔铿锵有力
      代表人物: 唐玉成，刘忠河，黄儒秀
      历史地位: 红脸（老生）流派集中地
    
    豫西调:
      中心: 洛阳
      别称: 西府调
      特色: 哀怨深沉悲凉含蓄，适合唱苦戏
      代表人物: 常香玉（融合豫西调），崔兰田
      历史地位: 悲剧唱腔的代表
    
    沙河调:
      中心: 漯河/周口/安徽阜阳
      别称: 本地梆
      特色: 融合各调特点，兼具南北特色
      代表人物: 李家玉，易湘山，王仲华
      历史地位: 豫东南特色流派
    
    现代戏流派:
      中心: 郑州（河南豫剧院三团）
      特色: 综合吸收四大地域流派，融入歌剧元素，科学发音
      代表人物: 杨兰春（编剧导演），汪荃珍，杨红霞
      代表剧目: 朝阳沟，焦裕禄，刘胡兰，李双双
      历史地位: 豫剧现代化的代表
  
  各行当流派:
    须生红脸流派:
      唐门:
        创始人: 唐玉成
        行当: 老生（红脸）
        特色: 豫东调红脸奠基人
        
      唐派:
