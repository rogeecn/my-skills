    总剧目数: 755
    传统戏（1956年统计647个）: 收录约700+个传统剧目名称（含别名）
    数据来源: 《豫剧传统剧目考略》（逸空馆主整理）、百度百科、戏曲文化网、ximice戏曲百科等
