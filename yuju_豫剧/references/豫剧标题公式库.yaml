豫剧标题公式库:
  说明: 豫剧公众号标题公式+情感触发词+适用约束
  
  标题公式:
    知名剧目型:
      公式: "{知名剧目}凭什么{传播描述}"
      适用品类: [经典剧目, 河南文化]
      适用受众: [文化爱好者, 河南老乡, 传统艺术好奇者]
      示例: "花木兰凭什么传唱70年不衰", "朝阳沟凭什么成了河南人的集体记忆"
    
    名家揭秘型:
      公式: "{名家}的{特色}到底有什么秘密"
      适用品类: [流派名家, 唱腔音乐]
      适用受众: [老戏迷, 文化爱好者]
      示例: "陈素真美腔背后的技术秘密", "常派劲腔为什么这么有力量感"
    
    身份认同型:
      公式: "为什么只有{身份词}才能{体验描述}"
      适用品类: [河南文化, 经典剧目]
      适用受众: [河南老乡]
      示例: "为什么只有河南人才能听出花木兰的那个味", "为什么只有河南人才懂穆桂英挂帅的燃"
    
    入门解密型:
      公式: "{入门概念}你真的懂吗/{入门概念}原来这么{形容词}"
      适用品类: [豫剧科普, 唱腔音乐]
      适用受众: [文化爱好者, 传统艺术好奇者]
      示例: "豫剧二八板你真的懂吗", "豫剧行当原来这么有意思"
    
    破圈惊叹型:
      公式: "{破圈事实}这可能是你第一次{体验}"
      适用品类: [传承创新, 人物故事]
      适用受众: [年轻传承者]
      示例: "程婴救孤登上好莱坞舞台，这可能是你第一次觉得豫剧很酷"
    
    对比冲击型:
      公式: "{A}和{B}的{差异维度}区别比你想的大"
      适用品类: [流派名家, 豫剧科普, 唱腔音乐]
      适用受众: [老戏迷, 传统艺术好奇者]
      示例: "豫剧包公和京剧包公的区别比你想的大", "陈派和常派的区别不在唱腔而在美学"
    
    故事沉浸型:
      公式: "{人物}{动词}{震撼事件}背后{隐藏真相}"
      适用品类: [人物故事, 流派名家]
      适用受众: [文化爱好者, 年轻传承者, 河南老乡]
      示例: "常香玉捐一架飞机背后不为人知的故事", "陈素真被逐出剧团后如何涅槃重生"
    
    情感共鸣型:
      公式: "{情感场景}每个{身份词}都{共鸣词}"
      适用品类: [河南文化, 人物故事]
      适用受众: [河南老乡]
      示例: "听到谁说女子不如男那一刻，每个河南人都热血沸腾"
    
    知识震撼型:
      公式: "{震撼数据/事实}你知道吗{补充}"
      适用品类: [沿革历史, 唱腔音乐]
      适用受众: [文化爱好者, 传统艺术好奇者]
      示例: "豫剧传统剧目有1000多个你知道吗", "豫剧曲牌有300多个你知道吗"
    
    传承追问型:
      公式: "{传承现状描述}谁来{责任词}"
      适用品类: [传承创新, 流派名家]
      适用受众: [老戏迷, 文化爱好者]
      示例: "六大名旦只剩记忆谁来接棒", "豫剧观众越来越少谁来拯救"
    
    时代映射型:
      公式: "{豫剧角色/剧目}给{当代场景}的{启示词}"
      适用品类: [经典剧目, 传承创新]
      适用受众: [年轻传承者, 文化爱好者]
      示例: "花木兰给当代女性的勇气课", "穆桂英挂帅给中年人的第二春启示"
    
    地域骄傲型:
      公式: "豫剧{骄傲事实}你可能不知道"
      适用品类: [沿革历史, 河南文化]
      适用受众: [河南老乡, 传统艺术好奇者]
      示例: "豫剧是中国第一大地方剧种你可能不知道", "豫剧到过台湾你可能不知道"
    
    名段解析型:
      公式: "逐句解析{名段}每一句都是{评价词}"
      适用品类: [经典剧目, 唱腔音乐]
      适用受众: [老戏迷]
      示例: "逐句解析谁说女子不如男每一句都是女性宣言", "逐句解析辕门外三声炮每一句都是家国情怀"
    
    视觉冲击型:
      公式: "{视觉元素}原来这么{形容词}"
      适用品类: [服饰化妆]
      适用受众: [年轻传承者, 文化爱好者]
      示例: "豫剧脸谱原来这么酷", "豫剧水袖原来这么美"
    
    抗战家国型:
      公式: "{抗战故事}豫剧人{行为词}"
      适用品类: [沿革历史, 人物故事]
      适用受众: [河南老乡, 文化爱好者]
      示例: "抗战义演捐飞机豫剧人从不缺席", "宁为剑下鬼不做亡国奴豫剧人的抗战宣言"
    
    问答吸引型:
      公式: "{疑问词}{热门话题}答案藏在{豫剧维度}"
      适用品类: [豫剧科普, 唱腔音乐, 沿革历史]
      适用受众: [文化爱好者, 传统艺术好奇者]
      示例: "为什么豫剧叫豫剧答案藏在70年前的一场改名", "为什么豫剧比京剧接地气答案藏在河南方言里"
    
    现场体验型:
      公式: "第一次看{演出描述}我{体验词}"
      适用品类: [豫剧现场, 经典剧目]
      适用受众: [年轻传承者, 文化爱好者]
      示例: "第一次现场看穆桂英挂帅我震撼了", "第一次听二八板我泪目了"
  
  情感触发词:
    焦虑触发:
      适用: [传承追问型, 知识震撼型]
      词库: [越来越少, 失传, 无人接棒, 消失, 遗忘, 后继无人, 走不动]
      约束: 老戏迷可用焦虑开头但中段必须转为赋能叙事
    
    共鸣触发:
      适用: [身份认同型, 情感共鸣型, 地域骄傲型]
      词库: [家乡味, 听到就想家, 血脉, 骨子里, 每个河南人, 乡愁, 记忆]
    
    好奇触发:
      适用: [入门解密型, 对比冲击型, 问答吸引型]
      词库: [真的懂吗, 原来这么, 区别比你想的, 答案藏在, 你可能不知道]
    
    权威触发:
      适用: [名家揭秘型, 名段解析型]
      词库: [技术秘密, 逐句解析, 唱腔密码, 专业解读]
    
    温暖触发:
      适用: [故事沉浸型, 时代映射型]
      词库: [不为人知, 涅槃重生, 给当代的启示, 第二春, 从不缺席]
    
    燃触发:
      适用: [破圈惊叹型, 抗战家国型]
      词库: [很酷, 破圈, 震撼, 燃, 血脉觉醒, 从不缺席]
    
    赋能触发:
      适用: [时代映射型, 破圈惊叹型]
      词库: [勇气课, 启示, 第二人生, 也能, 值得, 打破偏见]
  
  叙事基调选择规则:
    老戏迷选题: 焦虑型可开头但中段必须转为赋能叙事
    文化爱好者选题: 温暖型和好奇型各占一半
    年轻传承者选题: 一律使用燃型或赋能型
    河南老乡选题: 共鸣型为主，偶尔用温暖型
    传统艺术好奇者选题: 好奇型和权威型各占一半
    跨品类交叉选题: 一律使用赋能型叙事
    抗战类事件: 一律家国/燃型，禁止焦虑
    名家逝世纪念: 一律温暖/共鸣，禁止焦虑
    非遗纪念日: 温暖开头+赋能结尾