豫剧内容品类交叉矩阵:
  说明: 11个内容品类×5类受众×52周时令×4类事件的交叉推导规则，支撑2-3年选题
  
  交叉推导公式:
    基础选题: A_子品类 × B_受众类型 × C_时令周期
    事件选题: A_子品类 × B_受众类型 × C2_专项事件
    交叉选题: A1_子品类 × A2_子品类 × B_受众类型 × (C_时令 | C2_事件)
  
  子品类列表:
    A1_流派名家:
      子项: [六大名旦专题, 旦角流派对比, 须生红脸名家, 花脸丑角名家, 小生流派, 当代名家, 名家轶事, 名家师生传承]
      高度兼容品类: [A2_经典剧目, A4_唱腔音乐]
    
    A2_经典剧目:
      子项: [女将英雄戏, 包公戏, 爱情婚姻戏, 历史忠义戏, 现代戏经典, 名段赏析, 唱腔解析, 版本对比]
      高度兼容品类: [A1_流派名家, A4_唱腔音乐, A6_河南文化]
    
    A3_豫剧科普:
      子项: [如何看懂豫剧, 行当入门, 唱腔入门, 与京剧区别, 豫剧术语解读, 豫剧礼仪]
      高度兼容品类: [A7_人物故事, A5_沿革历史]
    
    A4_唱腔音乐:
      子项: [板式体系, 地域流派唱腔对比, 曲牌体系, 文场武场乐器, 名段唱腔技术解析]
      高度兼容品类: [A1_流派名家, A2_经典剧目]
    
    A5_沿革历史:
      子项: [起源与早期发展, 樊粹庭陈素真改革, 抗战时期豫剧, 新中国豫剧发展, 台湾豫剧史, 两岸交流史, 新时代发展]
      高度兼容品类: [A6_河南文化, A7_人物故事]
    
    A6_河南文化:
      子项: [豫剧与中原文化, 豫剧与河南方言, 乡村戏台记忆, 梨园春现象, 送戏下乡, 豫剧与河南身份认同]
      高度兼容品类: [A2_经典剧目, A5_沿革历史]
    
    A7_人物故事:
      子项: [名家人生传记, 抗战义演故事, 常香玉捐飞机, 剧团往事, 学戏经历, 艺术家与时代]
      高度兼容品类: [A1_流派名家, A3_豫剧科普]
    
    A8_传承创新:
      子项: [非遗保护, 新编戏创作, 跨界合作, 短视频传播, 年轻演员培养, 豫剧走出去, 科技赋能]
      高度兼容品类: [A9_豫剧现场, A10_豫剧影视]
    
    A9_豫剧现场:
      子项: [演出报道, 名段视频推荐, 演出预告, 梨园春赛况, 豫剧节活动]
      高度兼容品类: [A8_传承创新, A2_经典剧目]
    
    A10_豫剧影视:
      子项: [戏曲电影, 短视频改编, 电视栏目, 豫剧纪录片]
      高度兼容品类: [A8_传承创新, A2_经典剧目]
    
    A11_服饰化妆:
      子项: [豫剧脸谱, 行头服饰, 水袖功, 化妆艺术, 舞台装置]
      高度兼容品类: [A4_唱腔音乐, A1_流派名家]
  
  受众类型:
    B1_老戏迷: 50-80岁，专业深挖型
    B2_文化爱好者: 30-50岁，文化桥梁型
    B3_年轻传承者: 20-35岁，破圈传播型
    B4_河南老乡: 25-60岁，情感认同型
    B5_传统艺术好奇者: 18-40岁，比较认知型
  
  时令周期:
    C_时令: 52周节庆纪念日（详见豫剧全年节庆纪念日日历.yaml）
  
  专项事件:
    C2_事件:
      E1_名家逝世纪念: 陈素真纪念、常香玉纪念、马金凤纪念等
      E2_非遗纪念日: 5月20日非遗名录纪念日
      E3_豫剧节/赛事: 中国豫剧艺术节、梨园春年度赛
      E4_新戏首演: 重要新编戏首演
      E5_名家诞辰: 六大名旦诞辰纪念
  
  跨品类交叉组合:
    组合1_流派名家×经典剧目:
      推导公式: A1_名家 + A2_剧目 → 名家与代表作的深度连接
      标题交叉模式: "{名家}为什么把{剧目}唱成了绝唱"
      示例选题:
        - 陈素真为什么把宇宙锋唱成了豫剧天花板
        - 马金凤和穆桂英挂帅60年不解之缘
        - 常香玉的花木兰凭什么传唱70年
    
    组合2_河南文化×经典剧目:
      推导公式: A6_河南文化 + A2_剧目 → 地域文化赋予经典剧目的底色
      标题交叉模式: "{剧目}为什么只有河南人才能唱出那个味"
      示例选题:
        - 朝阳沟为什么只有河南人能唱出那种味道
        - 花木兰里的河南方言你注意过吗
        - 豫剧包公比京剧包公更接地气的秘密
    
    组合3_传承创新×人物故事:
      推导公式: A8_传承 + A7_人物 → 从名家故事看传承困境与突破
      标题交叉模式: "从{名家}的故事看豫剧{传承话题}"
      示例选题:
        - 从常香玉捐飞机到今天的豫剧传承困境
        - 陈素真被逐出剧团后如何涅槃重生
        - 六大名旦只剩记忆，谁来接棒
    
    组合4_豫剧科普×沿革历史:
      推导公式: A3_科普 + A5_历史 → 用入门知识串联历史脉络
      标题交叉模式: "豫剧{科普概念}背后的{历史故事}"
      示例选题:
        - 豫剧为什么叫豫剧而不是河南梆子
        - 二八板是怎么来的，樊粹庭的改革功不可没
        - 豫剧四大调到底有什么区别
    
    组合5_唱腔音乐×流派名家:
      推导公式: A4_唱腔 + A1_名家 → 用唱腔技术解构名家特色
      标题交叉模式: "{名家}的{唱腔特色}到底有什么技术秘密"
      示例选题:
        - 陈素真美腔背后的水袖功和哑剧技巧
        - 常派劲腔为什么这么有力量感
        - 崔派悲腔到底悲在哪里
    
    组合6_传承创新×豫剧影视:
      推导公式: A8_传承 + A10_影视 → 豫剧在新媒体时代的破圈
      标题交叉模式: "豫剧{新媒介形式}如何让年轻人{情感词}"
      示例选题:
        - 豫剧短视频如何让90后第一次爱上戏曲
        - 程婴救孤从百老汇到好莱坞的破圈之路
        - 梨园春为什么能成为河南人的集体记忆
  
  多样性规则:
    - 每批3-5个选题必须覆盖至少2个不同品类
    - 每批必须包含至少1个跨品类交叉选题
    - 每批必须包含至少1个与时令或事件绑定的选题
    - 受众类型不能同一批全部同一类
    - 禁止连续3批选题来自同一品类
  
  选题类型标注:
    基础选题: 单品类×单受众×时令
    事件选题: 单品类×单受众×专项事件
    交叉选题: 双品类×单受众×（时令|事件）