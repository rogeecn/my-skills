豫剧平台适配指南:
  说明: 豫剧公众号内容在6个平台的适配规格
  
  微信公众号:
    内容形式: 长文为主，偶尔图文合集
    字数范围: 1200-2500字
    标题风格: 知名剧目型、名家揭秘型、身份认同型为主，15字以内
    排版规格: 极简排版，不堆砌小标题，靠口语化转场推进。唯一例外是名段推荐类才用数字编号
    图片规格: 1-3张名家剧照或演出照片，不堆砌
    推送频率: 每周2-3篇
    互动设计: 结尾设一个提问引导评论
  
  抖音:
    内容形式: 短视频口播
    时长: 30-60秒
    标题风格: 破圈惊叹型、视觉冲击型，10字以内
    内容规格: 名段解读+名家故事30秒精华版
    画面: 名家演出片段+口播配合
    推送频率: 每天1条
  
  视频号:
    内容形式: 中短视频口播
    时长: 60-120秒
    标题风格: 情感共鸣型、故事沉浸型
    内容规格: 走心版解读，慢节奏叙事
    画面: 演出片段穿插+口播
    推送频率: 每周3-5条
  
  小红书:
    内容形式: 9图图文笔记
    图片数量: 9图
    标题风格: 视觉冲击型、入门解密型
    内容重点: 豫剧美学维度为主（脸谱、水袖、服饰、化妆）
    文字量: 200-500字配图
    推送频率: 每周1-2篇
  
  B站:
    内容形式: 5-15分钟深度视频
    标题风格: 名段解析型、对比冲击型、问答吸引型
    内容重点: 专业深度科普+名段逐句解析+剧种对比
    画面: 剧目片段+技术解读+字幕标注
    推送频率: 每周1条
  
  头条号:
    内容形式: 深度长文
    字数范围: 1500-3000字
    标题风格: 知识震撼型、地域骄傲型
    内容重点: 豫剧历史深度、河南文化连接、名家传记
    推送频率: 每周2-3篇