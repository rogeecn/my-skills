  标题模式总结:
    最常见模式排名:
      1. 合集盘点型（"xxx专辑" "一次看过瘾"）— 约30%
      2. 剧目推荐型（"豫剧《xxx》"）— 约25%
      3. 名家专辑型（"xxx名家名段专辑"）— 约20%
      4. 深度解读型 — 约10%
      5. 破圈传播型 — 约5%
      6. 人物故事型 — 约5%
      7. 其他 — 约5%
    
    竞争空白标题模式:
      完全没有被使用的标题类型:
        - 逐句名段解析型（"逐句解析辕门外三声炮每一句都是家国情怀"）
        - 唱腔技术故事型（"二八板是怎么来的樊粹庭的改革功不可没"）
        - 豫剧科普活人感型（"第一次看穆桂英挂帅我震撼了"）
        - 身份认同型（"为什么只有河南人才能听出花木兰的那个味"）
        - 名家深度故事型（"常香玉捐一架飞机背后不为人知的故事"）
        - 对比冲击型（"豫剧包公和京剧包公的区别比你想的大")