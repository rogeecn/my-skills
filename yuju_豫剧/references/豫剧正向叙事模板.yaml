豫剧正向叙事模板:
  说明: 赋能型情感触发和叙事基调选择规则
  
  赋能型叙事:
    定义: 不以危机开头，而是以可能性开头。不讲"豫剧要消失了"，讲"豫剧正在活过来"
    赋能标题公式:
      - 时代映射型: "{豫剧角色}给当代人的{启示词}"
      - 破圈惊叹型: "豫剧{新事实}这可能是你第一次{体验词}"
      - 赋能触发型: "{经典元素}值得你{行动词}"
    赋能叙事大纲模板:
      大纲1_可能性开头型:
        - 开头：一个正在发生的好事/新突破/年轻人的加入
        - 发展1：这件事的背景和意义
        - 发展2：展开具体的证据和细节
        - 转折：回顾过去的困境（但不是为了焦虑，是为了对比）
        - 高潮：现在的突破意味着什么
        - 结尾：呼吁读者参与/关注
      
      大纲2_经典再发现型:
        - 开头：一个你可能忽略的经典价值
        - 发展1：为什么这个经典在今天还有生命力
        - 发展2：具体展开这个经典的多维度价值
        - 转折：谁在传承/谁在创新
        - 高潮：这个经典给当代人的启示
        - 结尾：鼓励读者去体验
      
      大纲3_传承接力型:
        - 开头：一个年轻传承者的故事
        - 发展1：他/她为什么选择豫剧
        - 发展2：传承过程中的困难和突破
        - 转折：前辈的期望和托付
        - 高潮：接力棒已经传过来了
        - 结尾：展望未来
  
  叙事基调选择规则:
    老戏迷选题: 可焦虑开头但中段必须转为赋能叙事
    文化爱好者选题: 温暖型和好奇型各占一半
    年轻传承者选题: 一律使用燃型或赋能型
    河南老乡选题: 共鸣型为主，偶尔温暖型
    传统艺术好奇者选题: 好奇型和权威型各占一半
    跨品类交叉选题: 一律使用赋能型叙事
    
    抗战类事件: 一律家国/燃型，禁止焦虑
    名家逝世纪念: 一律温暖/共鸣，禁止焦虑
    非遗纪念日: 温暖开头+赋能结尾
    新戏首演: 赋能型
    演出报道: 温暖型
    名段解析: 权威型+温暖结尾
    科普入门: 好奇型