跨年龄段品类演变:
  健康养生:
    演变线: "预防→管理→应对"
    45-60核心心态: "我不想生病"
    55-70核心心态: "我在控制病情"
    65-80核心心态: "我正在应对疾病"
    45-60最佳叙事: "这样做可以更好"
    55-70最佳叙事: "这样做可以稳住"
    65-80最佳叙事: "这样做可以应对"
  家庭关系:
    演变线: "重塑→处理→维系"
    45-60核心场景: "子女独立期边界调整"
    55-70核心场景: "隔代教育矛盾"
    65-80核心场景: "空巢情感纽带"
    45-60最佳叙事: "学会放手"
    55-70最佳叙事: "找到平衡"
    65-80最佳叙事: "彼此理解"
  财富理财:
    漇变线: "规划→守住→保障"
    45-60核心心态: "钱够不够+能不能多一点"
    55-70核心心态: "钱不能少+不能被骗"
    65-80核心心态: "钱够看病+安排好身后事"
  社交情感:
    演变线: "维护→融入→支撑"
    45-60核心需求: "社交圈主动维护"
    55-70核心需求: "社区重新融入"
    65-80核心需求: "陪伴感与被听见"

关键洞察:
  - 健康品类贯穿所有年龄段为第一大品类，但切入角度必须随年龄调整
  - 情感品类需求随年龄递增：45-60轻描淡写→55-70正视→65-80核心刚需
  - 45-60独特品类是"生活方式"——唯一对"第二人生设计"有强烈需求的年龄段
  - 55-70独特痛点是"隔代教育"和"手机求生"
  - 65-80独特需求是"怀旧+陪伴"——兴趣娱乐功能从社交载体变为情感疗愈
  - 防骗是55-70和65-80的跨品类刚需
  - 内容节奏必须随年龄段降速：45-60快→55-70中速清晰→65-80慢速重复大字