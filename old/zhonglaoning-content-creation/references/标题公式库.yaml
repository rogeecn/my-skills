标题公式:
  年龄必知型:
    公式: "{年龄段}后{必知/必做/一定要/千万要}{数字}个{品类关键词}"
    适用品类: [健康养生, 实用技能, 退休规划]
    适用年龄段: [45-55, 55-65, 65-75]
    情感触发: [焦虑触发, 权威触发]
    数字规律: 年龄用50/55/60/65/70，数量用3/5/7
    示例:
      - "50岁后必须知道的3个养生习惯"
      - "60岁后一定要做的5件大事"
      - "55岁后千万要记住的7条健康忠告"
      - "65岁后必知的4个饮食禁忌"
      - "70岁后必须准备的3样东西"

  数字痛点型:
    公式: "{高比例数字}%的{中老年/老人/人}{忽略/不知道/没注意/搞错了}{痛点关键词}"
    适用品类: [健康养生, 生活常识, 防骗科普]
    适用年龄段: [45-55, 55-65, 65-75]
    情感触发: [焦虑触发, 好奇触发]
    数字规律: 比例用90%/80%/95%/99%，制造紧迫感
    示例:
      - "90%的中老年人都忽略了这个健康信号"
      - "80%的老人不知道这样走路更健康"
      - "95%的人都搞错了这个养生方法"
      - "99%的人不知道这个省钱小妙招"
      - "90%的退休人员都错过了这项福利"

  身份共鸣型:
    公式: "{身份状态}后{才明白/终于懂了/才领悟/才看清}{感悟关键词}"
    适用品类: [情感故事, 人生感悟, 退休生活]
    适用年龄段: [55-65, 65-75]
    情感触发: [共鸣触发, 温暖触发]
    数字规律: 不强调数字，侧重身份词如退休/空巢/当妈
    示例:
      - "退休后才明白的道理"
      - "当妈后才终于懂了的心酸"
      - "空巢后才看清的现实"
      - "老了后才领悟的人生真相"
      - "送走父母后才明白的事"

  疑问好奇型:
    公式: "为什么{越来越多/这么多人/很多老人}{选择/喜欢/偏爱}{好奇关键词}？"
    适用品类: [健康养生, 生活趋势, 新事物科普]
    适用年龄段: [45-55, 55-65]
    情感触发: [好奇触发]
    示例:
      - "为什么越来越多的老人选择回农村？"
      - "为什么这么多人开始喝这个茶？"
      - "为什么很多老人偏爱早起散步？"

  对比反常识型:
    公式: "你以为的{品类词}{其实/反而/居然}{反常识结论}"
    适用品类: [健康养生, 生活常识, 防骗科普]
    适用年龄段: [45-55, 55-65, 65-75]
    情感触发: [好奇触发, 焦虑触发]
    示例:
      - "你以为的养生，其实在伤身"
      - "你以为在省钱，其实亏更多"
      - "你以为的清淡饮食，反而不健康"

  温暖情感型:
    公式: "{亲情对象/场景}{的一句话/一个动作/一件事}{让我泪流满面/让我红了眼眶}"
    适用品类: [情感故事, 亲情回忆, 节日温情]
    适用年龄段: [55-65, 65-75]
    情感触发: [温暖触发, 共鸣触发]
    示例:
      - "妈妈的一句话，让我泪流满面"
      - "老伴的一个动作，让我红了眼眶"
      - "孙子的一句话，让全家都笑了"

  经验分享型:
    公式: "我用了{时间/方法}{这个方法/这个习惯}{结果}好了很多/改善了"
    适用品类: [健康养生, 生活技能, 美食烹饪]
    适用年龄段: [55-65, 65-75]
    情感触发: [共鸣触发, 好奇触发]
    示例:
      - "我用了这个方法，睡眠好了很多"
      - "我坚持了这个习惯1个月，血压降了"
      - "我试了这个窍门，关节不疼了"

  身份转变型:
    公式: "{转变前身份}变成{转变后身份}{才/后}{感悟关键词}"
    适用品类: [退休生活, 人生感悟, 情感故事]
    适用年龄段: [55-65]
    情感触发: [共鸣触发, 好奇触发]
    示例:
      - "从职场到退休，才懂什么是自由"
      - "从当媳妇到当婆婆后才明白的事"
      - "从一家之主到空巢老人后的生活"

  警示后果型:
    公式: "{行为/习惯}{正在/悄悄/慢慢}{伤身/毁健康/缩短寿命}"
    适用品类: [健康养生, 生活常识]
    适用年龄段: [45-55, 55-65, 65-75]
    情感触发: [焦虑触发, 权威触发]
    示例:
      - "这个习惯正在悄悄缩短你的寿命"
      - "每天这样做正在毁你的健康"
      - "久坐不动悄悄害了多少老人"

  时代回忆型:
    公式: "{年代关键词}的{人/事/回忆}{才知道/还记得/都经历过}"
    适用品类: [怀旧回忆, 人生感悟, 节日温情]
    适用年龄段: [55-65, 65-75]
    情感触发: [共鸣触发, 温暖触发]
    示例:
      - "60年代的人才知道的苦"
      - "50后都经历过这些事"
      - "80年代的回忆看了都泪目"

  关系感悟型:
    公式: "到了{年龄段/这个年纪}{才看清/才明白}{关系关键词}的真相"
    适用品类: [情感故事, 人生感悟, 家庭关系]
    适用年龄段: [55-65, 65-75]
    情感触发: [共鸣触发, 温暖触发, 焦虑触发]
    示例:
      - "到了60岁才看清亲情的真相"
      - "退休后才明白邻居比亲戚亲"
      - "老了才看清子女的心"

  日常发现型:
    公式: "{日常场景/动作}时{发现/注意到/才知道}{发现关键词}"
    适用品类: [生活常识, 生活技能, 健康养生]
    适用年龄段: [45-55, 55-65, 65-75]
    情感触发: [好奇触发, 共鸣触发]
    示例:
      - "买菜时才发现这个窍门"
      - "遛弯时发现这个公园真不错"
      - "看电视时才知道这个健康知识"

  名人权威型:
    公式: "{权威人物/专家/医生}{提醒/说/警告/建议}{中老年}{健康/生活关键词}"
    适用品类: [健康养生, 生活常识]
    适用年龄段: [55-65, 65-75]
    情感触发: [权威触发, 焦虑触发]
    示例:
      - "老中医提醒：50岁后少吃这3样"
      - "医生警告：这个习惯比吸烟还伤身"
      - "营养师提醒：这5种食物别再吃了"

  对比选择型:
    公式: "{选项A}还是{选项B}？{中老年}{到底/真正}应该选{正确选项}"
    适用品类: [健康养生, 退休理财, 生活常识]
    适用年龄段: [45-55, 55-65]
    情感触发: [好奇触发, 焦虑触发]
    示例:
      - "散步还是跑步？50岁后应该选哪个"
      - "喝牛奶还是喝豆浆？老人真正该选的是它"
      - "存钱还是花钱？退休后到底怎么做"

  误解纠正型:
    公式: "很多人都{误解/搞错/以为/信了}的{品类关键词}{其实/真相是}"
    适用品类: [健康养生, 生活常识, 防骗科普]
    适用年龄段: [45-55, 55-65, 65-75]
    情感触发: [焦虑触发, 好奇触发, 权威触发]
    示例:
      - "很多人都搞错的降压方法，真相是这样的"
      - "很多人都信了的这3个谣言，真相是..."
      - "很多人都以为的养生误区，其实伤身体"

  步骤实操型:
    公式: "{简单数字}步/分钟/个动作/搞定/学会{品类关键词}"
    适用品类: [生活技能, 美食烹饪, 手机教程]
    适用年龄段: [45-55, 55-65, 65-75]
    情感触发: [好奇触发, 共鸣触发]
    示例:
      - "3步搞定一道养胃粥"
      - "5分钟学会用手机挂号"
      - "1个动作缓解肩膀酸痛"

  状态变化型:
    公式: "从{负面状态}到{正面状态}{我只做了/用了}{数字}个{方法/改变}"
    适用品类: [健康养生, 退休生活, 人生感悟]
    适用年龄段: [45-55, 55-65]
    情感触发: [共鸣触发, 好奇触发]
    示例:
      - "从失眠到好睡眠，我只做了3个改变"
      - "告别腰疼，我只坚持了1个动作"
      - "从焦虑到安心，退休后我用了这5个方法"

  简单高效型:
    公式: "只需/只要{简单条件/动作}{就能/就可以}{效果关键词}"
    适用品类: [健康养生, 生活技能, 美食烹饪]
    适用年龄段: [55-65, 65-75]
    情感触发: [好奇触发, 共鸣触发]
    示例:
      - "只需每天5分钟，就能养好你的胃"
      - "只要做这个动作，就可以缓解腰疼"
      - "只需1种食材，就能做出养生汤"

情感触发词分类:
  焦虑触发:
    核心词: [忽略, 危险, 伤身, 后悔, 错过, 亏了, 上当, 被骗, 悄悄, 正在, 慢慢, 缩短, 毁, 害, 警告, 提醒, 警惕, 别再, 千万别, 大错特错]
    适用品类: [健康养生, 防骗科普, 生活常识]
  共鸣触发:
    核心词: [才明白, 终于懂了, 原来, 说实话, 感慨, 心酸, 遗憾, 同感, 过来人, 经历过]
    适用品类: [情感故事, 人生感悟, 退休生活]
  好奇触发:
    核心词: [揭秘, 真相, 秘密, 为什么, 竟然, 万万没想到, 惊人, 到底, 才发现, 神奇]
    适用品类: [健康养生, 生活常识, 新事物科普]
  权威触发:
    核心词: [专家说, 医生提醒, 研究证明, 权威, 老中医, 主任医师, 教授, 官方, 证实]
    适用品类: [健康养生, 生活常识]
  温暖触发:
    核心词: [感动, 泪目, 暖心, 幸福, 美好, 珍贵, 珍惜, 感恩, 温情, 思念, 红了眼眶, 泪流满面, 哭了, 笑了]
    适用品类: [情感故事, 亲情回忆, 节日温情]

数字使用规律:
  年龄数字:
    常用值: [45, 50, 55, 60, 65, 70]
    规律: 用整数门槛年龄制造分界感，50/60最高频
  数量数字:
    常用值: [3, 5, 7, 10]
    规律: 偏好小奇数，3个最可信最易记
  比例数字:
    常用值: [90%, 80%, 95%, 99%]
    规律: 高比例制造紧迫感，90%最高频
  时间数字:
    常用值: [1分钟, 3分钟, 5分钟, 1个月, 3个月]
    规律: 短时间降低门槛，1分钟/5分钟最吸引
  金钱数字:
    常用值: [100块, 几百块, 几千块, 几万块]
    规律: 具体小数字增强真实感

品类标题风格差异:
  健康养生:
    主公式: [年龄必知型, 数字痛点型, 警示后果型, 名人权威型]
    情感偏好: [焦虑触发+权威触发]
    数字偏好: 高比例+小数量组合
    高频词: [养生, 健康, 伤身, 寿命, 血压, 血糖, 骨头, 胃, 心脏, 睡眠]
  情感故事:
    主公式: [温暖情感型, 身份共鸣型, 关系感悟型, 时代回忆型]
    情感偏好: [温暖触发+共鸣触发]
    数字偏好: 少用或只用年龄/年代数字
    高频词: [妈妈, 老伴, 父母, 子女, 回忆, 泪目, 感动, 思念, 家, 亲情]
  生活技能:
    主公式: [步骤实操型, 简单高效型, 日常发现型, 经验分享型]
    情感偏好: [好奇触发+共鸣触发]
    数字偏好: 短时间+少步骤
    高频词: [窍门, 方法, 诀窍, 一招, 轻松, 简单, 实用, 搞定, 妙招]
  退休理财:
    主公式: [数字痛点型, 对比选择型, 年龄必知型, 警示后果型]
    情感偏好: [焦虑触发+权威触发]
    数字偏好: 金钱数字+比例数字组合
    高频词: [退休金, 养老, 存款, 福利, 政策, 补贴, 省钱, 规划]
  休闲娱乐:
    主公式: [疑问好奇型, 对比反常识型, 时代回忆型, 日常发现型]
    情感偏好: [好奇触发+共鸣触发]
    数字偏好: 少用或只用年代数字
    高频词: [有意思, 涨知识, 原来如此, 太神奇了, 好玩, 开心]

年龄段标题偏好差异:
  45-55岁:
    偏好公式: [数字痛点型, 警示后果型, 对比选择型, 名人权威型]
    偏好情感: 焦虑触发为主+权威触发
    偏好数字: 高比例+年龄门槛(50岁后)
    标题风格: 紧迫感强、信息量大、偏理性
  55-65岁:
    偏好公式: [身份共鸣型, 温暖情感型, 关系感悟型, 经验分享型]
    偏好情感: 共鸣触发为主+温暖触发
    偏好数字: 年龄+时间(1个月/3个月)
    标题风格: 感性温和、娓娓道来、偏感性
  65-75岁:
    偏好公式: [简单高效型, 步骤实操型, 时代回忆型, 温暖情感型]
    偏好情感: 温暖触发为主+共鸣触发
    偏好数字: 短时间+少步骤(1分钟/3步)
    标题风格: 极简直白、亲情味浓、门槛低