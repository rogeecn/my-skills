边框花边体系:
  中国传统纹样边框:
    - 云纹边框: 蓝白色祥云纹样环绕版面四边，搭配金色描边，适用于爱国/国庆/建军类手抄报
    - 回纹边框: 几何回字纹样连续排列，古朴庄重，适用于历史/传统文化类手抄报
    - 如意纹边框: 如意头形纹样，圆润吉祥，适用于春节/喜庆类手抄报
    - 龙纹边框: 金龙纹样盘绕边框，威严华贵，适用于龙年/国庆/建军类手抄报
    - 祥瑞纹边框: 凤凰牡丹纹样，华美喜庆，适用于节日/喜庆类手抄报
    - 青花纹边框: 蓝白青花瓷纹样，典雅清新，适用于文化/节气类手抄报

  自然植物花边:
    - 春花边框: 樱花桃花郁金香交替排列，粉色渐变，适用于春天/三八节/母亲节类手抄报
    - 夏花边框: 向日葵荷花薰衣草交替排列，明黄到深蓝渐变，适用于夏天/儿童节/端午类手抄报
    - 秋叶边框:枫叶银杏叶橡树叶交替排列，橙红到金黄渐变，适用于秋天/中秋/重阳类手抄报
    - 冬雪边框: 雪花松枝冰凌交替排列，蓝白银色渐变，适用于冬天/元旦/圣诞类手抄报
    - 四季边框: 春花夏叶秋果冬雪四季分区排列，适用于节气/全年类手抄报

  节日主题边框:
    - 春节边框: 红底金色灯笼鞭炮春联排列，适用于春节/新年类手抄报
    - 元宵边框: 花灯汤圆灯笼彩带排列，暖橙色系，适用于元宵类手抄报
    - 清明边框: 柳枝风筝燕子春雨排列，浅绿色系，适用于清明类手抄报
    - 端午边框: 龙舟粽子艾草香囊排列，深绿色系，适用于端午类手抄报
    - 中秋边框: 月亮月饼桂花灯笼排列，金橙色系，适用于中秋类手抄报
    - 国庆边框: 红旗五角星天安门华表排列，红色金色系，适用于国庆类手抄报
    - 儿童节边框: 气球糖果礼物蝴蝶排列，彩虹色系，适用于儿童节类手抄报
    - 教师节边框: 书本蜡烛花朵笔排列，暖黄色系，适用于教师节类手抄报
    - 母亲节边框: 康乃馨爱心拥抱手势排列，粉红色系，适用于母亲节类手抄报
    - 父亲节边框: 领带锤子球类手掌排列，蓝灰色系，适用于父亲节类手抄报

  安全警示边框:
    - 交通安全边框: 红绿灯斑马线交通标志排列，红黄绿色系
    - 消防安全边框: 火焰灭火器消防车警报排列，红橙色系
    - 防溺水边框: 水波救生圈禁止游泳标志排列，蓝红色系
    - 防震边框: 地震波安全帽急救包排列，橙黄色系
    - 防拐边框: 警灯盾牌锁头保护标志排列，蓝色系

  学科特色边框:
    - 数学边框: 数字符号几何图形尺子排列，蓝紫色系
    - 语文边框: 书本笔诗词格书法排列，棕黄色系
    - 科学边框: 试管显微镜原子星球排列，深蓝色系
    - 英语边框: 字母单词地球对话排列，浅蓝色系
    - 历史边框: 时间轴古籍印章古城排列，褐色系
    - 地理边框: 地图山脉河流指南针排列，绿色系

  卡通趣味边框:
    - 动物边框: 小猫小狗兔子熊猫交替排列，适用于低年级任意主题
    - 食物边框: 冰蛋糕水果饼干交替排列，适用于健康/营养类手抄报
    - 星空边框: 星星月亮流星行星排列，适用于航天/科学类手抄报
    - 海洋边框: 鱼贝壳海星海豚排列，适用于海洋/环保类手抄报
    - 童话边框: 城堡仙女魔法棒彩虹排列，适用于低年级任意主题

版面布局模板:
  低年级版面布局:
    - 居中大图型: 中央一幅大卡通插图占50%面积，四周简单文字框，1-2段短文
    - 对角分区型: 左上角标题+插图，右下角文字区，整体留白多
    - 横幅标题型: 顶部大标题横幅+彩色横条，下方1-2个插图+简单文字

  中年级版面布局:
    - 三区均衡型: 左侧插图区+中间标题区+右侧文字区，3-4段文字
    - 四宫格型: 四个等分区块，每块含插图+标题+文字
    - 环形排版型: 中心标题环，四周环绕内容块，每个块含小插图+文字
    - 时间轴型: 从上到下或从左到右的时间轴，节点处配插图+文字

  高年级版面布局:
    - 思维导图型: 中心主题发散到5-6个分支，每分支含关键词+短文
    - 瀑布流型: 3-4个竖向内容块并列排列，每块含标题+正文+配图
    - 杂志排版型: 大标题+侧栏+主文区+配图区+引用区，模拟杂志排版
    - 对比双栏型: 左右两栏对比呈现(如:旧vs新/好vs坏/国内vs国外)

色彩搭配方案:
  节日红色系:
    - 中国红+金: #E60012 + #FFD700，春节/国庆/建军
    - 酒红+米白: #8B0000 + #F5F5DC，庄重/纪念类
    - 粉红+浅紫: #FF69B4 + #DDA0DD，三八/母亲节

  安全警示系:
    - 红+黄+黑: #FF0000 + #FFD700 + #000000，消防/危险警示
    - 橙+蓝+白: #FF8C00 + #0066CC + #FFFFFF，交通/通用安全
    - 黄+绿+灰: #FFD700 + #228B22 + #808080，防溺水/校园安全

  自然清新系:
    - 春绿+粉白: #90EE90 + #FFB6C1，春天/植树/环保
    - 夏蓝+明黄: #4169E1 + #FFFF00，夏天/海洋/儿童节
    - 秋橙+深红: #FF8C00 + #B22222，秋天/中秋/重阳
    - 冬蓝+银白: #4682B4 + #C0C0C0，冬天/元旦/雪景

  学科知识系:
    - 蓝紫+白: #6A5ACD + #FFFFFF，数学/科技
    - 棕黄+米白: #8B4513 + #FAEBD7，语文/历史
    - 深蓝+浅蓝: #00008B + #87CEEB，科学/航天
    - 绿色+白: #228B22 + #FFFFFF，地理/自然

  品德温暖系:
    - 暖橙+柔粉: #FF6347 + #FFB6C1，感恩/助人
    - 紫红+金: #800080 + #FFD700，尊师/敬意
    - 橙黄+绿: #FFA500 + #32CD32，文明/礼仪

