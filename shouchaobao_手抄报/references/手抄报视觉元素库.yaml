输出尺寸规格:
  A4横版:
    物理尺寸: 297×210mm
    像素尺寸: 1120×794px(300dpi)
    内容容量: 低1-2框/中3-5框/高5-8框
    插图占比: 低50-60%/中30-40%/高20-30%
    留白比例: 低50%/中30%/高20%
    适用: 个人作业打印提交(最常见)

  A4竖版:
    物理尺寸: 210×297mm
    像素尺寸: 794×1120px(300dpi)
    内容容量: 低1-2框/中3-5框/高5-8框
    适用: 诗歌/时间轴/瀑布流型纵向内容

  半黑板:
    像素尺寸: 约1200×800px
    内容容量: 4-6框
    插图占比: 30-40%
    适用: 班级轮流负责黑板报上半或下半区域

  全黑板:
    像素尺寸: 约2400×1200px
    内容容量: 8-12框(需多人分工)
    插图占比: 25-35%
    适用: 全班合作重大节日黑板报
    特殊要求: 文字需更大更粗(粉笔书写)，标题需醒目(彩色粉笔)

  B4横版:
    物理尺寸: 364×257mm
    像素尺寸: 1360×1020px(300dpi)
    内容容量: 比A4多1-2框
    适用: 需更多内容空间

  小报A3:
    物理尺寸: 420×297mm(两版A4拼合)
    像素尺寸: 1580×1120px(300dpi)
    内容容量: 6-10框(双版分区)
    适用: 学校统一下发小报纸张

  电子分享_小红书:
    像素尺寸: 1080×1440px(3:4竖版)
    内容容量: 2-4框(偏视觉)
    插图占比: 40-50%
    适用: 小红书/公众号线上分享
    特殊要求: 标题醒目种草式/视觉冲击力强/文字精简

  电子分享_公众号封面:
    像素尺寸: 900×506px(16:9横版)
    内容容量: 只展示核心标题+主插图
    适用: 公众号文章封面图

线稿规格补充:
  线稿与预览图的区别:
    线稿: 纯黑白线条画/无色彩填充/白色背景/文字框正文区留空白/只画轮廓线/线条层次分明(边框粗2pt/标题1.5pt/内容框1pt/装饰0.5pt)
    预览图: 完整彩色效果图/所有色号填充/文字框正文有示例文字/插图有细节和色彩/装饰有填色
  线稿用途: 可打印描摹填色填字/作为手抄报制作模板
  预览图用途: 展示完成后效果/作为参考对照

标题字体风格:
  低年级标题: 圆体卡通字/彩虹色填充字/气泡字/粗体描边字
  中年级标题: 手写体/渐变色填充字/花边装饰字/小楷风格字
  高年级标题: 衬线体/书法体/水墨风格字/简约现代体

插图类型分类体系:
  场景图: 完整场景描绘，如"一家人围坐吃年夜饭"，画面有背景环境+人物动作+氛围细节
  人物图: 单人物或人物群像，如"雷锋肖像"，主体为人/动物/虚构角色，无复杂背景
  步骤图: 分步骤展示流程，如"包粽子4步"，通常3-6步纵向排列，每步配简笔小图+文字说明
  对比图: 左右或上下对比呈现，如"正确做法vs错误做法"，两区域视觉对比鲜明(用色/构图差异)
  时间轴图: 时间线配插图，如"航天里程碑"，横向/纵向时间轴+节点处配小插图+日期文字
  数据图: 柱状图/饼图简笔，如"垃圾分类比例"，数据可视化简笔化+配小图标装饰
  符号图标: 小图标集合，如"安全标志集合"，多个独立小图标排列(每个3-5cm)，识别性强
  装饰性插图: 纯装饰无内容信息，如"花朵装饰边角"，填充空白/美化版面，无传达具体知识

插图内容素材库:
  节日纪念:
    春节:
      插图方案1:
        类型: 场景图
        构图: "一家人围坐年夜饭桌 + 红灯笼挂满屋檐 + 互相敬酒祝岁 + 窗外烟花绽放"
        适用年级: 低
        面积占比: 40-50%
        线稿要点: "圆桌轮廓+人物简笔坐姿+灯笼椭圆+烟花放射线条"
      插图方案2:
        类型: 人物图
        构图: "两个儿童放鞭炮 + 红色棉袄 + 一手捂耳一手点炮 + 地上红包散落"
        适用年级: 低
        面积占比: 30-40%
        线稿要点: "儿童站姿轮廓+鞭炮长条+红包矩形+地面线条"
      插图方案3:
        类型: 符号图标
        构图: "春联横批+灯笼串+福字倒贴+鞭炮串+饺子碗 五元素并列排列"
        适用年级: 全
        面积占比: 15-20%
        线稿要点: "各元素独立轮廓：矩形春联+椭圆灯笼+方形福字+长条鞭炮+碗形饺子"
      插图方案4:
        类型: 时间轴图
        构图: "除夕贴春联→初一拜年→初二回娘家→初五迎财神→元宵赏灯 时间轴配插图"
        适用年级: 中高
        面积占比: 20-25%
        线稿要点: "横向箭头线+5个节点圆点+每节点处简笔小图(各5cm宽)"
      插图方案5:
        类型: 步骤图
        构图: "写春联4步：裁红纸→蘸墨→写福字→贴门框 每步配简笔小图"
        适用年级: 中
        面积占比: 20-25%
        线稿要点: "4个方框纵向排列+每框内简笔动作图+箭头连接"

    元宵:
      插图方案1:
        类型: 场景图
        构图: "全家赏花灯逛庙会 + 各色花灯挂满街 + 孩童提兔灯奔跑 + 天空烟花"
        适用年级: 低
        面积占比: 40-50%
        线稿要点: "花灯多边形轮廓+人物行走简笔+兔灯圆形+烟花放射线"
      插图方案2:
        类型: 符号图标
        构图: "花灯(莲花灯)+汤圆碗+兔子灯+舞龙+猜灯谜条 五元素并列"
        适用年级: 全
        面积占比: 15-20%
        线稿要点: "莲花灯花瓣轮廓+碗形+兔形+龙弯曲轮廓+长条谜面"
      插图方案3:
        类型: 步骤图
        构图: "做汤圆3步：揉面团→搓圆球→煮汤圆 每步配简笔图"
        适用年级: 低中
        面积占比: 20-25%
        线稿要点: "3方框纵向+手揉面简笔+球形+锅碗轮廓"

    清明:
      插图方案1:
        类型: 场景图
        构图: "一家人踏青郊游 + 飘柳絮细雨 + 儿童放风筝 + 远处青山轮廓"
        适用年级: 低中
        面积占比: 35-45%
        线稿要点: "柳枝曲线+风筝菱形+人物行走简笔+山起伏线"
      插图方案2:
        类型: 符号图标
        构图: "柳枝+风筝+燕子+菊花+青团 五元素并列排列"
        适用年级: 全
        面积占比: 15-20%
        线稿要点: "柳枝曲线+菱形风筝+鸟形+花瓣轮廓+圆形青团"
      插图方案3:
        类型: 对比图
        构图: "上方：清明传统扫墓祭祖场景 | 下方：清明踏青赏春游玩场景"
        适用年级: 中高
        面积占比: 25-30%
        线稿要点: "两区上下分割+上方庄重线条(碑形+花)+下方活泼线条(风筝+花)"

    劳动节:
      插图方案1:
        类型: 人物图
        构图: "工人农民教师医生四人并列 + 各穿职业服装 + 手持工具 + 微笑姿态"
        适用年级: 中
        面积占比: 25-30%
        线稿要点: "四人站姿轮廓+各职业特征线条(锤/锄/书/针筒)"
      插图方案2:
        类型: 对比图
        构图: "左：脑力劳动者(办公/研究) | 右：体力劳动者(建筑/种植)"
