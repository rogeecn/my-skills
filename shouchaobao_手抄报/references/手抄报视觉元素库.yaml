        线稿要点: "3方框+问号+灯泡+动手姿态简笔"

版面布局选择决策树:
  决策维度: [主题内容量, 年级, 输出目标]
  核心规则:
    - 内容量少_1到2个要点_加_低年级_加_A4横版: 居中大图型(大插图占50%+四周1-2段短文+留白多)
    - 内容量少_1到2个要点_加_低年级_加_A4竖版: 居中大图型竖版(大插图居中偏上+下方1段短文)
    - 内容量少_1到2个要点_加_低年级_加_电子分享小红书: 居中大图型(视觉冲击力优先+插图占60%+文字极简)
    - 内容量中_3到5个要点_加_中年级_加_A4横版: 四宫格型或三区均衡型(4块或3区+每块插图+标题+文字)
    - 内容量中_3到5个要点_加_中年级_加_A4竖版: 时间轴型纵向(从上到下时间轴+节点配插图+文字)
    - 内容量中_3到5个要点_加_中年级_加_半黑板: 四宫格型(粉笔字需大+每块2-3行+插图简洁)
    - 内容量多_5到8个要点_加_高年级_加_A4横版: 思维导图型或瀑布流型(5-6分支或3-4竖块+文字密集)
    - 内容量多_5到8个要点_加_高年级_加_A4竖版: 瀑布流型纵向(3-4个竖向内容块并列+每块标题+正文+配图)
    - 内容量多_5到8个要点_加_高年级_加_B4或A3: 杂志排版型(大标题+侧栏+主文区+配图区+引用区)
    - 内容量多_5到8个要点_加_高年级_加_全黑板: 瀑布流或杂志排版(多人分工+粉笔字需更大更粗+彩色粉笔标题)
    - 任何年级_加_半黑板: 四宫格或三区均衡(粉笔字需粗大+每块内容精简+插图用彩色粉笔)
    - 任何年级_加_全黑板: 瀑布流或杂志排版(多人分工+标题用彩色粉笔+文字行距大+插图简洁大气)
    - 视觉导向_加_电子分享小红书: 居中大图型(视觉冲击力优先+插图占50-60%+文字精简+标题醒目)
    - 视觉导向_加_电子分享公众号封面: 居中大图型(只展示核心标题+主插图+无正文)
  主题特性适配:
    时间轴型主题:
      适用: 历史/航天/节气/抗战/建党建军/国家成就/科学家/校园记忆
      规则: 优先时间轴布局(任何年级均可用+低年级时间轴节点少3-4个+高年级节点多6-8个)
    对比型主题:
      适用: 安全vs危险/好vs坏/正确vs错误/传统vs现代/浪费vs节约/健康vs不健康
      规则: 优先对比双栏布局(中高年级适用+左右两栏视觉差异明显+低年级用上下分区简化)
    思维发散型主题:
      适用: 计划/知识体系/品德体系/学习方法/创新思维/学科知识网络
      规则: 优先思维导图布局(中高年级适用+中心主题发散5-6分支+低年级分支少3-4个)
    步骤流程型主题:
      适用: 实验/制作过程/安全操作/生活技能/植树/刷牙/编程
      规则: 优先步骤图布局(任何年级+低年级3步+中年级4-5步+高年级6步+每步配简笔小图)
    数据展示型主题:
      适用: 统计/比例/对比数据/营养/环保数据/垃圾分类
      规则: 优先数据图+文字混合布局(中高年级+数据图占20-25%+配文字解读+低年级不适用数据图)
  年级适配补充:
    低年级_1到3年级:
      特征: 识字量少+写字慢+绘画能力简单+注意力短
      版面偏好: 居中大图型为主+留白50%以上+文字框大+插图卡通简单+每段文字不超过30字
      避免布局: 思维导图型+杂志排版型+对比双栏型+数据图型(低年级不应使用)
    中年级_4到5年级:
      特征: 识字量中等+写字速度提升+绘画能力增强+能理解分区块
      版面偏好: 四宫格型+三区均衡型+时间轴型+步骤图型+留白30%
      可尝试: 简单思维导图(3-4分支)+简单对比双栏+简单数据饼图
    高年级_6年级及以上:
      特征: 识字量大+写字快+绘画能力较好+能理解复杂布局
      版面偏好: 思维导图型+瀑布流型+杂志排版型+对比双栏+数据图+留白20%
      全部布局均可使用: true

