内容演变线:
  低年级→中年级: 图案为主→图文各半，卡通→写实过渡，简单祝福→知识内容
  中年级→高年级: 知识浅层→深度解读，模板模仿→创意设计，单一分区→多元排版

禁忌:
  低年级:
    - 不可出现恐怖/暴力元素
    - 不可要求大量文字书写
    - 不可使用过于写实/阴暗色调
    - 不可出现复杂排版要求
  中年级:
    - 不可出现成人化/过于严肃内容
    - 不可使用纯文字无图版面
    - 不可出现过于简单幼稚的卡通风格
  高年级:
    - 不可出现过于幼稚的卡通风格
    - 不可出现空洞口号无实质内容
    - 不可使用千篇一律的模板排版
  教师:
    - 不可出现争议性政治内容
    - 不可出现不合规的宗教内容
    - 不可出现低俗/暴力/歧视内容

年龄段×难度适配:
  一年级:
    难度等级: 极简(L1)
    文字量规则: 最多30字，标题+1-2句短句
    绘画要求: 大面积涂色区为主，线条简单粗犷
    版面结构: 单栏或双栏，无分区逻辑要求
    推荐形式: [涂色版, 简笔画+填色版, 填空版(写名字+1句话)]
    时间预估: 15-20分钟(含涂色)
  二年级:
    难度等级: 入门(L2)
    文字量规则: 30-60字，标题+2-3句短文
    绘画要求: 简笔画+涂色，可加简单边框
    版面结构: 2-3区简单分区，大图小文
    推荐形式: [半成品涂色版, 简笔画版面+填文字区, 素材贴纸版]
    时间预估: 20-30分钟
  三四年级:
    难度等级: 中等(L3)
    文字量规则: 60-150字，标题+3-5段短文+小标题
    绘画要求: 多种绘画技法(水彩/彩铅/简笔)，版面有层次
    版面结构: 3-4区逻辑分区，图文比例约1:1
    推荐形式: [模板框架+自填内容版, 图文分区协作版, 知识卡片式排版]
    时间预估: 40-60分钟(亲子协作)
  五六年级:
    难度等级: 进阶(L4)
    文字量规则: 150-300字，标题+多段落+引用+图表说明
    绘画要求: 绘画技法丰富(写实/水墨/科技风格)，版面有设计感
    版面结构: 4+区自由排版，文多于图，可创新布局
    推荐形式: [思维导图式排版, 专题研究型版面, 创意混搭排版]
    时间预估: 60-90分钟(学生独立完成)
  初中:
    难度等级: 高阶(L5)
    文字量规则: 300-500字，深度论述+引用+数据+图表
    绘画要求: 绘画为辅助，重点是版面设计感和内容深度
    版面结构: 自由排版，杂志式/报纸式/海报式均可
    推荐形式: [新闻版面式, 专题报告式, 杂志专栏式, 信息图表式]
    时间预估: 90-120分钟
    注意: 初中手抄报已较少布置，多为板报/电子报形式

