品类交叉组合:
  组合1_节日×品德:
    推导公式: "节日精神内核×品德行为场景"
    交叉模式: "在XX节日里践行XX美德"
    示例: ["春节感恩团圆美德手抄报", "重阳敬老孝道手抄报", "雷锋日助人为乐手抄报"]
    图片描述要点: 节日装饰边框+美德关键词+温馨行为场景插图

  组合2_安全×健康:
    推导公式: "安全防护×健康习惯"
    交叉模式: "安全与健康双守护"
    示例: ["防溺水+夏季健康手抄报", "交通安全+运动安全手抄报", "食品安全+营养健康手抄报"]
    图片描述要点: 双色分区(警示色+健康色)+安全标志+健康图标+守护盾牌图案

  组合3_爱国×学科:
    推导公式: "爱国主题×学科知识载体"
    交叉模式: "用XX学科视角讲述爱国故事"
    示例: ["数学视角看国家发展数据手抄报", "地理视角看中国版图手抄报", "历史视角看抗战手抄报"]
    图片描述要点: 学科特色元素+爱国符号(国旗/地图)+知识图表+红色主色调

  组合4_季节×节日:
    推导公式: "季节自然特征×节日时令文化"
    交叉模式: "XX季节里的XX节日"
    示例: ["春天清明节气手抄报", "夏天端午龙舟手抄报", "秋天中秋赏月手抄报", "冬天春节年味手抄报"]
    图片描述要点: 季节植物/天气元素+节日食物/活动场景+节气时间轴+季节色系渐变

  组合5_品德×校园:
    推导公式: "品德主题×校园场景"
    交叉模式: "校园里的XX美德"
    示例: ["校园文明礼仪手抄报", "班级团结友爱手抄报", "校园环保小卫士手抄报"]
    图片描述要点: 校园建筑/操场+学生互动场景+美德标语+校园色系(蓝黄绿)

  组合6_时事×爱国:
    推导公式: "时事热点×爱国情怀"
    交叉模式: "中国XX成就/中国XX力量"
    示例: ["中国航天成就手抄报", "中国科技强国手抄报", "中国绿色发展手抄报"]
    图片描述要点: 科技元素+国旗/国徽+数据图表+深蓝+红色配色+未来感排版

  组合7_安全×品德:
    推导公式: "安全规则意识×品德责任担当"
    交叉模式: "守安全底线·做品德榜样"
    示例: ["交通安全文明出行手抄报", "校园安全守规则讲礼貌手抄报", "防拐防骗诚实守信手抄报"]
    图片描述要点: 双区排版(左警示区+右美德区)+安全标志+品德关键词+盾牌与爱心融合图案

  组合8_节日×学科:
    推导公式: "节日文化内涵×学科知识解析"
    交叉模式: "用XX学科解读XX节日"
    示例: ["数学解读春节习俗手抄报", "科学探究端午龙舟原理手抄报", "英语介绍中秋节手抄报"]
    图片描述要点: 节日装饰边框+学科特色图标(公式/实验/单词)+知识卡片分区+节日色系+学科辅助色

  组合9_时事×节日:
    推导公式: "时事社会议题×节日纪念契机"
    交叉模式: "XX节日里的XX时代话题"
    示例: ["国庆里的科技强国手抄报", "劳动节里的AI新时代手抄报", "植树节里的碳中和行动手抄报"]
    图片描述要点: 节日主题图案+时事数据图表+时间线对比(传统vs现代)+节日色系+科技感辅助元素

  组合10_品德×学科:
