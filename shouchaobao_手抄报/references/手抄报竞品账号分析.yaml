差异化定位建议:
  vs素材站(千图网等): 我们不提供静态模板下载，而是提供精准图片描述用于AI图片生成，实时按需生成而非固定模板
  vsCanva: 我们不需要用户有设计能力，描述即生成，门槛更低
  vs内容站(360等): 我们不仅提供文字内容，更提供完整版面视觉描述，一步到位
  vs公众号合集: 我们是实时生成而非固定合集，时效性更强(可结合当日时事)
  vs素材站_千图网等:
    现有建议: 不提供静态模板下载，而是提供精准图片描述用于AI图片生成
    调研更新: 千图网占前10结果17次，模板量5000+，但痛点是需注册+部分付费+固定模板不可修改
    差异化: 我们提供实时生成+免费+按需定制版面，不需要下载软件或注册
  vsCanva_创客贴等在线设计平台:
    现有建议: 不需要用户有设计能力，描述即生成，门槛更低
    调研更新: Canva+创客贴合计占前10结果23次，但免费模板有限(200-300)，用户需拖拽编辑
    差异化: 我们零设计门槛(描述即生成)，不需要用户学会拖拽编辑，模板数量不受限(实时生成)
  vs内容站_360手抄报等:
    现有建议: 不仅提供文字内容，更提供完整版面视觉描述，一步到位
    调研更新: 360手抄报+瑞文网+百度文库主打文字内容，但缺乏版面视觉设计指导
    差异化: 我们提供"文字内容+版面设计+色彩搭配+插图位置"一体化描述，家长不需自己拼凑
  vs公众号合集_天天手抄报等:
    现有建议: 实时生成而非固定合集，时效性更强
    调研更新: 天天手抄报主打2分钟速画视频教程，合集型公众号主打数量合集(50-150篇)
    差异化: 我们是实时生成+时事融合+品类交叉组合，不是固定合集库
  vsSEO占位站_weibomingzi等:
    新增建议: weibomingzi SEO最强(38次前10结果)，但内容是图片展示型无版面设计指导
    差异化: 我们提供6维精确描述(版面布局/色彩/插图/文字区/装饰/受众适配)，不是简单图片罗列
  vsAI生成竞品_笔灵AI等:
    新增建议: 笔灵AI/Hanyuai/365手抄报已有AI生成功能，但手抄报是附属功能，质量参差
    差异化: 我们专注手抄报赛道，6维精确描述确保版面专业度，不是通用AI图片生成的附属功能
  vs小红书线稿售卖:
    新增建议: 小红书大量卖家售卖黑白线稿PDF(9.9-29.9元/套)，但品类有限+需购买
    差异化: 我们免费生成线稿描述+按需定制主题+不限品类，不需要购买固定PDF
核心差异化:
  1_实时生成: 根据当前日期/时事/季节实时生成，不是固定模板库。时效性超越合集型竞品(可结合当日时事如建国75周年/抗战胜利80周年等年度热点)
  2_精准描述: 图片描述包含版面布局/色彩/插图/文字区/装饰/受众适配的6维精确描述，超越图片展示型竞品(weibomingzi等只展示图片不提供设计指导)
  3_受众适配: 每条描述标注适配年级(低/中/高年级)，家长直接找到对应难度的描述。超越通用模板站(千图网等不分年级)
  4_时事融合: 可结合当日社会时事热点生成，时效性超越固定模板。如2025年建国75周年/抗战胜利80周年等时效内容竞品已占位但内容空白度大
  5_交叉组合: 支持品类交叉组合(节日×品德/安全×健康等)，生成独特组合版面。这是当前竞品几乎无覆盖的内容空白区(场景组合搜索词竞品占据度几乎全为弱)
  6_免费零门槛: 不需注册/不需付费/不需设计能力/不需下载软件。vs千图网(注册+付费)/vsCanva(需设计能力)/vs小红书卖家(需购买)
  7_内容空白区抢占: 高年级深度内容(五年级/六年级/设计创意版面)是当前竞品几乎无覆盖的空白区，竞品占据度全为弱，内容空白度全为大。AI手抄报生成品类也是空白区
