生命事件触发器:
  入学开学:
    触发场景: 新学期开学，老师布置"开学手抄报"
    情感关键词: [期待, 紧张, 新起点, 好奇, 计划]
    适用受众: 全年级
    图片描述要点: 校门/教室场景+新学期计划文字框+明黄天蓝色系+校园元素边框

  考前复习:
    触发场景: 期中期末考试前，老师布置学科复习手抄报
    情感关键词: [紧张, 努力, 认真, 自信, 方法]
    适用受众: 中高年级
    图片描述要点: 学科特色元素+知识梳理图表+蓝色冷静色系+书本铅笔装饰

  毕业离校:
    触发场景: 六年级毕业季，做毕业纪念手抄报
    情感关键词: [不舍, 感恩, 回忆, 期待, 成长]
    适用受众: 高年级
    图片描述要点: 校园回忆插图+同学寄语区+暖色系(橙黄粉)+纪念风格排版

  搬家转学:
    触发场景: 因家庭搬迁转学，做告别/新学校手抄报
    情感关键词: [不舍, 陌生, 适应, 勇气, 新朋友]
    适用受众: 中高年级
    图片描述要点: 两校对比插图+适应小贴士+渐变色系+友谊元素装饰

  得奖获奖:
    触发场景: 校级/区级获奖后，做获奖感悟手抄报
    情感关键词: [自豪, 感恩, 坚持, 努力, 分享]
    适用受众: 中高年级
    图片描述要点: 奖杯奖状插图+心得文字框+金色主色调+星星奖牌装饰

  运动受伤:
    触发场景: 课堂或运动受伤，老师布置安全/健康手抄报
    情感关键词: [注意, 防护, 安全, 恢复, 小心]
    适用受众: 全年级
    图片描述要点: 安全警示图标+防护措施文字框+警示色系+安全标志装饰

  亲人去世:
    触发场景: 家庭亲人去世，做缅怀/生命教育手抄报
    情感关键词: [思念, 珍惜, 缅怀, 温暖, 陪伴]
    适用受众: 高年级(需谨慎处理)
    图片描述要点: 白菊花/白鹤图案+缅怀文字框+素雅色系(白灰淡紫)+庄重排版

  同学冲突:
    触发场景: 班级出现同学矛盾，老师布置文明礼仪手抄报
    情感关键词: [理解, 友善, 宽容, 沟通, 团结]
    适用受众: 中年级
    图片描述要点: 友谊互动插图+文明行为文字框+温暖色系+爱心握手装饰

  自然灾害:
    触发场景: 社会发生自然灾害(地震/洪水等)，老师布置防灾手抄报
    情感关键词: [安全, 防护, 团结, 救助, 科学]
    适用受众: 全年级
    图片描述要点: 防灾图标+自护方法文字框+警示色系+安全装备插图

  节日作业:
    触发场景: 节日前老师布置节日主题手抄报(最常见的触发)
    情感关键词: [节日名+快乐/纪念/传承/庆祝]
    适用受众: 全年级
    图片描述要点: 节日主场景公式(节日专属边框+代表性插图+节日色彩+习俗文字框)

  家长帮做:
    触发场景: 家长替孩子完成手抄报，搜索"简单模板打印"
    情感关键词: [省时, 方便, 快速, 模板, 打印]
    适用受众: 低年级家长
    图片描述要点: 简单版面+大面积插图+极少文字+鲜艳卡通+打印友好排版

  亲子协作:
    触发场景: 家长和孩子一起做手抄报，搜索"模板可编辑"
    情感关键词: [协作, 好看, 高分, 丰富, 教育意义]
    适用受众: 中年级家长+学生
    图片描述要点: 图文均衡版面+精致边框+3-5个内容框+协调色系+教育价值内容

  班级评比:
    触发场景: 班级手抄报评比大赛
    情感关键词: [创意, 竞争, 精致, 独特, 获奖]
    适用受众: 全年级
    图片描述要点: 创意版面+精致手绘元素+高质量排版+独特配色+完整内容覆盖

  时事触发:
    触发场景: 社会重大时事(航天发射/奥运/疫情等)，老师布置时事手抄报
    情感关键词: [关注, 了解, 热点, 成就, 讨论]
    适用受众: 中高年级
    图片描述要点: 时事场景插图+新闻要点文字框+科技色系+数据图表装饰

  升入高年级:
    触发场景: 升入新年级，需要更高难度手抄报
    情感关键词: [成长, 进阶, 更深入, 更创意, 自主]
    适用受众: 升年级学生
    图片描述要点: 从低年级风格过渡→中年级风格或中→高年级风格，提升文字比例和排版复杂度

生命事件×内容品类交叉:
  入学开学:
    关联品类: [学科知识, 品德礼仪, 校园文化]
    品类切入角度: 学科→新学期学科计划展望；品德→新学期行为规范；校园→校园生活介绍
    优先品类: 品德礼仪(开学第一课最常见)

  考前复习:
    关联品类: [学科知识, 学习方法, 心理健康]
    品类切入角度: 学科→学科知识梳理总结；学习方法→复习技巧分享；心理健康→考前减压
    优先品类: 学科知识(最直接需求)

  毕业离校:
    关联品类: [品德礼仪, 校园文化, 心理健康]
    品类切入角度: 品德→感恩教育；校园→校园回忆记录；心理健康→离别情绪处理
    优先品类: 品德礼仪(感恩主题最常见)

  搬家转学:
    关联品类: [安全教育, 环境保护, 品德礼仪]
    品类切入角度: 安全→新环境安全常识；环境→新旧环境对比；品德→适应新环境的品德要求
    优先品类: 品德礼仪(交友与适应)

  得奖获奖:
    关联品类: [品德礼仪, 学科知识, 心理健康]
    品类切入角度: 品德→感恩与分享；学科→获奖学科深耕；心理健康→自信与成就感
    优先品类: 品德礼仪(感恩分享)

  运动受伤:
    关联品类: [安全教育, 健康知识, 心理健康]
    品类切入角度: 安全→校园安全防护；健康→运动健康知识；心理→受伤后的心理调适
    优先品类: 安全教育(最直接关联)

  亲人去世:
    关联品类: [心理健康, 品德礼仪, 传统文化]
    品类切入角度: 心理→生命教育与情绪疏导；品德→珍惜亲情；传统→缅怀文化
    优先品类: 心理健康(生命教育最核心)

  同学冲突:
    关联品类: [品德礼仪, 心理健康, 安全教育]
    品类切入角度: 品德→文明礼仪与友善；心理→情绪管理与沟通；安全→校园人际关系安全
    优先品类: 品德礼仪(文明友善最常见)

  自然灾害:
    关联品类: [安全教育, 环境保护, 科学知识]
    品类切入角度: 安全→防灾自护知识；环境→自然灾害成因与环保；科学→灾害科学原理
    优先品类: 安全教育(防灾最核心)

  节日作业:
    关联品类: [传统文化, 品德礼仪, 学科知识, 安全教育]
    品类切入角度: 传统→节日习俗与文化；品德→节日精神内涵；学科→节日相关学科知识；安全→节日安全提示
    优先品类: 传统文化(节日主题最核心)

  家长帮做:
    关联品类: [所有品类均可]
    品类切入角度: 家长需求是"简单快速"，品类不重要，模板简洁度最重要
    优先品类: 节日/品德(家长搜索量最大的品类)

  亲子协作:
    关联品类: [品德礼仪, 传统文化, 学科知识]
    品类切入角度: 品德→亲子协作本身就是品德教育；传统→传统文化传承；学科→学科知识探索
    优先品类: 品德礼仪(亲子协作本身就是品德实践)

  班级评比:
    关联品类: [所有品类均可，偏创意类]
    品类切入角度: 评比不限制品类，创意度和完整度最重要
    优先品类: 传统文化/学科知识(评比中最常见主题)

  时事触发:
    关联品类: [科学知识, 品德礼仪, 安全教育]
    品类切入角度: 科学→时事背后的科学原理；品德→时事中的品德启示；安全→时事安全教训
    优先品类: 科学知识(时事最常关联科学成就)

  升入高年级:
    关联品类: [学科知识, 品德礼仪, 心理健康]
    品类切入角度: 学科→更高要求的学科内容；品德→更高标准的品德要求；心理→成长心理调适
    优先品类: 学科知识(高年级学科内容要求更高)

生命事件×受众适配:
  低年级_1-2年级:
    入学开学: 需要最简单的模板，大面积图案+极少文字，家长帮做比例高
    考前复习: 不太常见，低年级考试压力小
    节日作业: 最常见触发，需要卡通化+简单+鲜艳的模板
    家长帮做: 低年级最大需求群体，「简单」「打印」「一年级」搜索词高频
    运动受伤: 需要卡通化安全提示，图文并茂
    同学冲突: 不太常见，低年级冲突多由老师直接处理

  中年级_3-4年级:
    入学开学: 开始有自主完成能力，图文均衡版面
    考前复习: 开始出现，学科复习需求上升
    节日作业: 常见触发，开始追求「好看」「有创意」
    亲子协作: 中年级最大需求群体，家长参与但孩子自主性增强
    同学冲突: 常见触发，文明礼仪主题需求上升
    自然灾害: 开始理解灾害知识，需要科普性+实用性内容

  高年级_5-6年级:
    入学开学: 自主完成，追求创意版面和深度内容
    考前复习: 高频触发，多学科复习需求
    毕业离校: 高年级专属触发，感恩回忆主题
    班级评比: 高年级评比标准更高，需要精致创意模板
    时事触发: 高年级最常见，时事理解能力强
    升入高年级: 五升六需求，内容深度要求高
    亲人去世: 高年级可处理，但需谨慎设计

  家长群体_按年级:
    低年级家长: 搜索「简单模板」「打印」「一年级XX手抄报」，需求省时省力
    中年级家长: 搜索「模板可编辑」「好看」「高分」，需求美观+教育价值
    高年级家长: 搜索较少，孩子自主完成为主，偶尔搜「创意排版」「深度内容」

校园生命周期时间轴:
  幼儿园阶段_3-6岁:
    关键生命事件: [入园适应, 节日简单手工, 亲子活动展示]
    手抄报特征: 几乎不做手抄报，多为涂色/粘贴类手工
    家长需求: 「幼儿园手工」「简单涂色」「节日手工」
    设计要点: 极简+大面积涂色区+卡通形象+鲜艳色系

  小学低年级_1-2年级_6-8岁:
    关键生命事件: [入学开学, 节日作业, 安全教育日, 运动受伤]
    手抄报特征: 初次接触手抄报，需要最简模板；文字比例10-20%
    家长需求: 「一年级手抄报」「简单模板」「打印」
    设计要点: 大面积图案+极少文字框+鲜艳卡通+打印友好
    色系偏好: 明黄/天蓝/粉红/草绿(鲜艳活泼)
    排版复杂度: 2-3个内容框，简单分区

  小学中年级_3-4年级_8-10岁:
    关键生命事件: [考前复习, 亲子协作, 同学冲突, 自然灾害, 节日作业]
    手抄报特征: 开始有自主能力，图文均衡；文字比例30-40%
    家长需求: 「模板可编辑」「好看」「中年级手抄报」
    设计要点: 图文均衡+精致边框+3-5个内容框+协调色系
    色系偏好: 天蓝/浅绿/暖橙/淡紫(协调雅致)
    排版复杂度: 3-5个内容框，分区明确

  小学高年级_5-6年级_10-12岁:
    关键生命事件: [毕业离校, 班级评比, 时事触发, 考前复习, 升入高年级, 亲人去世]
    手抄报特征: 自主完成为主，追求创意深度；文字比例40-60%
    家长需求: 「创意排版」「高年级」「六年级毕业手抄报」
    设计要点: 创意版面+深度内容+精致手绘+独特配色
    色系偏好: 深蓝/墨绿/暖棕/渐变(成熟稳重)
    排版复杂度: 5-7个内容框，分区灵活创意

  初中阶段_7-9年级_12-15岁:
    关键生命事件: [升入初中, 考前复习, 时事触发, 社团活动, 心理健康]
    手抄报特征: 完全自主，内容深度要求高；文字比例50-70%
    家长需求: 极少搜索，学生自主完成
    设计要点: 专业排版+深度内容+信息密度高+数据图表
    色系偏好: 黑白/深色系/科技蓝/学术风格(专业理性)
    排版复杂度: 自由排版，接近信息图设计