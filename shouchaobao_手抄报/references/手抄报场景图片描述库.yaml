场景组合公式:
  预览图公式:
    公式1_节日主场景: "{节日名} + {节日专属边框} + {节日代表性插图(食物/活动/人物)} + {节日色彩系} + {节日习俗文字框}"
    公式2_安全警示场景: "{安全主题} + {警示色系边框} + {安全标志/禁止标志集合} + {正确做法vs错误做法对比插图} + {安全规则清单文字框}"
    公式3_品德感恩场景: "{品德主题} + {温暖色系边框} + {爱心/花朵/拥抱插图} + {美德关键词装饰} + {行为建议文字框}"
    公式4_学科知识场景: "{学科名} + {学科特色色系边框} + {学科名人/图标插图} + {思维导图/问答区} + {知识内容文字框}"
    公式5_季节自然场景: "{季节名} + {季节花边边框} + {季节植物/动物插图} + {季节色系渐变} + {节气/自然知识文字框}"
    公式6_爱国国防场景: "{爱国主题} + {红旗边框} + {国旗/华表/军人插图} + {红色金色系} + {历史事件文字框}"
    公式7_时事热点场景: "{时事事件} + {科技星空边框} + {火箭/芯片/数据图表插图} + {深蓝银色系} + {成就数据文字框}"
    公式8_校园生活场景: "{校园主题} + {校园元素边框} + {校门/操场/教室插图} + {明黄天蓝色系} + {活动/计划文字框}"

  线稿公式:
    核心规则: |
      线稿=去掉所有色彩，只保留轮廓线和结构线。
      四层线条粗细：边框粗(2pt) > 标题中(1.5pt) > 内容框细(1pt) > 装饰最细(0.5pt)
      文字框正文区留空白(只写标题文字，正文供手写填入)
      插图只画外形轮廓(不画色彩细节阴影)
    公式_线稿通用: "纯黑白线条画 + 白色背景 + {边框轮廓线(粗2pt)} + {标题文字轮廓(中1.5pt)} + {插图外形轮廓(中1.5pt)} + {文字框边线+标题文字+空白正文区(细1pt)} + {装饰轮廓(最细0.5pt)}"

受众适配规则:
  低年级适配:
    版面: 居中大图型或横幅标题型，留白50%以上
    边框: 卡通趣味边框(动物/食物/童话)
    插图: 大面积卡通插图占版面40-60%，Q版圆润风格
    文字: 1-2个文字框，每框1-2句短句
    色彩: 鲜艳高饱和，3-4色彩虹系
    标题: 气泡字/圆体卡通字/彩虹色填充
    装饰: 大号星星/爱心/气球，间距宽松

  中年级适配:
    版面: 三区/四宫格/环形排版型，图文各半
    边框: 主题边框(节日/安全/学科)，花边精致
    插图: 3-5幅中等大小插图，写实到简笔过渡风格
    文字: 3-5个文字框，每框3-5句，有标题分区
    色彩: 2-3色主色系，有明暗对比
    标题: 手写体/渐变填充/花边装饰字
    装饰: 中号主题元素，间距适中

  高年级适配:
    版面: 思维导图/瀑布流/杂志排版型，文字为主70%
    边框: 细线/纹样边框，不占太大面积
    插图: 2-3幅小插图，水墨/写实/科技风格
    文字: 5-8个内容区，每区5-8句，有逻辑结构
    色彩: 2色主色系，明度对比适中
    标题: 衬线体/书法体/简约现代体
    装饰: 小号精细元素，间距紧凑