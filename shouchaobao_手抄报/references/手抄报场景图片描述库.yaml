场景图片描述模板:
  说明: |
    每条场景包含两类描述：
    1. 预览图描述 = 完整彩色效果图（用于展示完成效果）
    2. 线稿描述 = 纯黑白轮廓线条（用于打印描摹）
    
    预览图描述格式：[输出目标] | [版面布局] | [边框花边] | [色彩方案] | [标题风格] | [插图细节] | [文字区内容] | [装饰点缀] | [受众适配]
    线稿描述格式：[输出目标] | [版面布局] | [边框轮廓] | [纯黑白线条] | [标题轮廓] | [插图轮廓] | [文字框边线+标题+空白正文区] | [装饰轮廓] | [受众适配]

  春节_低年级:
    主题: 春节快乐
    预览图描述: |
      一张小学生手抄报，横版A4纸比例(297×210mm)，居中大图型版面布局。四周环绕红色金色灯笼鞭炮春联主题边框，整体色彩为中国红#E60012配金色#FFD700。顶部横幅标题"春节快乐"用圆体卡通字，彩虹色填充，粗描边。中央一幅大型卡通插图：穿红色唐装的小朋友拿着红包站在贴着春联的大门前，地上有鞭炮烟花，天上有金色祥云。左下角一个小文字框写着"春节是农历新年"，右下角一个小文字框写着"祝大家新年快乐"。空白处点缀金色五角星和红色小灯笼。整体风格可爱卡通，适合一年级小学生。
    线稿描述: |
      一张小学生手抄报线稿，横版A4纸比例(297×210mm)，居中大图型版面布局。纯黑白线条画，无色彩填充，白色背景。线条层次分明：外边框用粗线(2pt)画灯笼鞭炮春联轮廓环绕四边。顶部横幅标题区域"春节快乐"用粗描边中线(1.5pt)标出标题轮廓位置。中央大面积区域用中线(1.5pt)画一幅卡通插图轮廓：小朋友拿红包站门前的外形轮廓线，大门和春联轮廓线，地上鞭炮烟花轮廓线，天上祥云轮廓线，不填色只画外形。左下角用细线(1pt)画一个文字框边线，框内写标题文字"春节是农历新年"，正文区域留空白供手写。右下角用细线(1pt)画一个文字框边线，框内写标题文字"祝大家新年快乐"，正文区域留空白供手写。空白处用最细线(0.5pt)画4处装饰轮廓：一颗五角星、两个灯笼外形、一颗星星。整体为可打印线稿模板，适合一年级小学生描摹填色填字。

  春节_中年级:
    主题: 春节文化
    预览图描述: |
      一张小学生手抄报，横版A4纸比例(297×210mm)，三区均衡型版面布局。四周环绕祥瑞纹样红金边框配春联横批图案，整体色彩为中国红#E60012+金色#FFD700+米白#F5F5DC。顶部标题"春节文化"用手写体，红色填充金色描边。左侧插图区：一幅写实风格插图展示贴春联、挂灯笼、吃年夜饭的场景。中间标题区下方有三个内容框："春节来历"简述农历新年起源、"春节习俗"列出贴春联/守岁/拜年/放鞭炮四项、"春节美食"画出饺子汤圆年糕。右侧画一幅舞龙舞狮场景。空白处点缀鞭炮串和梅花图案。整体风格图文各半内容丰富，适合三四年级。
    线稿描述: |
      一张小学生手抄报线稿，横版A4纸比例(297×210mm)，三区均衡型版面布局。纯黑白线条画，无色彩填充，白色背景。线条层次分明：外边框用粗线(2pt)画祥瑞纹样轮廓配春联横批图案轮廓环绕四边。顶部标题区域"春节文化"用中线(1.5pt)标出标题轮廓位置，标题字用粗描边线。左侧插图区用中线(1.5pt)画贴春联/挂灯笼/吃年夜饭场景的外形轮廓线，人物桌椅灯笼春联只画外形不填色。中间区域用细线(1pt)画三个文字框边线：第一个框内写标题文字"春节来历"，正文区域留空白供手写；第二个框内写标题文字"春节习俗"，正文区域留空白供手写；第三个框内写标题文字"春节美食"，正文区域留空白供手写。右侧用中线(1.5pt)画舞龙舞狮场景的外形轮廓线，龙形狮形人物只画外形轮廓。空白处用最细线(0.5pt)画4处装饰轮廓：两串鞭炮外形、两朵梅花轮廓。整体为可打印线稿模板，适合三四年级描摹填色填字。

  春节_高年级:
    主题: 春节文化深读
    预览图描述: |
      一张小学生手抄报，横版A4纸比例(297×210mm)，杂志排版型版面布局。四周环绕云纹边框配金色描边，整体色彩为酒红#8B0000+金色#FFD700+米白#F5F5DC。大标题"春节文化深读"用衬线书法体，酒红填充。左侧侧栏引用春联"千门万户曈曈日，总把新桃换旧符"。主文区三个分区："春节起源演变"从远古祭神到现代过年、"南北春节差异"对比北方饺子vs南方汤圆、守岁vs走亲、"春节经济文化"讲述年货/红包/春运的当代意义。配两幅插图：一幅宋代岁朝图局部，一幅当代春运场景简笔。底部引用区写"岁岁年年花相似，岁岁年年人不同"。空白处点缀回纹和梅花。整体风格庄重有深度，适合五六年级。
    线稿描述: |
      一张小学生手抄报线稿，横版A4纸比例(297×210mm)，杂志排版型版面布局。纯黑白线条画，无色彩填充，白色背景。线条层次分明：外边框用粗线(2pt)画云纹轮廓环绕四边。顶部标题区域"春节文化深读"用中线(1.5pt)标出标题轮廓位置，衬线体描边。左侧侧栏用细线(1pt)画引用框边线，框内写"千门万户曈曈日，总把新桃换旧符"。主文区用细线(1pt)画三个分区边线：第一区写标题文字"春节起源演变"，正文区域留空白供手写；第二区写标题文字"南北春节差异"，正文区域留空白供手写；第三区写标题文字"春节经济文化"，正文区域留空白供手写。两幅插图用中线(1.5pt)画外形轮廓：一幅岁朝图建筑人物轮廓线，一幅春运场景人群车站轮廓线，只画外形不填色。底部引用区用细线(1pt)画边线，框内写"岁岁年年花相似，岁岁年年人不同"。空白处用最细线(0.5pt)画3处装饰轮廓：回纹线条、梅花轮廓。整体为可打印线稿模板，适合五六年级描摹填色填字。

  国庆_低年级:
    主题: 国庆快乐
    预览图描述: |
      一张小学生手抄报，横版A4纸比例(297×210mm)，居中大图型版面布局。四周环绕红旗五角星天安门华表主题边框，整体色彩为中国红#E60012+金色#FFD700+天蓝#4169E1。顶部横幅标题"国庆快乐"用气泡字，红色填充金色描边。中央一幅大型卡通插图：天安门城楼前飘扬的五星红旗，下方有穿校服的小朋友敬礼，天空有烟花绽放和和平鸽。左下角小文字框"10月1日是国庆节"，右下角小文字框"祝祖国生日快乐"。空白处点缀金色五角星和红色气球。整体风格可爱爱国，适合低年级。
    线稿描述: |
      一张小学生手抄报线稿，横版A4纸比例(297×210mm)，居中大图型版面布局。纯黑白线条画，无色彩填充，白色背景。线条层次分明：外边框用粗线(2pt)画红旗五角星天安门华表轮廓环绕四边。顶部横幅标题区域"国庆快乐"用中线(1.5pt)标出标题轮廓位置，气泡字描边。中央大面积区域用中线(1.5pt)画一幅卡通插图轮廓：天安门城楼外形轮廓线，五星红旗旗帜轮廓线，小朋友敬礼人物外形轮廓线，烟花绽放轮廓线，和平鸽飞翔轮廓线，不填色只画外形。左下角用细线(1pt)画一个文字框边线，框内写标题文字"10月1日是国庆节"，正文区域留空白供手写。右下角用细线(1pt)画一个文字框边线，框内写标题文字"祝祖国生日快乐"，正文区域留空白供手写。空白处用最细线(0.5pt)画4处装饰轮廓：三颗五角星外形、两个气球轮廓。整体为可打印线稿模板，适合一年级小学生描摹填色填字。

  国庆_中年级:
    主题: 国庆知识
    预览图描述: |
      一张小学生手抄报，横版A4纸比例(297×210mm)，四宫格型版面布局。四周环绕红旗华表边框配金色祥云，整体色彩为中国红+金色+天蓝。顶部标题"国庆知识"用手写体，红色渐变填充。四个等分区块：左上"国旗国徽"画国旗国徽简笔+含义说明、右上"开国大典"画天安门宣告场景简笔+时间说明、左下"祖国成就"画高铁火箭桥梁图标+三项成就列举、右下"国庆活动"画阅兵升旗场景+活动描述。空白处点缀五角星和烟花。整体风格图文均衡，适合中年级。
    线稿描述: |
      一张小学生手抄报线稿，横版A4纸比例(297×210mm)，四宫格型版面布局。纯黑白线条画，无色彩填充，白色背景。线条层次分明：外边框用粗线(2pt)画红旗华表轮廓配祥云图案轮廓环绕四边。顶部标题区域"国庆知识"用中线(1.5pt)标出标题轮廓位置，手写体描边。四个等分区块用细线(1pt)画文字框边线：左上框内写标题文字"国旗国徽"，配国旗国徽外形轮廓线(中线1.5pt)，正文区域留空白供手写；右上框内写标题文字"开国大典"，配天安门宣告场景人物轮廓线(中线1.5pt)，正文区域留空白供手写；左下框内写标题文字"祖国成就"，配高铁火箭桥梁图标轮廓线(中线1.5pt)，正文区域留空白供手写；右下框内写标题文字"国庆活动"，配阅兵升旗场景轮廓线(中线1.5pt)，正文区域留空白供手写。空白处用最细线(0.5pt)画4处装饰轮廓：三颗五角星外形、一处烟花轮廓。整体为可打印线稿模板，适合三四年级描摹填色填字。

  国庆_高年级:
    主题: 国庆与国家发展
    预览图描述: |
      一张小学生手抄报，横版A4纸比例(297×210mm)，瀑布流型版面布局。四周环绕云纹边框配红旗飘扬图案，整体色彩为酒红+金色+深蓝#00008B。大标题"国庆与国家发展"用衬线体。从左到右三个竖向内容块：第一块"建国历程"时间轴从1949到2026关键节点+配历史照片风格简笔、第二块"发展数据"用柱状图/折线图简笔展示GDP/高铁里程/航天成就增长、第三块"家国情怀"引用国歌歌词节选+个人感悟文字区。底部横条写烈士纪念日9月30日致敬。空白处点缀华表和红旗。整体风格庄重数据化，适合高年级。
    线稿描述: |
      一张小学生手抄报线稿，横版A4纸比例(297×210mm)，瀑布流型版面布局。纯黑白线条画，无色彩填充，白色背景。线条层次分明：外边框用粗线(2pt)画云纹轮廓配红旗飘扬图案轮廓环绕四边。顶部标题区域"国庆与国家发展"用中线(1.5pt)标出标题轮廓位置，衬线体描边。从左到右三个竖向内容块用细线(1pt)画文字框边线：第一块写标题文字"建国历程"，配时间轴节点标记线和历史建筑人物轮廓线(中线1.5pt)，正文区域留空白供手写；第二块写标题文字"发展数据"，配柱状图折线图坐标轴轮廓线(中线1.5pt)，正文区域留空白供手写；第三块写标题文字"家国情怀"，正文区域留空白供手写。底部横条用细线(1pt)画边线，框内写"烈士纪念日9月30日致敬"。空白处用最细线(0.5pt)画3处装饰轮廓：华表外形轮廓、红旗轮廓。整体为可打印线稿模板，适合五六年级描摹填色填字。

