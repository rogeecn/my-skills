  联动发布通用规则:
    内容一致性: 所有平台发布同一主题内容，但形式适配各平台特点
    时间节奏: 提前14天→7天→3天→当天→后7天，形成完整发布节奏
    流量闭环: 公众号合集引流→小红书种草→抖音/快手教程→视频号社交传播→Pinterest海外
    搜索覆盖: 搜索引擎SEO+各平台站内SEO同时覆盖，确保搜索可见
    复用策略: 同一手抄报模板→小红书图片+公众号合集图+抖音视频截图+视频号视频+Pinterest英文版