核心传播路径:
  搜索引擎→素材站下载: 最主流路径，家长搜"XX手抄报模板"→千图网等下载
  小红书种草→打印使用: 年轻家长在小红书搜→看到模板→打印使用
  公众号合集→家长转发: 教师在公众号发合集→家长转发收藏
  抖音视频→边看边做: 家长看短视频教程→和孩子一起做
  快手直播→下沉市场: 下沉市场家长看快手直播→边学边做
  视频号→微信生态: 家长在视频号看到→分享朋友圈→更多人看到
  Pinterest→海外华人: 海外华人搜"Chinese poster"→下载使用

