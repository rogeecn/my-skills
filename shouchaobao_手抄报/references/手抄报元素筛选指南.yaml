筛选方法论:
  核心原则: |
    不锁死风格列表，按主题×场景×年级动态筛选适配元素。
    每类元素给出2-3个不同氛围的选项，供用户选择或AI推荐。
    筛选逻辑 = 主题关联度 × 场景适配度 × 年级兼容度

  筛选三步法:
    第一步_主题锚定: 确定主题后，从品类交叉矩阵找到该主题所属品类及其视觉特征关键词
    第二步_元素匹配: 用视觉特征关键词从视觉元素库中匹配对应边框/色彩/装饰/插图内容
    第三步_氛围扩展: 在主题标配之外，扩展2个不同氛围的变体选项

  氛围类型定义:
    传统庄重: 使用传统纹样边框+沉稳配色+经典插图+典故文字内容
    清新活泼: 使用自然花边边框+明亮配色+卡通/简笔插图+趣味文字内容
    文雅典雅: 使用青花/书法边框+冷色低饱和配色+水墨/扁平插图+诗词文字内容
    科技未来: 使用星空/几何边框+深蓝银色配色+科技插图+数据文字内容
    温暖感恩: 使用爱心花朵边框+暖色柔和配色+温馨场景插图+情感文字内容
    警示严肃: 使用警示条纹边框+红黄黑配色+安全标志插图+规则清单文字内容

  筛选产出格式:
    每类元素列出2-3个选项，每个标注氛围类型:
    边框: [选项A(传统庄重) | 选项B(清新活泼) | 选项C(文雅典雅)]
    色彩: [方案A(传统) | 方案B(清新) | 方案C(典雅)]
    装饰: [组合A(传统) | 组合B(活泼) | 组合C(典雅)]
    内容角度: [角度A(传统) | 角度B(活泼) | 角度C(典雅)]

