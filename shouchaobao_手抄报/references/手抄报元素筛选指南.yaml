色彩筛选:
  核心原则: |
    色彩筛选不是随意配色，而是基于主题氛围、季节特征、受众年龄的
    三维决策系统。每个色彩方案需标注用途(主色/辅色/点缀色)和适配年级。

  按主题的色彩决策树:
    爱国国防类:
      主色方向: 中国红系(#E60012/#8B0000/#B22222)
      辅色方向: 金色系(#FFD700) 或 深蓝系(#00008B/#4169E1)
      点缀色方向: 白(#FFFFFF) 或 天蓝(#87CEEB)
      低年级调整: 降低饱和度→暖橙#FF6347+天蓝#4169E1+白#FFFFFF
      高年级调整: 提升对比度→酒红#8B0000+深蓝#00008B+金#FFD700

    节日纪念类_喜庆:
      主色方向: 红系(#E60012/#FF6347) 或 橙系(#FFA500/#FF8C00)
      辅色方向: 金系(#FFD700) 或 绿系(#32CD32/#228B22)
      点缀色方向: 白(#FFFFFF) 或 粉(#FF69B4)
      低年级调整: 增加粉和亮色→暖橙+粉红+金
      高年级调整: 增加深色和传统色→酒红+米白+金

    节日纪念类_清雅:
      主色方向: 绿系(#32CD32/#90EE90/#228B22) 或 蓝系(#87CEEB/#4169E1)
      辅色方向: 白系(#FFFFFF/#FAEBD7/#F5F5DC)
      点缀色方向: 金(#FFD700) 或 浅粉(#FFB6C1)
      低年级调整: 增加明黄→浅蓝+明黄+浅绿
      高年级调整: 增加棕黄→棕黄+米白+深绿

    品德礼仪类:
      主色方向: 暖橙系(#FFA500/#FF6347) 或 柔粉系(#FFB6C1/#FF69B4)
      辅色方向: 白系(#FFFFFF) 或 浅绿(#90EE90)
      点缀色方向: 金(#FFD700) 或 浅蓝(#87CEEB)
      低年级调整: 暖粉+暖橙+白→柔和明亮
      高年级调整: 棕黄+米白+深红→沉稳内涵

    安全教育类:
      主色方向: 红(#E60012) 或 橙(#FFA500) 或 蓝(#4169E1)
      辅色方向: 黄(#FFFF00) 或 白(#FFFFFF)
      点缀色方向: 黑(#000000) 或 绿(#32CD32)
      低年级调整: 蓝白系+暖橙→友好不恐惧→蓝+白+暖橙
      高年级调整: 红黄黑→严肃警示→红+黄+黑

    学科知识类:
      主色方向: 学科特色色(蓝=科学/紫=数学/棕=语文/绿=地理)
      辅色方向: 白(#FFFFFF) 或 米白(#FAEBD7)
      点缀色方向: 金(#FFD700) 或 对应学科亮色
      低年级调整: 学科色+明黄+白→活泼明快
      高年级调整: 学科深色+米白+金→学术沉稳

    编程科技类:
      主色方向: 深蓝(#00008B) 或 紫(#6A5ACD)
      辅色方向: 银(#C0C0C0) 或 白(#FFFFFF)
      点缀色方向: 红(#E60012) 或 橙(#FFA500)
      低年级调整: 蓝紫+明黄+白→科幻活力
      高年级调整: 深蓝+银+红→专业科技

  按季节的色彩决策树:
    春季_3-5月:
      推荐主色: 浅绿#90EE90+粉红#FF69B4+天蓝#87CEEB
      推荐辅色: 白#FFFFFF+米白#FAEBD7
      推荐点缀色: 金#FFD700+明黄#FFFF00
      花卉参考: 樱花粉+桃花红+郁金香橙+柳枝绿
      氛围关键词: 清新/萌动/温暖/生机

    夏季_6-8月:
      推荐主色: 明黄#FFFF00+天蓝#4169E1+绿#32CD32
      推荐辅色: 白#FFFFFF+浅蓝#87CEEB
      推荐点缀色: 红#E60012+橙#FFA500
      花卉参考: 向日葵黄+荷花粉+薰衣草紫+夏荷绿
      氛围关键词: 活力/明亮/热烈/清凉

    秋季_9-11月:
      推荐主色: 秋橙#FF8C00+金黄#FFD700+棕黄#8B4513
      推荐辅色: 米白#FAEBD7+深红#B22222
      推荐点缀色: 深蓝#00008B+绿#228B22
      花卉参考: 枫叶红+银杏黄+桂花金+菊花橙
      氛围关键词: 温暖/丰收/成熟/典雅

    冬季_12-2月:
      推荐主色: 冬蓝#4682B4+银白#C0C0C0+深蓝#00008B
      推荐辅色: 白#FFFFFF+暖橙#FFA500
      推荐点缀色: 金#FFD700+红#E60012
      花卉参考: 松枝绿+雪花白+梅花红+冰凌蓝
      氛围关键词: 清冷/纯洁/温暖/庄重

  按受众年龄的色彩决策树:
    低年级_1-3年级:
      核心原则: 高饱和+高明度+暖色为主+不超过3种主色
      主色推荐: 明黄#FFFF00+天蓝#87CEEB+暖橙#FFA500+粉红#FF69B4
      辅色推荐: 白#FFFFFF+浅绿#90EE90+浅紫#DDA0DD
      禁忌色: 大面积黑色/深灰/低饱和暗色
      色彩比例: 主色60%+辅色25%+点缀色15%
      氛围关键词: 活泼/可爱/明亮/童趣

    中年级_4-6年级:
      核心原则: 中饱和+适度明度+暖冷平衡+可4种主色
      主色推荐: 蓝#4169E1+绿#32CD32+橙#FFA500+紫#6A5ACD
      辅色推荐: 白#FFFFFF+米白#FAEBD7+金#FFD700
      禁忌色: 纯黑大面积+荧光色
      色彩比例: 主色50%+辅色30%+点缀色20%
      氛围关键词: 活力/知识/探索/平衡

    高年级_7-9年级:
      核心原则: 低饱和+低明度+冷色为主+可5种主色+有深色层次
      主色推荐: 深蓝#00008B+棕黄#8B4513+深绿#228B22+深红#B22222
      辅色推荐: 米白#FAEBD7+银#C0C0C0+金#FFD700
      禁忌色: 大面积荧光色/纯糖果色
      色彩比例: 主色40%+辅色35%+点缀色25%
      氛围关键词: 沉稳/学术/内涵/深度