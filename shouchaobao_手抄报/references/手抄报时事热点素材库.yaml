时事与品类交叉公式:
  时事×爱国: "{时事成就} + 爱国主题 → 中国XX力量/中国XX成就手抄报"
  时事×学科: "{时事科技} + 学科载体 → 用XX学科看时事手抄报"
  时事×安全: "{时事安全事件} + 安全教育 → XX安全警示手抄报"
  时事×品德: "{时事人物} + 品德主题 → XX精神学习手抄报"
  时事×文化传承: "{时事文化事件} + 文化传承 → XX文化守护手抄报"
  时事×生态环保: "{时事环保事件} + 生态环保 → 绿色XX行动手抄报"
  时事×国际视野: "{时事国际事件} + 国际视野 → 世界XX故事手抄报"

时效性生成规则:
  实时检测: 每次生成前检查当前日期，匹配当日/本周/本月的节日纪念日
  时事联动: 如当日有重大时事事件(航天发射/体育赛事/重要纪念日)，优先生成交叉主题
  季节联动: 自动匹配当前季节的色系和自然元素
  临近优先: 距当前日期最近的节日纪念日优先度最高(提前7-14天开始生成预热版本)

