# 白癜风和相关皮肤病 — 标题公式库

> 何时读取: 设计标题、拟定选题时读取
> 创建日期: 2026-05-15

---

## 标题公式（20种）

### 通用型公式（10种）

#### F1: 数字冲击型
结构模板: "{数字}个{关键事实}，{核心结论}"
 
 适用品类: P3治疗方案, P5患者教育
 适用受众: L2, L5
 示例: "35款新药竞逐百亿蓝海，白癜风治疗格局正在重塑". 示例: "2000万患者最关心的3个问题，医生一次讲清楚"

 F2: 真实案例型
结构模板: "从{场景}到{结果}：{核心经验}" - 适用品类: P9案例分享, P5患者教育. 适用受众: L2, L5. 示例: "从误诊花斑癣到确诊白癜风：3个鉴别要点基层医生必须掌握". 示例: "从绝望到复色：一位面部白癜风患者的12个月治疗日记".

#### F3: 禁忌纠正型
结构模板: "{常见误区}？{真相揭秘}" - 适用品类: P5患者教育, P6心理干预. 适用受众: L5. 示例: "白癜风传染吗？4个最常见的误区一次打消". 示例: "偏方能治白癜风？这个谣言害了多少人".

#### F4: 对比选型型
结构模板: "{方案A} vs {方案B}：{关键维度}对比" - 适用品类: P3治疗方案, P2诊断鉴别. 适用受众: L2, L3. 示例: "308nm准分子激光 vs 窄谱UVB：5个维度帮你选光疗方案". 示例: "他克莫司软膏 vs 卤米松软膏：面部白癜风怎么选？".

#### F5: 问答清单型
结构模板: "{受众场景}最关心的{数量}个问题" - 适用品类: P5患者教育. 适用受众: L5. 示例: "初诊白癜风最关心的10个问题，医生一次全回答". 示例: "儿童白癜风家长最关心的8个问题".

#### F6: 时间线型
结构模板: "{时间节点}：{关键变化}{行动建议}" - 适用品类: P3治疗方案, P5患者教育. 适用受众: L2, L5. 示例: "治疗3个月后：复色规律、评估方法、方案调整信号". 示例: "白癜风春季复发高峰来临：4个预警信号+应对策略".

#### F7: 清单盘点型
结构模板: "{品类}必做/必查/必知的{数量}件事" - 适用品类: P5患者教育, P12合并症. 适用受众: L3, L5. 示例: "白癜风患者必查的5项甲状腺指标". 示例: "基层医生识别白癜风必知的6个要点".

#### F8: 权威背书型
结构模板: "{权威来源}{核心结论}" - 适用品类: P10指南解读, P4新药前沿. 适用受众: L1, L2. 示例: "2024版诊疗共识：进展期首选方案更新了3条". 示例: "EADV 2024：JAK抑制剂治疗白癜风新证据等级提升".

#### F9: 逆向思维型
结构模板: "为什么{反直觉现象}？{真相解析}" - 适用品类: P1病理机制, P5患者教育. 适用受众: L1, L5. 示例: "为什么肤色深的人更容易得白癜风？氧化应激假说揭秘". 示例: "为什么白癜风稳定期反而更要警惕？Koebner现象解析".

#### F10: 操作指南型
结构模板: "{场景}操作指南：{关键步骤}" - 适用品类: P5患者教育, P11科普品牌. 适用受众: L2, L5. 示例: "初诊沟通操作指南：3步建立患者治疗信心". 示例: "白癜风医生短视频选题指南：5类内容+合规红线清单".

### 医学赛道特有公式（10种）

#### F11: 指南解读型
结构模板: "{指南版本}解读：{关键更新}点+{临床影响}" - 适用品类: P10指南解读. 适用受众: L1, L2. 示例: "2024版白癜风诊疗共识解读：3条关键更新+基层落地策略". 示例: "欧洲白癜风指南vs中国共识：差异点全梳理".

#### F12: 病例拆解型
结构模板: "病例拆解：{病例类型}的{关键决策节点}" - 适用品类: P9案例分享. 适用受众: L2, L4. 示例: "病例拆解：进展期面部白癜风的4个关键决策节点". 示例: "病例拆解：儿童白癜风合并甲状腺异常的诊疗路径".

#### F13: 前沿速递型
结构模板: "{来源/会议}速递：{核心发现}" - 适用品类: P4新药前沿. 适用受众: L1. 示例: "EADV 2024速递：芦可替尼乳膏真实世界数据发布". 示例: "JAK抑制剂年度盘点：3个新进展+2个争议".

#### F14: 机制→临床型
结构模板: "从{机制突破}到{临床应用}" - 适用品类: P1→P3交叉. 适用受众: L1, L2. 示例: "从IFN-γ趋化级联到JAK抑制剂：白癜风治疗的新逻辑链". 示例: "从氧化应激机制到抗氧化策略：白癜风治疗思路的进化".

#### F15: 共病筛查型
结构模板: "白癜风患者为什么必须筛查{共病}？" - 适用品类: P12合并症. 适用受众: L2, L3. 示例: "白癜风患者为什么必须筛查甲状腺功能？". 示例: "白癜风患者共病筛查清单：5项必查+3项选查".

#### F16: 诊疗流程型
结构模板: "{场景}诊疗流程图：从{起点}到{终点}" - 适用品类: P2诊断鉴别, P3治疗方案. 适用受众: L3, L4. 示例: "基层白癜风诊疗流程图：从识别到转诊的5个关键站". 示例: "初诊到复色评估：白癜风全周期管理流程图".

#### F17: 医生IP型
结构模板: "皮肤科医生做{平台}的{关键策略}" - 适用品类: P11科普品牌. 适用受众: L2, L3. 示例: "皮肤科医生做抖音的5个选题方向+3条合规红线". 示例: "白癜风医生公众号定位：3种差异化路线".

#### F18: 中西医融合型
结构模板: "{中医概念}×{西医方案}：{融合思路}" - 适用品类: P7中西医结合. 适用受众: L2, L4. 示例: "肝郁气滞×JAK抑制剂：中西医联合治疗白癜风的思路". 示例: "气血不和×光疗：中医辨证指导光疗剂量调整".

#### F19: 争议讨论型
结构模板: "{争议话题}：{正方观点} vs {反方观点}" - 适用品类: P10指南解读, P1病理机制. 适用受众: L1. 示例: "白癜风是否需要系统筛查合并症：共识推荐vs临床实际". 示例: "JAK抑制剂口服vs外用：疗效与安全性的权衡".

#### F20: 患者视角型
结构模板: "{患者类型}的{核心需求}：{解决方案}" - 适用品类: P5患者教育, P6心理干预. 适用受众: L5. 示例: "面部白癜风患者的核心需求：可见改善+心理支持". 示例: "儿童白癜风家长的核心需求：安全用药+未来预后".

