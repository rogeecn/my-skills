## 情感触发词（7类）

| 类别 | 触发词列表 | 适用标题公式 | 适用受众 |
|------|-----------|-------------|---------|
| 恐惧驱散类 | 不传染、不危险、可控、可治、多数稳定、慢性管理 | F3禁忌纠正型, F5问答清单型 | L5 |
| 临床信心类 | 有方案、联合策略、进展期≠终点、复色是可能的、共识推荐 | F4对比选型型, F8权威背书型, F11指南解读型 | L1, L2 |
| 专业权威类 | 共识依据、真实世界数据、指南推荐、RCT证据、权威机构 | F8权威背书型, F13前沿速递型 | L1, L2, L3 |
| 希望重建类 | 复色案例、长期随访、联合成功、稳定期管理、平台期≠失败 | F2真实案例型, F6时间线型 | L2, L5 |
| 系统思维类 | 全身筛查、共病意识、不只看皮肤、多维度评估 | F15共病筛查型, F16诊疗流程型 | L2, L3 |
| 生活赋能类 | 遮盖化妆、社交策略、就业权益、日常护理、照常生活 | F10操作指南型, F20患者视角型 | L5 |
| 社区归属类 | 不是一个人、病友社群、世界白癜风日、同路人 | F7清单盘点型 | L5 |

---

## 标题组合规则

| 规则 | 说明 |
|------|------|
| 标题必须包含1个情感触发词 | 从7类中选择与受众匹配的触发词 |
| 标题公式+触发词+品类×受众 | 三层组合确保标题精准 |
| L5患者标题：恐惧驱散+希望重建+生活赋能 | 患者级内容避免专业权威类触发词 |
| L2临床标题：临床信心+专业权威+系统思维 | 临床级内容避免过度情感化触发词 |
| L1专家标题：专业权威+争议讨论 | 专家级内容追求理性客观而非情感触发 |
| 禁止在标题中使用"根治""治愈""彻底消失" | 医疗合规红线