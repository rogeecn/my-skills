# 白癜风药物管线追踪.yaml
# 创建日期: 2025-05-15
# 用途: 白癜风内容创作参考——药物管线与新疗法数据速查
# 说明: 本文件基于公开文献/新闻/临床登记数据蒸馏，仅供内容创作事实引用，
#       不构成投资或用药建议。每个条目标注证据等级(A/B/C/D)与阶段标签。
# 证据等级体系(GRADE): A=高质量 | B=中等 | C=低 | D=极低
# 阶段标签: 已上市 | III期 | II期 | I期 | 临床前 | 探索性
# 更新策略: 季度更新，重大获批/临床结果事件即时追加

meta:
  数据截止: "2025-05"
  主要来源:
    - 广东省药学会芦可替尼乳膏专家共识(2025-09)
    - TRuE-V1/V2 III期临床(NCT04052425/NCT04057573)
    - 中国真实世界研究(博鳌乐城,111例)
    - Insight数据库国内白癜风管线概览
    - 2024白癜风诊疗共识更新
    - 各药企临床登记公示平台

已上市药物:
  外用JAK抑制剂:
    芦可替尼乳膏_Ruxolitinib_Cream_Opzelura:
      名称: "磷酸芦可替尼乳膏 (Opzelura)"
      通用名: Ruxolitinib Cream 1.5%
      靶点: JAK1/JAK2
      机制: "抑制IFN-γ-JAK-STAT信号轴→减少CXCL9/CXCL10→阻断CD8+T细胞募集→打破正反馈循环→促进黑素细胞再生"
      阶段: 已上市
      批准历程:
        FDA: "2022-07 批准(≥12岁非节段型白癜风局部治疗)"
        EMA: "2023-04 批准(≥12岁伴面部受累非节段型)"
        中国澳门: 已获批
        中国博鳌乐城: "2023-08 落地先行先试"
        中国港澳药械通: "2025-03 珠海市人民医院首方落地"
        中国NMPA正式申报: "康哲药业从Incyte引进，III期进行中"
      关键临床数据:
        TRuE_V1_V2_III期_24周:
          试验编号: NCT04052425/NCT04057573
          样本: 674例≥12岁非节段型白癜风
          F-VASI75: "芦可替尼组29.8%(V1)/30.9%(V2) vs 安慰剂7.4%/11.4%"
          F-VASI90: "芦可替尼15.3%(V1)/16.3%(V2)"
          T-VASI50: "芦可替尼20.6%(V1)/23.9%(V2)"
          证据等级: A
        TRuE_V1_V2_III期_52周:
          F-VASI75: "52.6%(V1)/48.0%(V2)"
          安慰剂转换组28周: "27%(V1)/30%(V2)达F-VASI75"
          证据等级: A
        TRuE_V_LTE_104周:
          试验编号: NCT04530344
          F-VASI75: "66.1%(第104周)"
          F-VASI90: "33.9%(第104周)"
          T-VASI50: "63.8%(第104周)"
          证据等级: A
        中国真实世界研究_24周:
          样本: 111例非节段型(博鳌乐城)
          F-VASI75: "49.5%"
          F-VASI50: "64.9%"
          F-VASI90: "17.1%"
          既往治疗史比例: "93.7%"
          证据等级: B
      安全性要点:
        常见TEAE: "用药部位痤疮(5.9%/5.7%)、瘙痒(5.0%/5.3%)、脱皮"
        严重TEAE: "发生率低(1.8%)，均未认为与治疗相关"
        黑框警告: "FDA保留口服JAK抑制剂黑框(严重感染/MACE/血栓/恶性肿瘤)，但局部系统暴露极低(血药C_ss约56.9nM，远低于口服350nM)"
        长期104周: "耐受良好，未发现新安全警示"
        证据等级: A
      用法要点:
        浓度: 1.5%
        频次: 每日2次(间隔≥8h)
        最大范围: 10%BSA
        单次最大: 3.75g
        月限: 不超过2支(每支100g)
        建议疗程: ≥24周，可至52周或更长
      联合光疗数据:
        NB-UVB联合_104周:
          样本: 19例
          F-VASI平均改善: "50.2%"
          T-VASI平均改善: "29.5%"
          证据等级: C
      共识推荐:
        推荐意见1: "适用于皮损<10%BSA非节段型，可为一线或激素/CNI无效后选择(1级推荐/A级证据)"
        推荐意见2: "建议连续使用≥24周(1级推荐/A级证据)"
        推荐意见3: "至少24周评估疗效，有效则继续至52周(1级推荐/A级证据)"

  外用糖皮质激素:
    外用激素类_超说明书:
      名称: "外用糖皮质激素(多种)"
      代表: "卤米松、丙酸氯倍他索等"
      机制: "广谱抗炎免疫抑制"
      阶段: 已上市(超说明书用于白癜风)
      疗效定位: "传统一线，但长期使用→皮肤萎缩/毛细血管扩张等"
      证据等级: B
      备注: "所有传统药物用于白癜风均属超说明书适应症"

  外用钙调磷酸酶抑制剂:
    他克莫司软膏_超说明书:
      名称: "他克莫司软膏/吡美莫司乳膏"
      靶点: "钙调磷酸酶→抑制T细胞活化"
      阶段: 已上市(超说明书)
      疗效定位: "面部/眼周等薄皮肤区域常用，避免激素副作用"
      常见不良反应: "用药部位烧灼/刺痛感"
      证据等级: B

在研药物管线:
  JAK抑制剂_III期:
    乌帕替尼_Upadacitinib:
      名称: "乌帕替尼 (Abbvie)"
      靶点: JAK1选择性抑制剂
      阶段: III期
      关键数据:
        II期_NCT04927975_52周:
          F-VASI75: "37%-63%"
          T-VASI50: "32%-41%"
          患者自评好转: "77%-90%认为'好多了'或'有点好转'"
          证据等级: B
      备注: "口服制剂，系统性JAK抑制，需关注黑框警告风险"
      国内状态: III期进行中

    利特昔替尼_Ritlecitinib:
      名称: "利特昔替尼 (Pfizer)"
      靶点: "JAK3/TEC激酶家族抑制剂"
      阶段: III期
      备注: "靶向JAK3+TEC双机制，理论更精准抑制致病T细胞"
      国内状态: III期进行中

    芦可替尼乳膏_中国申报:
      名称: "芦可替尼乳膏(康哲药业/Incyte引进)"
      靶点: JAK1/JAK2
      阶段: III期(中国NMPA申报)
      备注: "已有海外获批+中国真实世界数据支撑，NMPA 2024-06批准真实世界数据作为上市证据"
      国内状态: III期进行中

    HDM3010:
      名称: "HDM3010 (华东医药)"
      靶点: JAK1/JAK2
      阶段: III期
      关键数据:
        III期设计: "随机双盲，主要终点24周F-VASI75"
      备注: "首个进入国内白癜风III期的国产JAK抑制剂"
      国内状态: III期启动(2024-09)

  JAK抑制剂_II期及更早:
    维恩201_Vian201:
      名称: "维恩201 (Vian Therapeutics)"
      靶点: "BET抑制剂(Bromodomain and Extra-Terminal)"
      机制: "外用凝胶，每日一次，靶向转录调控→抑制炎症基因表达"
      阶段: IIb期
      启动时间: "2024-06开始给药"
      目标: "低全身暴露下提供显著疗效"
      证据等级: C

  其他机制_I期及临床前:
    阿法美拉诺肽_Afamelanotide_Scenesse:
      名称: "阿法美拉诺肽 (Clinuvel/Tallinn Dermatology)"
      机制: "α-黑素细胞刺激激素类似物→激活MC1R→促进黑素合成"
      阶段: III期(CUV105试验)
      试验编号: NCT06109649
      设计: "联合NB-UVB光疗 vs NB-UVB单药"
      目标人群: "Fitzpatrick IV-VI型肤色患者"
      证据等级: B

    司亚丹凝胶:
      名称: "司亚丹凝胶(中科院新疆理化所)"
      机制: "中药1.1类创新药→调节局部异常黏液质+活血化瘀+赤肤着色"
      阶段: I期(2025-06获批临床试验)
      特点: "纯中药制剂(新疆地产药材)，外用凝胶剂型"
      疗效亮点: "前期数据显示儿童/青少年+面部(尤其眼周耳周)效果显著"
      预计上市: "3-5年"
      证据等级: D

    国内19款在研概览:
      总数: "19款国内获批或进入白癜风临床试验的产品"
      III期数量: 4款(乌帕替尼/利特昔替尼/芦可替尼乳膏/HDM3010)
      备注: "国内尚无治疗白癜风的创新药正式获批"

