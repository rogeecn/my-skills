关键概念速查:
  VASI评分体系:
    F-VASI: "面部白癜风面积评分指数(Facial VASI)"
    T-VASI: "全身白癜风面积评分指数(Total VASI)"
    F-VASI75: "面部白斑消退≥75%(关键疗效终点)"
    F-VASI90: "面部白斑消退≥90%(深度复色指标)"
    T-VASI50: "全身白斑消退≥50%"

  JAK-STAT通路与白癜风:
    核心轴: "IFN-γ→JAK1/JAK2→STAT→CXCL9/CXCL10→CD8+T细胞募集→攻击黑素细胞→更多IFN-γ(正反馈)"
    JAK抑制剂作用点: "阻断JAK1/JAK2→截断信号→减少趋化因子→打破循环"

  中国患者数据要点:
    患病率: "约0.56%(近2000万患者)"
    非节段型占比: "85%-90%"
    儿童比例: "约三分之一"
    成人30岁前发病: "70%-80%"
    传统治疗均属: 超说明书使用

内容创作引用规范:
  - 引用临床数据时标注试验编号(如NCT04052425)
  - 引用真实世界数据注明"真实世界研究"(非RCT)
  - 引用管线阶段注明"截至2025-05"
  - 探索性疗法必须标注"尚处研究阶段/未进入临床"
  - 不使用"治愈""根除"等绝对化表述
  - 境外获批药物在中国状态需区分("已境外获批"/"中国III期"/"中国未获批")