新型疗法探索:
  干细胞疗法:
    状态: 探索性
    机制: "利用间充质干细胞免疫调节特性→抑制自身免疫攻击+促进黑素细胞再生"
    当前进展: "基础研究阶段，尚无进入临床的成熟方案"
    证据等级: D
    内容创作提示: "可作为前沿展望素材，但需明确标注探索性质"

  基因治疗:
    状态: 探索性
    机制: "精准定位并修复引发白癜风的基因缺陷"
    2024进展: "基因编辑技术在白癜风领域取得概念突破"
    意义: "从根源解决问题理论路径"
    证据等级: D
    备注: "距离临床应用尚远，内容创作需谨慎表述"

  微生物组:
    状态: 探索性
    机制: "皮肤/肠道微生物群落与白癜风免疫失衡关联"
    当前进展: "流行病学关联研究，机制初探"
    证据等级: D
    内容创作提示: "可做科普选题(微生物组与免疫)，不宜承诺疗效"

  AI辅助诊疗:
    状态: 早期应用
    应用方向:
      - "深度学习分析病例→预测疾病发展趋势"
      - "辅助诊断+优化药物剂量"
      - "VASI评分AI自动化评估"
    证据等级: C

  口服小分子_新兴靶点:
    状态: 临床前-早期临床
    潜力靶点:
      - "CXCR3/CXCL10轴阻断(阻止T细胞趋化)"
      - "IL-15信号通路(维持记忆T细胞)"
      - "Wnt/β-catenin(促进黑素细胞增殖)"
    证据等级: D

