## 叙事基调选择规则表
| 受众 | 推荐基调 | 基调说明 | 禁忌基调 |
|------|---------|---------|---------|
| L1专家 | 学术辩论型 | 理性客观+证据驱动，允许争议 | 情感化极端、偏方推崇 |
| L2临床 | 实操指导型 | 步骤清晰+决策节点明确+避坑提醒 | 空泛理论、脱离实际 |
| L3基层 | 识别转诊型 | 简明标准+流程图+安全边界 | 过度简化导致误诊 |
| L4学习 | 系统框架型 | 知识地图+考点标注+临床关联 | 纯理论无案例 |
| L5患者 | 安心赋能型 | 误解纠正+可行路径+希望传递 | 恐惧放大、治愈承诺 |

---

## 叙事基调伦理禁区（8条硬性禁令）

| # | 禁令 | 原因 |
|---|------|------|
| 1 | 禁止任何形式的"根治""治愈承诺" | 白癜风目前无法根治，违反医疗真实性 |
| 2 | 禁止推荐偏方/替代正规治疗 | 违反医疗广告法和诊疗规范 |
| 3 | 禁止暗示"不治也能好" | 白癜风一般不自愈，误导患者延误治疗 |
| 4 | 禁止过度展示恶化案例不加说明 | 制造恐慌，违反正向叙事原则 |
| 5 | 禁止将白癜风与"丑陋""缺陷"直接关联 | 加重患者心理负担，违反尊严原则 |
| 6 | 禁止忽视个体差异的标准化表述 | 每个患者病情不同，模板化表述不专业 |
| 7 | 禁止无数据支撑的疗效断言 | 医学内容必须有循证依据 |
| 8 | 禁止暗示白癜风是患者"过错"导致 | 加重自责，违反疾病无过错原则 |