# 白癜风和相关皮肤病 — 正向叙事模板

> 何时读取: 撰写内容正文、设计叙事基调时读取
> 创建日期: 2026-05-15

---

## 赋能型情感触发词表

| 类别 | 触发词列表 | 适用场景 |
|------|-----------|---------|
| 临床信心类 | 可控、可治、有方案、联合策略、进展期≠终点、复色是可能的 | 进展期恐慌、治疗迷茫 |
| 患者安心类 | 非传染、不危险、慢性可控、多数稳定、生活照常 | 初诊焦虑、"传染"恐惧 |
| 专业权威类 | 共识推荐、指南依据、真实世界数据、权威机构背书 | 基层转诊、方案选择 |
| 希望重建类 | 复色案例、长期随访、联合成功、稳定期管理 | 治疗平台期、复发打击 |
| 系统思维类 | 全身筛查、共病意识、多维度评估、不只看皮肤 | 合并症忽视、单一器官局限 |
| 生活赋能类 | 遮盖化妆、社交策略、就业权益、日常护理 | 社交回避、就业歧视 |
| 社区归属类 | 不是一个人、病友社群、世界白癜风日、同路人 | 孤独感、自责 |

---

## 赋能大纲模板（3种以上）

### 模板1: 从恐惧到可控（适用于进展期/初诊场景）
1. 承认恐惧 → "发现白斑扩大，第一反应是恐慌——这是正常的"
2. 重新定义 → "进展期≠失控，而是免疫系统正在发出信号"
3. 提供路径 → "进展期的3种干预手段：激素冲击+光疗调整+联合方案"
4. 建立信心 → "多数进展期患者3个月内可转入稳定期"

### 模板2: 从误解到认知（适用于患者教育/家属沟通场景）
1. 指出误解 → "很多人以为白癜风传染/会恶化到全身——都是误解"
2. 呈现真相 → "白癜风是非传染性慢性病，多数患者终生局限在局部"
3. 行动指导 → "正确的做法是：规范治疗+日常防护+定期复诊"
4. 增强自主 → "了解这些后，你可以主动参与治疗决策"

### 模板3: 从局限到系统（适用于合并症筛查/基层提升场景）
1. 发现局限 → "只关注皮肤白斑，可能忽略甲状腺/心理等共病"
2. 拓展视野 → "白癜风是系统性自身免疫病的皮肤表现"
3. 系统行动 → "必查甲状腺功能+心理评估+年度筛查计划"
4. 全局获益 → "早期发现共病→提前干预→整体预后更好"

