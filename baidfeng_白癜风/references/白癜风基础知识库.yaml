# 白癜风基础知识库.yaml
# 创建日期: 2026-05-15
# 用途: 白癜风内容创作的临床事实参考文件，确保所有医疗科普内容有据可依
# 使用说明:
#   1. 写作任何涉及白癜风医学知识的文案时，必须先查阅本文件确认事实
#   2. 每条数据标注来源(百度百科/MSD/维基)，交叉验证后优先采用MSD+维基数据
#   3. 来源不一致的数据以[来源标注]标记，写作时需选择权威来源或注明争议
#   4. 更新时保留旧数据+标注新来源，不删除历史记录

疾病定义与概述:
  标准定义: "由皮肤黑素细胞被破坏/脱失，导致黑色素缺乏，形成局部或泛发性白色斑片的慢性皮肤病"
  别名: [白斑, 白蚀, 白斑症, 白蚀症]  # [维基]
  ICD编码:
    ICD_11: ED63.0  # [维基]
    ICD_10: L80  # [维基]
  传染性: 否  # [百度百科+MSD+维基一致]
  遗传性: 是，多基因遗传疾病  # [百度百科]
  疾病性质: 慢性  # [百度百科+MSD+维基一致]
  就诊科室: [皮肤科, 眼科, 精神心理科]  # [百度百科]

流行病学数据:
  全球患病率:
    - "0.1%-2%"  # [百度百科]
    - "高达2%"  # [MSD]
    - "全球约1%，某些族群2-3%"  # [维基]
  性别分布: 男女相同  # [维基]
  发病年龄:
    - "所有年龄段，儿童及青壮年多见"  # [百度百科]
    - "约半数20岁前出现病征，绝大多数40岁前发病"  # [维基]
    - "发病高峰15-30岁"  # [维基]
  肤色因素: 肤色深的人群发病率高  # [百度百科]

病因与发病机制:
  核心机制: "免疫系统攻击/破坏黑素细胞，导致局部黑色素脱失"  # [MSD+百度百科一致]
  确切病因: 发病原因不明  # [维基强调]
  主要病因因素:
    自身免疫: "免疫系统识别黑素细胞为外来细胞并攻击"  # [百度百科+MSD]
    遗传因素: "多基因遗传，有家族倾向/家族史为危险因子"  # [百度百科+MSD+维基]
    神经化学: "神经化学物质因素"  # [百度百科]
    环境触发: "基因易感性+环境因素共同作用"  # [维基]
  诱发/触发因素:
    精神因素: [过度劳累, 焦虑, 压力, 精神创伤, 工作紧张, 情感压力, 情绪波动]  # [百度百科+MSD+维基]
    皮肤损伤: [晒伤, 割伤, 化学烧伤, 外伤, 同形反应]  # [百度百科+MSD+维基]
    化学接触: "化学物品接触"  # [百度百科]
    其他: [分娩, 手术, 湿疹皮炎, 系统疾病]  # [百度百科+维基]
    免疫治疗: "治疗黑素瘤的免疫疗法可引发白癜风作为副作用"  # [MSD独有]
  伴随自身免疫病: [甲状腺功能亢进, 甲状腺功能减退, 糖尿病, 艾迪生病, 恶性贫血]  # [MSD]

临床分型与分期:
  分型:
    非节段性:
      占比: "~90%"  # [维基]
      特征: "身体两侧出现白斑，范围随时间扩大"
    节段性:
      占比: "~10%"  # [维基]
      特征: "身体某侧出现白斑，范围通常不扩大"
  分期:
    进展期:
      特征: "白斑扩大，可出现三色白癜风(白-淡白-正常肤色过渡)"
      同形反应: "皮肤损伤部位出现新白斑"  # [百度百科]
      Wood灯表现: "灰白色荧光"  # [百度百科]
    稳定期:
      特征: "白斑停止扩展，呈乳白色或瓷白色，境界清楚，边缘色素加深"
      Wood灯表现: "蓝白色荧光"  # [百度百科]

临床表现与症状:
  皮损特征:
    形态: "一片或几片大小不一的白色斑片，中心白色显著，周围淡白色，可略呈粉红色"  # [百度百科]
    边缘: "不规则边缘"  # [维基]
  常见发病部位:
    面部颈部区: [面部, 颈部, 口唇]  # [百度百科+MSD]
    手臂区: [手背, 手指, 腕部, 前臂, 手肘, 手部]  # [百度百科+MSD]
    躯干区: [腹部, 腰骶部, 肚脐, 乳头]  # [百度百科+MSD]
    下肢区: [膝盖, 小腿, 脚踝, 脚趾]  # [MSD]
    黏膜区: [阴部, 肛门黏膜, 腹股沟, 腋窝, 肛门生殖器区]  # [百度百科+MSD]
  毛发改变: "毛囊黑素细胞缺失→毛发变白"  # [MSD]
  日晒敏感: "皮损处易晒伤"  # [MSD]

诊断与鉴别诊断:
  诊断方法:
    临床观察: "典型皮损表现即可初步诊断"  # [MSD]
    Wood灯检查: "伍德氏灯/Wood灯检查确认"  # [MSD+百度百科]
    皮肤镜: "毛囊周围残留色素"  # [百度百科]
    组织病理: "DOPA或Melan-A染色阴性"  # [百度百科]
    RCM: "色素环失去完整性"  # [百度百科]
    抗体检测: "抗甲状腺球蛋白抗体等自身免疫抗体"  # [百度百科]
  鉴别诊断:
    单纯糠疹: "儿童面部常见，可区分"  # [百度百科]
    花斑糠疹: "颈部躯干常见"  # [百度百科]
    贫血痣: "先天性，摩擦后不发红"  # [百度百科]
    无色素痣: "出生时即有"  # [百度百科]
    炎症后色素减退: "有原发疾病史"  # [百度百科]

治疗方案体系:
  核心事实: "无根治手段，治疗目标为改善外观"  # [维基]
  防晒: "防晒衣+防晒霜为基础措施"  # [MSD]
  局部外用:
    皮质类固醇: "强效皮质类固醇乳膏/激素"  # [百度百科+MSD]
    钙调磷酸酶抑制剂:
      - 他克莫司软膏  # [百度百科+MSD]
      - 1%吡美莫司乳膏  # [百度百科+MSD]
      适用部位: "面部/腹股沟等敏感区域"  # [MSD]
    维生素D3衍生物:
      - 卡泊三醇软膏  # [百度百科+MSD]
      - 他卡西醇软膏  # [百度百科]
      联合方案: "卡泊三醇+倍他米松联合，比单用更有效"  # [MSD]
    JAK抑制剂:
      - 芦可替尼乳膏  # [MSD独有]
      注意: "停药后色素脱失复发"
  全身口服:
    泼尼松: "低剂量口服皮质类固醇，限制迅速扩散"  # [百度百科+MSD]
    复方倍他米松注射液: "急性期注射用"  # [百度百科]
  光疗:
    NB_UVB: "窄谱中波紫外线"  # [百度百科]
    308nm准分子: "准分子光/激光"  # [百度百科]
    PUVA: "补骨脂素+UVA"  # [百度百科]
    通用紫外线灯: "需数月显效"  # [MSD]
    激光适用: "小斑块皮质类固醇无效后"  # [MSD]
  手术治疗:
    自体表皮皮片移植: "最常用"  # [百度百科]
    微小皮片移植:  # [百度百科]
    刃厚皮片移植:  # [百度百科]
    混合表皮细胞移植:  # [百度百科]
    黑素细胞移植:  # [MSD]
    纹身: "适用于乳头/嘴唇/手指尖"  # [MSD]
    评价: "自表皮移植最有希望"  # [维基]
  脱色/漂白治疗:
    适用条件: "体表面积>95%"  # [百度百科] / "大片皮损患者"  # [MSD]
    药物: "20%氢醌单苯醚"  # [百度百科] / "强效氢醌乳膏"  # [MSD]
    关键警告: "不可逆，漂白未受损皮肤"  # [MSD]
  遮盖治疗:
    - "含染料的物理/化学遮盖剂"  # [百度百科]
    - "化妆品掩饰"  # [维基]
  中医辨证:
    进展期证型: [风湿郁热证, 肝郁气滞证]  # [百度百科]
    稳定期证型: [肝肾不足证, 瘀血阻络证]  # [百度百科]

合并症与并发症:
  眼部并发症:
    葡萄膜炎:  # [百度百科]
    VKH综合征:  # [百度百科]
    Alezzandrini综合征: "眼-皮肤-耳综合征"  # [百度百科]
  伴随自身免疫病: [甲状腺功能亢进, 甲状腺功能减退, 糖尿病, 艾迪生病, 恶性贫血]  # [MSD]

预后与复发:
  预后性质: "慢性疾病，无法根治但可控"  # [维基+百度百科]
  自行好转: "部分患者可自行好转"  # [百度百科]
  复发: "部分可复发，但再治疗仍有效"  # [百度百科]
  JAK抑制剂复发: "芦可替尼停药后色素脱失复发"  # [MSD]
  脱色治疗不可逆: "漂白治疗不可逆"  # [MSD]

患者常见误区:
  - 误区: "白癜风会传染" → 事实: "不具传染性"  # [三源一致]
  - 误区: "白癜风是绝症无法治疗" → 事实: "虽无根治手段，但有多种治疗方案可改善外观"  # [维基+MSD]
  - 误区: "白癜风完全由遗传决定" → 事实: "多基因遗传+环境因素共同作用"  # [维基]
  - 误区: "白癜风只影响外观不影响健康" → 事实: "可伴发自身免疫病(甲状腺等)、眼部并发症、皮损易晒伤"  # [MSD+百度百科]
  - 误区: "晒太阳能治白癜风" → 事实: "暴晒可诱发/加重白斑，但医控光疗(NB-UVB等)是正规治疗"  # [百度百科+MSD]
  - 误区: "白癜风患者不能结婚生育" → 事实: "有遗传倾向但非单基因遗传病，并非绝对遗传"  # [百度百科]

