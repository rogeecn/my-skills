## 病例类型分类（8类）

### C1 典型病例
定义: 展示白癜风标准诊疗流程的"教科书式"病例
核心目标: 建立读者对规范诊疗流程的认知
受众适配: L2(临床级), L3(基层级), L5(患者级)
搜索数据发现:
  - 今日头条"案例分析——常型白癜风"：28岁女性面部手部对称白斑，3个月进展期→规范治疗→复色
  - 健康界"白癜风个性化治疗与临床典型病例分享会"：更年期女性20年病史→中西医结合→复色
常见标题模式:
  - "案例分析——{分型}白癜风"
  - "{年龄}{性别}患者{部位}白斑{时长}：一例典型白癜风的诊疗全记录"
  - "从初诊到复色：一例{分型}白癜风的{时长}管理日记"
创作要点:
  - 病例背景需包含：年龄、性别、发病部位、病程时长、既往史
  - 展示完整诊疗链路：初诊→检查→分型分期→方案制定→治疗→评估→调整
  - 复色过程需有时间节点标注（如3月/6月/12月）
  - 结尾需总结该类型病例的诊疗要点清单

### C2 疑难病例
定义: 合并复杂因素（共病/特殊部位/耐药/快速进展）的诊疗难题
核心目标: 展示临床思维深度和个体化方案设计能力
受众适配: L1(专家级), L2(临床级)
搜索数据发现:
  - 知乎"白癜风临床中的真实案例"：57岁散发型3年病史头面部颈部
  - 健康界病例：更年期+20年病史+大面积扩散→综合调理方案
常见标题模式:
  - "病例拆解：{复杂因素}的白癜风，如何找到突破口"
  - "疑难病例：{合并症}×白癜风，诊疗路径怎么选"
  - "当白癜风遇上{共病}：一例{时长}疑难病例的{数量}个关键决策"
创作要点:
  - 突出疑难因素：合并症、特殊部位、耐药、多药相互作用
  - 展示决策过程：为什么选A方案而非B方案
  - 包含"陷阱提示"：容易犯的错误和纠正思路
  - 多学科视角呈现

### C3 误诊纠正
定义: 被误诊为白癜风或其他疾病后纠正诊断的病例
核心目标: 强化鉴别诊断意识，减少误诊
受众适配: L2(临床级), L3(基层级), L5(患者级)
搜索数据发现:
  - 万方医学"误诊为白癜风的皮肤病14例临床分析"：14例不典型病例正确诊断为无色素痣/蕈样肉芽肿/系统性硬皮病/硬化性萎缩性苔藓/盘状红斑狼疮/皮肤弹力纤维减少性疾病/老年性白斑
  - 诊断鉴别搜索高频词：花斑癣vs白癜风/白化病vs白癜风/炎症后色素减退vs白癜风
常见标题模式:
  - "从误诊{原诊断}到确诊{正确诊断}：{数量}个鉴别要点必须掌握"
  - "差点当白癜风治了！一例{正确诊断}的鉴别启示"
  - "误诊为白癜风的{数量}种皮肤病：你踩坑了吗"
创作要点:
  - 清晰展示误诊过程：为什么被误诊、误诊多久、造成什么影响
  - 关键鉴别点需表格化呈现（颜色/边界/鳞屑/Wood灯/皮肤镜/病理）
  - 纠正诊断的具体检查手段和依据
  - 误诊教训总结：哪些特征最容易被忽略

### C4 长期随访
定义: 展示5年以上随访数据的病例，关注长期疗效和复发规律
核心目标: 建立读者对白癜风长期管理的认知
受众适配: L1(专家级), L2(临床级), L5(患者级)
搜索数据发现:
  - 健康界病例：20余年病史的更年期患者随访管理
  - MSD手册强调"白癜风易复发，需长期管理"
常见标题模式:
  - "{时长}年随访追踪：白癜风复发规律与应对策略"
  - "一例白癜风患者的{时长}年管理日记：3次复发与{数量}次调整"
  - "长期随访启示：白癜风稳定期为什么更要警惕"
创作要点:
  - 需展示时间轴：每个关键节点的病情变化和方案调整
  - 复发事件需标注触发因素（季节/情绪/内分泌/外伤）
  - 长期数据呈现：复色率变化/复发频次/方案迭代
  - 预后评估和未来展望

### C5 治疗失败
定义: 某方案治疗效果不佳或失败的病例分析
核心目标: 展示治疗失败的反思，避免读者盲目期待
受众适配: L2(临床级), L5(患者级)
搜索数据发现:
  - 间接来源：各搜索数据中"疗效不理想""复色困难""耐药"关键词高频出现
常见标题模式:
  - "为什么{方案}效果不理想？一例白癜风治疗失败的深度复盘"
  - "治疗{时长}仍未复色：这{数量}个原因你可能没想到"
  - "从失败中学习：{方案}无效后如何调整策略"
创作要点:
  - 不回避失败，客观呈现：什么方案、用了多久、效果如何
  - 失败原因分析：分型分期误判/方案选择不当/患者依从性差/合并症未处理
  - 失败后的方案调整思路
  - 正向结尾：失败不是终点，调整方向再出发

### C6 联合治疗
定义: 展示多种治疗手段联合应用的病例
核心目标: 展示联合治疗的设计逻辑和协同效应
受众适配: L1(专家级), L2(临床级)
搜索数据发现:
  - 健康界病例：中西医结合+身心综合诊疗方案
  - 光疗外科搜索：308nm+外用药物联合/光疗+JAK抑制剂联合
  - 诊疗共识2024版强调"综合治疗：药物、光疗、手术等联合应用"
常见标题模式:
  - "{方案A}+{方案B}联合治疗：一例白癜风的协同复色之路"
  - "中西医结合×白癜风：从辨证到光疗的联合方案设计"
  - "联合治疗病例拆解：{数量}种手段如何排列组合"
创作要点:
  - 展示联合逻辑：为什么需要联合、各方案的角色定位
  - 时间线呈现：各方案的启用时机和衔接关系
  - 协同效应说明：联合 vs 单用的差异
  - 注意事项：联合方案的不良反应叠加风险

### C7 复发管理
定义: 白癜风复发后的再评估和再治疗病例
核心目标: 建立读者对复发可管理的信心
受众适配: L2(临床级), L5(患者级)
搜索数据发现:
  - MSD手册："白癜风易复发"
  - 各共识强调稳定期仍需维持管理和监测
  - 知乎/搜索高频话题："白癜风复发怎么办""春季复发高峰"
常见标题模式:
  - "白癜风复发了！{数量}步重新评估+{数量}个调整信号"
  - "第{次数}次复发后的再治疗：一例白癜风复发管理的完整路径"
  - "复发≠失败：白癜风复发管理策略与心态重建"
创作要点:
  - 复发触发因素分析：季节/情绪/感染/外伤/停药
  - 再评估流程：重新分型分期→重新制定方案
  - 复发后方案与初诊方案的差异和调整逻辑
  - 心理重建部分：复发后的心态调整和期望管理

### C8 外科移植
定义: 涉及自体表皮移植/黑素细胞移植等外科手段的病例
核心目标: 展示外科移植的适用条件和操作流程
受众适配: L1(专家级), L2(临床级), L5(患者级)
搜索数据发现:
  - MSD手册提及"必要时可接受皮肤移植或纹身"
  - 特殊人群搜索提及"儿童白癜风是否也能移植治疗"
  - 光疗外科搜索数据中移植与光疗的衔接
常见标题模式:
  - "稳定期白癜风的终极选择：一例自体表皮移植的完整记录"
  - "光疗{时长}后仍不满意→外科移植：从保守到进取的方案跃迁"
  - "黑素细胞移植vs自体表皮移植：一例{部位}白癜风的方案选择"
创作要点:
  - 强调前提条件：必须是稳定期、VIDA评分达标
  - 展示术前评估→手术过程→术后管理全链路
  - 移植效果评估：复色率/色差/边界过渡
  - 风险告知：移植后色差/同形反应/感染风险

