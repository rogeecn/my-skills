## 关键决策节点清单（通用）

### 诊断确认阶段
  - DN1: 白斑是否为白癜风？（vs花斑癣/无色素痣/贫血痣/炎症后色素减退）
  - DN2: 白癜风分型？（节段型/非节段型/混合型/未定类型）
  - DN3: 白癜风分期？（进展期/稳定期，VIDA评分）
  - DN4: 是否存在合并症？（甲状腺/斑秃/糖尿病/其他自身免疫病）
  - DN5: 诱因/加重因素？（精神压力/外伤/日晒/内分泌变化）

### 方案制定阶段
  - DN6: 进展期控制方案？（外用激素/JAK抑制剂/口服小剂量冲击/光疗）
  - DN7: 稳定期复色方案？（光疗/外用药物/外科移植/联合方案）
  - DN8: 部位适配？（面部选他克莫司而非强效激素/手足选光疗+外用）
  - DN9: 特殊人群考量？（儿童用药限制/孕妇禁忌/老年合并症）
  - DN10: 患者期望管理？（复色率/时间周期/复发风险沟通）

### 治疗执行阶段
  - DN11: 首次评估节点？（3个月：有无复色迹象）
  - DN12: 方案调整信号？（6个月未复色→调整方案/复色满意→减量维持）
  - DN13: 不良反应处理？（激素性萎缩/光疗灼伤/JAK抑制剂局部刺激）
  - DN14: 依从性管理？（用药频率/光疗规律/随访提醒）

### 长期管理阶段
  - DN15: 复色维持策略？（逐步减量/维持光疗频率/防晒管理）
  - DN16: 复发监测？（季节预警/情绪监测/外伤防护）
  - DN17: 再次进展的处理？（重新评估→方案升级）
  - DN18: 心理支持介入时机？（社交困扰/复发打击/长期等待焦虑）

