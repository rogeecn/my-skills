## 病例内容创作禁忌

### 隐私保护红线（不可违反）
  - RULE1: 绝不使用真实患者姓名，统一使用化名（如"张女士"/"李先生"/"小王"）
  - RULE2: 不透露具体就诊医院名称（使用"某医院"替代）
  - RULE3: 不透露具体就诊日期（使用"2023年某月"替代，模糊化时间）
  - RULE4: 不透露患者真实地域（使用"来自某省"替代，或完全省略）
  - RULE5: 不展示未经授权的患处照片（使用示意图/插画替代）
  - RULE6: 不展示患者身份证号、联系方式等任何可识别信息

### 脱敏要求（创作时必须执行）
  - DES1: 年龄使用区间而非精确值（如"28岁左右"而非"28岁"，或使用"20+女性")
  - DES2: 病程使用约数（如"约3年"而非"3年2个月"）
  - DES3: 白斑面积使用百分比而非精确测量值（如"约占面部30%"而非"4.2cm²"）
  - DES4: 修改至少1个非关键临床参数使其不对应任何真实个体
  - DES5: 合并症信息需模糊化处理（如"甲状腺功能异常"而非"桥本甲状腺炎TSH=8.2"）

### 内容伦理底线
  - ETH1: 每篇病例内容结尾必须标注"本文病例为创作范例，仅供科普参考，具体诊疗请遵医嘱"
  - ETH2: 不夸大治疗效果，不承诺"根治""彻底治愈"
  - ETH3: 不暗示某特定医院/医生的治疗效果优于其他
  - ETH4: 治疗失败类内容不以负面渲染代替客观分析
  - ETH5: 不利用病例内容进行药品/器械的直接商业推广
  - ETH6: 患者自述类内容需额外标注"以下为创作范例，非真实患者自述"

