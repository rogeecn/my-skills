## 常见误诊类型（从搜索数据提取）

### 误诊方向1：其他疾病被误诊为白癜风
来源论文: "误诊为白癜风的皮肤病14例临床分析"（万方医学）
误诊疾病清单:
  - 无色素痣: 先天性，边界不清晰，Wood灯下无亮白色荧光
  - 蕈样肉芽肿: 早期皮肤T细胞淋巴瘤，可表现为色素减退斑
  - 系统性硬皮病: 硬化性皮损伴色素改变
  - 硬化性萎缩性苔藓: 瘙痒+硬化+萎缩，多见于外生殖器
  - 盘状红斑狼疮: 盘状红斑后遗留色素减退，有毛囊破坏
  - 皮肤弹力纤维减少性疾病: 弹力纤维异常致皮肤松弛+色素改变
  - 老年性白斑: 老年人四肢圆形小白点，边界清晰但不扩大
鉴别关键: Wood灯/皮肤镜/组织病理/真菌检查

### 误诊方向2：白癜风被误诊为其他疾病
来源: 诊断鉴别搜索数据
误诊方向清单:
  - 白癜风→花斑癣: 早期白癜风边界模糊时易混淆
  - 白癜风→炎症后色素减退: 进展期白癜风伴炎症反应时
  - 白癜风→白化病: 全身泛发型白癜风与白化病需基因检测鉴别
  - 白癜风→无色素痣: 儿童单侧固定白斑需Wood灯鉴别
  - 白癜风→贫血痣: 摩擦后局部不发红（血管异常而非色素异常）
鉴别关键: 病史+Wood灯+皮肤镜+摩擦试验+真菌镜检

