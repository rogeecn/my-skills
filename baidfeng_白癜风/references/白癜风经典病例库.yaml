## 病例创作大纲模板（按类型）

### C1 典型病例创作大纲
  标题: 参照F12"病例拆解型"或F2"真实案例型"标题公式
  结构: N1时间线叙事
  必含模块:
    - 病例背景卡片（化名/年龄段/性别/白斑部位/病程约数/分型分期）
    - 初诊评估详述（Wood灯/皮肤镜/VIDA评分/合并症筛查）
    - 方案制定理由（为什么选这个方案、沟通要点）
    - 治疗时间轴图表（T0→T3月→T6月→T12月各节点变化）
    - 复色评估（复色面积百分比/色差评估/边界过渡）
    - 诊疗要点清单（5-7条takeaway）
  字数建议: 1500-2500字
  配图建议: 时间轴示意图/复色进度示意图/诊疗流程图

### C2 疑难病例创作大纲
  标题: 参照F12"病例拆解型"标题公式，突出疑难因素
  结构: N2决策链叙事
  必含模块:
    - 病例背景+疑难因素清单卡片
    - 决策节点详解（4-6个关键决策，每个附带对比逻辑）
    - "如果选另一条路"对比框
    - 陷阱提示框（容易犯的错误）
    - 多学科视角补充
    - 决策思维总结
  字数建议: 2000-3500字
  配图建议: 决策树图/方案对比表/陷阱提示卡

### C3 误诊纠正创作大纲
  标题: 参照F2"真实案例型"或F3"禁忌纠正型"标题公式
  结构: N3误诊纠正叙事
  必含模块:
    - 误诊阶段描述（什么表现→什么诊断→持续多久→造成什么影响）
    - 纠正契机（什么检查/发现触发纠正）
    - 鉴别要点对比表（误诊疾病 vs 正确诊断，至少5个维度）
    - 纠正后治疗方案
    - 误诊教训总结（3-5条）
    - 防误诊清单
  字数建议: 1500-2500字
  配图建议: 鉴别诊断对比表/检查手段示意图

### C4 长期随访创作大纲
  标题: 参照F6"时间线型"标题公式
  结构: N1时间线叙事（扩展版）
  必含模块:
    - 病例背景卡片（强调病程长度）
    - 随访时间轴（5年以上，标注每个关键节点）
    - 复发事件详述（触发因素/再评估/方案调整）
    - 长期数据呈现（复色率曲线/复发频次/方案迭代记录）
    - 预后评估与未来展望
    - 长期管理要点清单
  字数建议: 2500-4000字
  配图建议: 长期随访时间轴图/复色率变化曲线图

### C5 治疗失败创作大纲
  标题: 参照F9"逆向思维型"标题公式
  结构: N4失败-反思叙事
  必含模块:
    - 治疗期望说明
    - 失败过程客观呈现（时间线+效果数据）
    - 失败原因归类分析
    - 反思与调整思路
    - 新方案效果呈现
    - 给同类患者的期望管理建议
    - 正向收束语
  字数建议: 1500-2500字
  配图建议: 失败时间线图/原因归类图/方案迭代对比

### C6 联合治疗创作大纲
  标题: 参照F18"中西医融合型"或F4"对比选型型"标题公式
  结构: N2决策链叙事
  必含模块:
    - 病例背景卡片（需联合的因素清单）
    - 联合方案设计逻辑（各方案角色定位/启用时机）
    - 联合时间线（方案A+B各启用时间和衔接点）
    - 协同效应说明
    - 不良反应叠加风险提示
    - 联合治疗要点总结
  字数建议: 2000-3000字
  配图建议: 联合方案时间线图/各方案角色定位图/协同效应示意

### C7 复发管理创作大纲
  标题: 参照F6"时间线型"或F9"逆向思维型"标题公式
  结构: N1时间线叙事 + 心理重建模块
  必含模块:
    - 复发触发因素分析
    - 再评估流程（重新分型分期→重新方案制定）
    - 复发后方案与初诊方案差异对比
    - 心理重建部分（心态调整/期望管理）
    - 复发监测与预防策略
    - 复发管理要点清单
  字数建议: 1500-2500字
  配图建议: 复发触发因素图/方案差异对比表/心理重建路线图

### C8 外科移植创作大纲
  标题: 参照F16"诊疗流程型"标题公式
  结构: N2决策链叙事
  必含模块:
    - 前提条件确认（稳定期/VIDA评分达标/保守治疗效果）
    - 术前评估详述
    - 手术方案选择逻辑（表皮移植vs黑素细胞移植vs其他）
    - 手术过程简述（不展示真实手术照片）
    - 术后管理详述（护理/光疗衔接/随访）
    - 效果评估（复色率/色差/边界过渡）
    - 风险告知与注意事项
  字数建议: 2000-3000字
  配图建议: 术前评估流程图/方案选择决策树/术后管理时间线