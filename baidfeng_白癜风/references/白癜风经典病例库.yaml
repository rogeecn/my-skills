# 白癜风和相关皮肤病 — 经典病例库（创作框架）

> 何时读取: 策划病例分享类内容(P9)、设计病例叙事结构时读取
> 蒸馏来源: 万方医学/知乎/今日头条/健康界等"病例分享"搜索数据 + 诊断鉴别/合并症/光疗外科/特殊人群交叉数据
> 创建日期: 2026-05-15
>
> 使用说明:
>   本文件不是真实病例集合，而是病例类内容的创作框架和模板库。
>   所有"病例模板"均为虚构框架，创作时需：
>   1. 使用化名，绝不使用真实患者姓名
>   2. 脱敏处理：隐去具体地域、医院、就诊日期
>   3. 修改关键参数使其不对应任何真实个体
>   4. 标注"本文病例为创作范例，仅供科普参考"
>   5. 不展示未经授权的患处照片，使用示意图替代

