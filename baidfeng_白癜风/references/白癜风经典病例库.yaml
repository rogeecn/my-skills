## 病例叙事结构模板（5种）

### N1 时间线叙事（最常用）
适用病例类型: C1, C4, C7
结构:
  1. 病例背景（化名/年龄/性别/部位/病程）
  2. 初诊评估（分型分期/检查结果/鉴别要点）
  3. 方案制定（选方案逻辑/患者沟通）
  4. 治疗过程时间轴（T0→T3月→T6月→T12月...）
  5. 关键转折点（复色开始/方案调整/复发事件）
  6. 现状与展望（复色评估/维持方案/患者心态）
  7. 诊疗要点总结清单
结尾模板: "本文病例为创作范例，仅供科普参考，具体诊疗请遵医嘱"

### N2 决策链叙事（突出临床思维）
适用病例类型: C2, C6, C8
结构:
  1. 病例背景+疑难因素清单
  2. 决策节点1：诊断确认（为什么是这个诊断而非其他）
  3. 决策节点2：方案选择（A vs B vs C的比较逻辑）
  4. 决策节点3：方案调整（什么信号触发调整、怎么调）
  5. 决策节点4：终点评估（达到什么目标、未达到什么目标）
  6. 每个决策节点附带"如果选了另一条路会怎样"的对比
  7. 决策思维总结
结尾模板: "本文病例为创作范例，仅供科普参考，具体诊疗请遵医嘱"

### N3 误诊纠正叙事（警示型）
适用病例类型: C3
结构:
  1. 误诊阶段的临床表现和诊断
  2. 误诊持续时间与影响
  3. 纠正诊断的契机（什么检查/什么发现/什么转诊）
  4. 鉴别要点对比表（误诊疾病 vs 正确诊断）
  5. 纠正后的治疗方案和效果
  6. 误诊教训总结
  7. 防误诊清单
结尾模板: "本文病例为创作范例，仅供科普参考，具体诊疗请遵医嘱"

### N4 失败-反思叙事（坦诚型）
适用病例类型: C5
结构:
  1. 治疗期望和初始方案
  2. 失败过程的客观呈现（时间线+效果数据）
  3. 失败原因分析（归类：分型误判/方案不当/依从性差/合并症/其他）
  4. 失败后的反思和调整
  5. 新方案的效果
  6. 给同类患者的建议和期望管理
  7. 正向收束：失败是通往成功的必经信息
结尾模板: "本文病例为创作范例，仅供科普参考，具体诊疗请遵医嘱"

### N5 患者自述叙事（共鸣型）
适用病例类型: C1, C4, C7（面向L5受众时使用）
结构:
  1. 患者视角开头："我第一次发现白斑是在..."
  2. 心理历程（发现→恐惧→接受→行动）
  3. 就诊经历（去了哪里、说了什么、医生怎么回应）
  4. 治疗感受（用药体验、光疗感受、复色喜悦）
  5. 关卡时刻（复发/效果停滞/社交压力）
  6. 现在的状态和心态
  7. 给同路人的寄语
注意: 此模板需额外标注"以下为患者视角创作范例，非真实患者自述"
结尾模板: "本文为创作范例，仅供科普参考。治疗方案仅为范例展示，具体诊疗请务必遵医嘱"

