## 搜狗微信搜索洞察

### 1. 竞争格局
- **医院品牌号占据70%+的搜索结果** — 几乎所有搜索结果都是各地白癜风专科医院/皮肤病医院的官方号
- **医生个人号以姓名+白癜风命名** — 如"白癜风郑华国医生""白癜风李从悠医生"，内容同质化严重
- **真正的学术权威号极少** — 只有"实用皮肤病学杂志""中医书友会"等少数

### 2. 标题模式分析
- **问句型占比最高**: "白癜风能治好吗?""多久能好?""会影响寿命吗?"
- **数字型极常见**: "4点""5种""3类""3个信号""5个行为"
- **感叹号型**: "居然这么重要!""差别竟在这!"
- **辟谣型**: "不!科学干预可让病情长期稳定""三天就能治好?"

### 3. 内容同质化严重
- 医院品牌号几乎都做: 饮食+换季注意事项+治疗多久能好+辟谣
- 医生个人号几乎都做: 某种行为的危害+N个建议
- **真正的差异化空白**: 机制解读、指南共识深度解读、患教话术、合规指南