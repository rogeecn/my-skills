## 补抓数据补充的竞品洞察

### 平台生态分布
- 学术权威平台: 丁香园、中华皮肤科杂志、MSD、万方（L1/L2）
- 大众科普平台: 百度健康、39健康网、搜狐健康、有来医生（L3/L5）
- 短视频平台: 抖音、B站、好看视频（KOL+医生个人IP）
- 深度报道: 澎湃新闻、新华网（患者故事+社会议题）
- 个人IP: 杂谈君博客、各位医生KOL（细分专业内容）

### KOL生态关键发现
- 抖音皮肤科医生KOL已有百万粉丝级别玩家
- B站有皮肤科医生入驻做长视频科普的趋势
- 医生KOL核心打法: 矩阵式短视频+门诊故事+争议话题引流
- 白癜风领域KOL多为医院绑定账号而非纯科普IP

