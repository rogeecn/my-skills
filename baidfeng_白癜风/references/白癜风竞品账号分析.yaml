## 差异化定位建议

### 空白1: 基层5分钟速学系列
- 竞品集中在L1/L2受众，L3基层医生内容严重不足
- 定位: "基层白癜风5分钟速学"系列——识别+鉴别+转诊+基础患教
- 差异化价值: 填补基层医生最需要的"快速识别+安全转诊"内容缺口

### 空白2: 患教沟通话术系列
- 竞品做患教内容但缺少系统化话术模板
- 定位: "白癜风初诊/复诊/平台期/复发"4大场景话术模板
- 差异化价值: 医生最需要的不是"科普知识"而是"怎么跟患者说"

### 空白3: 医生新媒体合规指南
- 四部门刚发文规范自媒体医疗科普，竞品尚未系统化覆盖
- 定位: "白癜风医生新媒体选题+合规红线清单"
- 差异化价值: 紧抓政策窗口期，解决医生做新媒体的核心顾虑

### 空白4: 机制→临床叙事系列
- 竞品要么纯机制（专家级），要么纯实操（临床级），缺少"机制→临床"桥梁
- 定位: "从机制到方案"系列——把分子机制讲成可理解的故事再引出临床决策
- 差异化价值: 让L2临床医生既能理解机制又能转化为方案选择

### 空白5: 合并症筛查流程图系列
- 竞品讲合并症但缺少可操作的筛查流程
- 定位: "白癜风共病筛查流程图+转诊标准"
- 差异化价值: 从"知道要查"到"具体怎么查+查完怎么办"

