# 白癜风和相关皮肤病 — 平台适配指南

> 何时读取: 发布内容到不同平台时读取
> 创建日期: 2026-05-15

---

## 6平台内容适配

| 平台 | 内容形式 | 标题风格 | 字数规格 | 特殊要求 |
|------|---------|---------|---------|---------|
| 微信公众号 | 长图文（1500-3000字） | 专业感标题：共识解读/病例拆解/方案对比 | 1500-3000字 | 医疗广告法合规标注；禁止治愈承诺；文末标注"本文仅为科普，不构成医疗建议" |
| 抖音 | 短视频（60-90秒） | 痛点标题：5分钟速学/误区爆破 | 60-90秒口播 | 前3秒抓注意力；必须口语化；避免专业术语堆砌；视频封面不用过度恶化图片 |
| B站 | 中长视频（3-8分钟） | 深度标题：机制故事/病例拆解 | 3-8分钟 | 允许一定专业度但需通俗化讲解；弹幕互动引导"你遇到过类似情况吗？" |
| 知乎 | 问答/专栏文章 | 问答型标题：如何区分/为什么必须 | 500-1500字 | 回答必须标注证据等级；专栏需系统性框架 |
| 小红书 | 图文+短视频 | 生活化标题：日常护理/遮盖化妆 | 500字图文/60秒视频 | 必须生活化、视觉化；避免过度医学化；封面用遮盖化妆后的对比图 |
| 视频号 | 中长视频（3-10分钟） | 实操演示标题：光疗操作/遮盖教程 | 3-10分钟 | 适合患者教育类实操演示；需要真人出镜+真实操作场景 |

