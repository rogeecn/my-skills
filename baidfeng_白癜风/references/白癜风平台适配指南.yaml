| 抖音 | L5患者+L3基层 | 误区爆破+5分钟速学+日常护理 | 深度机制解读（太专业） |
| B站 | L4学习+L2临床 | 病例拆解+机制故事+操作演示 | 纯科普（缺乏深度） |
| 知乎 | L5患者+L2临床 | 问答+误区纠正+方案比较 | 短视频内容（形式不符） |
| 小红书 | L5患者 | 遮盖化妆+日常护理+心理支持 | 治疗方案选择（太专业） |
| 视频号 | L5患者+L2临床 | 实操演示+患者教育+医生IP | 纯文字科普（缺乏视觉） |

