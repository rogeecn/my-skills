## 选题公式（3种）

### 公式1: 单品类深挖型
模板: "{品类名} × {1个深度子项} × {受众类型}"
示例: "治疗方案 × JAK抑制剂选择 × 临床级"
示例: "诊断鉴别 × 花斑癣vs白癜风 × 基层级"

### 公式2: 跨品类交叉型
模板: "{品类A} × {品类B} × {1个交叉场景}"
示例: "治疗方案 × 心理干预 → 治疗信心构建话术"
示例: "诊断鉴别 × 案例分享 → 从误诊到确诊的临床思维"

### 公式3: 时令+品类型
模板: "{时令节点} × {品类} × {受众类型}"
示例: "世界白癜风日 × 心理干预 × 患者级"
示例: "EADV年会后 × 新药前沿 × 专家级"

