## 跨品类交叉组合（8组）

| 组号 | 品类A | 品类B | 交叉场景 | 创作切入角度 |
|------|-------|-------|---------|-------------|
| 1 | P3治疗方案 | P5患者教育 | 如何向患者解释治疗选择 | 从患者常见误区反推解释话术 |
| 2 | P2诊断鉴别 | P9案例分享 | 从误诊病例提炼鉴别要点 | 用真实误诊故事串联鉴别知识 |
| 3 | P6心理干预 | P5患者教育 | 心理支持的患教素材设计 | 把心理评估融入日常沟通 |
| 4 | P1病理机制 | P4新药前沿 | 机制突破→新药研发逻辑链 | 从靶点发现讲新药研发故事 |
| 5 | P8特殊人群 | P12合并症 | 儿童白癜风的甲状腺筛查 | 用系统性思维打破单一器官局限 |
| 6 | P10指南解读 | P3治疗方案 | 指南推荐方案的临床落地 | 指南说做什么→临床怎么做 |
| 7 | P7中西医结合 | P3治疗方案 | 中药+西药的联合方案设计 | 从辨证分型对应现代分型 |
| 8 | P11科普品牌 | P5患者教育 | 医生如何把专业内容做通俗 | 专业知识的降维传播技术 |

