## 品类列表与子品类

### P1 病理机制与前沿研究
子品类:
  - 黑色素细胞破坏机制
  - 自身免疫假说（CD8+T细胞攻击）
  - 氧化应激理论
  - 神经化学因子学说
  - 遗传易感性（多基因模型）
  - 新靶点发现（IL-15/IFN-γ/JAK-STAT通路）
  - 微生物组关联
  - 表观遗传调控
受众类型: [L1, L4]
时令周期: 全年，学术会议期集中（EADV/AAD/CDL年会后）

### P2 诊断与鉴别诊断
子品类:
  - 临床分型（节段型/非节段型/混合型/未定类型）
  - 分期标准（进展期/稳定期/VIDA评分）
  - Wood灯检查要点
  - 皮肤镜特征
  - 组织病理读片
  - 白癜风vs花斑癣鉴别
  - 白癜风vs白化病鉴别
  - 白癜风vs硬化萎缩性苔藓鉴别
  - 白癜风vs炎症后色素减退鉴别
  - 白癜风vs无色素痣鉴别
受众类型: [L2, L3, L4]
时令周期: 全年

