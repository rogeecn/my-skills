## 多样性规则

| 规则 | 说明 |
|------|------|
| 每5篇内容覆盖至少3个品类 | 避免单一品类过度集中 |
| 每10篇内容至少2篇跨品类交叉 | 交叉内容是差异化核心 |
| 每月至少1篇L1+1篇L3受众 | 覆盖两端受众，中间自然覆盖 |
| 季节性内容提前1周发布 | 时令内容有窗口期 |
| 禁止连续3篇同一子品类 | 防止内容疲劳 |