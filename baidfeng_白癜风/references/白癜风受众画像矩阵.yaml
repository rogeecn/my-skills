# 白癜风和相关皮肤病 — 受众画像矩阵

> 何时读取: 创作任何内容前，确定目标受众时读取
> 蒸馏来源: 百度百科/维基百科/MSD诊疗手册/丁香园/知乎等搜索数据
> 创建日期: 2026-05-15

---

## 受众类型定义

### L1 专家级（皮肤科高级职称/学科带头人）
核心特征: 学术引领者，关注前沿和共识争议
核心心态: "我要输出权威观点，引领学科方向"
品类关注度排名:
  1. 新药与前沿疗法
  2. 行业指南与共识解读
  3. 病理机制与前沿研究
  4. 合并症与全身视角
切入角度: 从争议切入、从国际对比切入、从机制突破切入
内容演变线: 深度综述→共识解读→前沿速递→争议辩论

### L2 临床级（皮肤科主治/住院医师）
核心特征: 日常诊疗一线，关注实操和方案选择
核心心态: "我要解决具体患者的具体问题"
品类关注度排名:
  1. 治疗方案与用药
  2. 诊断与鉴别诊断
  3. 案例分享与临床思维
  4. 患者教育与沟通
切入角度: 从病例切入、从方案比较切入、从剂量调整切入
内容演变线: 案例解析→方案选择→实操要点→患者沟通话术

### L3 基层级（全科/非皮肤科/基层医生）
核心特征: 偶遇白癜风，需要识别和转诊
核心心态: "我能不能确定这是白癜风？该不该转诊？"
品类关注度排名:
  1. 诊断与鉴别诊断
  2. 特殊人群管理
  3. 患者教育与沟通
  4. 行业指南与共识解读
切入角度: 从识别要点切入、从鉴别误区切入、从转诊标准切入
内容演变线: 5分钟识别→鉴别要点→转诊判断→基础患教

### L4 学习级（医学生/规培生/进修生）
核心特征: 系统学习需求，知识框架搭建
核心心态: "我要构建完整的知识体系，应对考试和临床"
品类关注度排名:
  1. 病理机制与前沿研究
  2. 诊断与鉴别诊断
  3. 治疗方案与用药
  4. 案例分享与临床思维
切入角度: 从知识框架切入、从考点切入、从经典病例切入
内容演变线: 知识框架→分型分期→治疗方案表→经典病例库

### L5 患者级（间接，医生创作的目标读者）
核心特征: 患病后焦虑迷茫，需要信心和指导
核心心态: "能治好吗？别人怎么治的？生活怎么办？"
品类关注度排名:
  1. 患者教育与沟通
  2. 心理干预与社会影响
  3. 治疗方案与用药
  4. 特殊人群管理
切入角度: 从"能治好"切入、从"真实案例"切入、从"日常护理"切入
内容演变线: 病情认知→治疗信心→日常护理→心理支持→长期管理

---

## 禁忌

| 受众 | 绝对禁忌 | 原因 |
|------|---------|------|
| 所有 | "根治""治愈承诺" | 白癜风目前无法根治，违反医疗真实性 |
| 所有 | 推荐偏方/替代正规治疗 | 违反医疗广告法和诊疗规范 |
| 患者级 | "不用治自己会好" | 白癜风一般不会自愈，误导患者 |
| 患者级 | 过度展示恶化案例不加说明 | 制造恐慌，违反正向叙事原则 |
| 基层级 | "简单照搬专科方案" | 基层条件不同，照搬可能导致用药不当 |
| 学习级 | 只讲理论不联系实际 | 纯理论脱离临床，学习级最需要案例支撑 |