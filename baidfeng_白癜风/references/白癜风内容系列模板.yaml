## 创作流程通用规则

| 规则 | 说明 |
|------|------|
| 系列编号 | 所有系列文章标注编号（如"基层速学①"） |
| 篇尾预告 | 每篇末尾预告下一篇主题 |
| 互引闭环 | 系列内文章互相引用链接 |
| 合集汇总 | 系列完成后做合集推送/PDF下载 |
| 去重检查 | 创作前检查content_history.json避免重复 |
| 时令提前 | 时令系列提前1-2周开始发布 |