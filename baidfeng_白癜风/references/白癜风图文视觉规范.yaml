# 白癜风和相关皮肤病 — 图文视觉规范

# 
# > 何时读取: 撰写小红书/知乎/微信公众号图文内容时读取
# > 创建日期: 2026-05-15
# > 与"白癜风视频导演手册.md"配合——本文件定义图文视觉风格，导演手册定义视频视觉语言
# 
# ---
# 
# 配色体系:
#   主色调: 医学蓝(#2B6CB0)
#   辅助色调77种:
#     - 浅蓝(#E8F4FD): 诊室/科普专业感背景色
#     - 浅灰(#F5F5F5): 白板讲解冷静学术感背景色
#     - 暖蓝(#4299E1): 患教/心理支持温暖感辅助色
#     - 暖绿(#48BB78): 证据等级A标注色
#     - 暖黄(#ECC94B): 证据等级C标注色
#     - 灰蓝(#718096): 中性信息/对比呈现色
#     - 浅灰(#A0AEC0): 辅助文字/分隔线色
#     - 白(#FFFFFF): 高亮文字/数据标注色
#     - 深灰(#1A202C): 正文文字色
# 
# 字体体系:
#   主字体: 思源黑体(Noto Sans SCJK)
#   粗细层级:
#     - Bold 700: 标题/封面标题/数据卡片标题
#     - Medium 500: 正文/数据内容/清单内容
#     - Light 300: 来源标注/合规声明/辅助说明
#   字号规范:
#     - 小红书正文: Medium 500 (适配500字限制)
#     - 知乎正文: Medium 400-500 (适配500-1500字)
#     - 微信公众号正文: Medium 500 (适配1500-3000字)
#     - 数据标注: Medium 600 (数据卡片内字号略大)
#     - 封面标题: Bold 700-900 (封面最醒目)
#   禁止:
#     - Bold 900做正文(过粗阅读疲劳)
#     - Light 300做小红书正文(过小阅读费力)
# 
# 图标体系:
#   风格: 圆角矩形(8px圆角)+1px描边扁平风格
#   填充: 无填充或1px描边
#   阴影: 无阴影/扁平风格
#   禁止: 有阴影(过时感重)/立体感(增加心理负担)
#   12个品类方向图标:
#     - 色素脱失(皮损图标)
#     - 免疫攻击(T细胞图标)
#     - 甲状腺(甲状腺图标)
#     - 遮盖化妆(化妆图标)
#     - 心理支持(心形图标)
#     - 治疗方案(药片图标)
#     - 科普传播(麦克风图标)
#     - 安全注意(盾牌图标)
#     - 中医结合(太极图标)
#     - 时间节点(时钟图标)
#     - 随访复诊(日历图标)
#     - 评估检查(放大镜图标)
# 
# ---
# 
# 信息层次体系:
# 
# 封面层(最先看到的信息):
#   功能: 封面决定读者是否继续阅读——3秒内传达"这是什么+我能得到什么"
#   小红书封面结构:
#     - 封面图尺寸: 1080x1440(3:4竖版)
#     - 封面图内容: 品类内容图(40%)+标题文字(40%)+品类标签(15%)+互动引导区(5%)
#     - 封面图布局: 上1/3(标题居中偏上)
#     - 封面标题: <=15字(核心结论放封面)
#     - 封面禁止: 纯文字封面(无视觉元素)/过度恶化皮损照片/花哨渐变背景
#   知乎封面结构:
#     - 封面图尺寸: 1920x1080(横版)
#     - 封面图内容: 品类内容图(35%)+标题文字(45%)+来源标注(10%)+互动引导(10%)
#     - 封面需要体现专业权威感(数据来源/证据等级标注)
#   微信公众号封面结构:
#     - 封面图尺寸: 900x383(横版推荐)或1:1正方形
#     - 封面图内容: 品类内容图(30%)+标题文字(50%)+来源标注(10%)+互动引导(10%)
#     - 封面需要体现专业深度(数据表/对比图/流程图)
# 
# 内容层(核心信息区):
#   功能: 降低阅读门槛——文字配图片理解
#   内容图占比: 正文30%+内容图60%+标签5%+来源标注5%
#   内容图设计规则:
#     - 每张内容图承载1个核心信息点(不超过350字+1个数据/1个要点)
#     - 内容图下方配文字说明(不超过100字)
#     - 内容图与内容图之间用文字过渡连接(自然引导视线)
#     - 数据卡片: 医学蓝底(#2B6CB0)+白字+来源标注小字灰(#888888)
#     - 对比表格: 左蓝(#2B6CB0)右灰(#718096)分栏+白字
#     - 流程图: 蓝色方框(#2B6CB0)+灰箭头(#718096)+浅蓝线条(#E8F4FD)
#     - 要点清单: 圆角卡片+医学蓝系列+图标体系
#   内容图标注规则:
#     - 来源标注: 每个数据旁标注来源(基础知识库/药物管线/指南对比)
#     - 证据等级标注: A级绿(#48BB78)/B级蓝(#2B6CB0)/C级黄(#ECC94B)/D级灰(#718096)
# 
# 尾层(辅助信息区):
#   功能: CTA+互动引导+品牌强化
#   小红书尾图:
#     - 合规声明: "仅供科普参考，不构成医疗建议"+灰色小字Light300
#     - 互动引导: "收藏起来备用"/"评论区分享你的经验"
#     - 相关推荐: 链接1-2篇账号其他相关文章
#     - 标签: 3-5个(品类+受众+平台+互动)
#   知乎尾图:
#     - 合规声明: "本文仅为科普，不构成医疗建议"+灰色小字Light300
#     - 互动引导: "觉得有帮助请点赞支持"+评论引导
#     - 相关推荐: 1-2篇知乎相关问题链接
#   微信公众号尾图:
#     - 合规声明: "本文仅为科普，不构成医疗建议"+灰色小字Light300
#     - 互动引导: "留言告诉我你的看法"+分享引导"转发给需要的人"
#     - 相关推荐: 2-3篇公众号其他相关文章(互引形成阅读闭环)
# 
# 尾图设计规则:
#   - 合规声明: 标准措辞+灰色小字Light300(降低视觉干扰+保留专业底线)
#   - 互动引导: 适配平台特性(小红书收藏/知乎点赞/公众号分享)
#   - 相关推荐: 不超过3篇互引(形成阅读闭环+不过度堆砌)
#   - 尾图禁止: 纯文字结尾(无视觉识别)/过度CTA堆砌/灰色大段合规声明(阅读负担)
# 
# ---
# 
# 品类方向适配:
#   - P5患者教育: 小红书首选(生活化+视觉化方向)
#   - P6心理干预: 小红书首选(遮盖化妆+心理支持方向)
#   - P12合并症: 小红书首选(日常护理+甲状腺筛查方向)
#   - P3治疗方案: 知乎首选(方案对比+数据方向)
#   - P9患者沟通: 知乎首选(话术模板+沟通策略方向)
#   - P9案例分享: B站/微信公众号首选(病例拆解+诊疗路径方向)
#   - P10指南解读: 微信公众号首选(共识解读+临床落地方向)
#   - P4新药前沿: 微信公众号/B站首选(前沿速递+数据解读方向)
#   - P1病理机制: B站首选(深度机制讲解方向)
# 
# ---
# 
# 小红书笔记结构模板:
#   模块1_封面(最先看到):
#     - 尺寸: 1080x1440(3:4竖版)
#     - 主视觉: 1张封面图+标题文字+品类标签
#     - 封面标题: <=15字
#     - 品类标签: 1个品类方向标签
#     - 互动引导: 1行行动引导("收藏起来备用")
#   模块2_引入(建立问题):
#     - 1张引入图+引入文字(<=50字)
#     - 引入文字风格: 生活化/对话式/不学术化
#     - 引入图功能: 建立共鸣("我也遇到过这个问题")
#   模块3_正文核心(解决问题):
#     - 3-5张内容图+正文文字(图文穿插)
#     - 每张内容图承载1个核心信息点
#     - 正文文字总量: 500字
#     - 内容图占比: 正文30%+内容图60%+标签5%
#     - 内容图排版: 圆角矩形卡片式+医学蓝系列配色+图标体系
#     - 内容图标注: 来源+证据等级
#     - 正文穿插: 信息点→内容图→文字解释→下一个信息点(自然过渡)
#   模块4_尾图(CTA+互动):
#     - 合规声明: "仅供科普参考，不构成医疗建议"
#     - 互动引导: "收藏起来备用"/"评论区分享你的经验"
#     - 相关推荐: 1-2篇账号其他相关文章
#     - 标签: 3-5个(品类+受众+平台+互动)
# 
# 知乎问答结构模板:
#   模块1_问题定义:
#     - 标题: 问答型标题
#     - 引入: 1段引入(问题背景+常见误解)
#     - 引入文字风格: 清晰/理性/不生活化
#     - 引入功能: 定义问题("我想知道什么")
#   模块2_核心回答:
#     - 2-3张对比图/流程图+正文文字
#     - 对比图承载鉴别要点/方案对比
#     - 正文文字总量: 500-1500字
#     - 对比图占比: 正文40%+对比图50%+来源标注10%
#     - 对比图标注: 来源+证据等级
#     - 对比图排版: 左蓝右灰分栏+医学蓝线条流程图
#     - 正文穿插: 对比表→文字解释→下一个要点(自然过渡)
#   模块3_实操建议:
#     - 1张清单卡+建议文字(100-200字)
#     - 清单卡: 圆角矩形+医学蓝底+图标体系
#     - 清单卡每条配对应图标
#   模块4_尾图:
#     - 合规声明: "本文仅为科普,不构成医疗建议"
#     - 互动引导: "觉得有帮助请点赞支持"+评论引导
#     - 相关推荐: 1-2篇知乎相关问题链接
# 
# 微信公众号长文结构模板:
#   模块1_引入(建立阅读动机):
#     - 1段引入文字(150-200字)
#     - 引入文字风格: 专业感为主/不生活化
#     - 引入功能: 建立问题紧迫感
#     - 引入方式: 数据冲击型/争议引入型/时令锚定型
#   模块2_核心知识(主体内容):
#     - 3-5张内容图+正文文字(穿插展开)
#     - 每张内容图承载1个核心论点
#     - 正文文字总量: 1500-3000字
#     - 内容图占比: 正文40%+内容图50%+来源标注10%
#     - 内容图标注: 来源+证据等级
#     - 正文穿插: 论点→内容图→文字展开→下一个论点(自然过渡)
#   模块3_实操转化(可行动建议):
#     - 1-2张实操图+清单文字(300-500字)
#     - 实操图: 圆角矩形+医学蓝底+清单图标
#     - 实操图标注: "操作步骤示意/非真实操作照片"
#   模块4_拓展深化(进阶视角):
#     - 1段拓展文字(100-150字)
#     - 拓展文字风格: 专业前瞻/不生活化
#     - 拓展方式: 共病拓展/前沿拓展/系统拓展
#   模块5_正向收束(安心结尾):
#     - 1段收束文字(100-150字)
#     - 收束文字风格: 正向赋能/不学术化
#     - 收束方式: 希望重建型/行动指引型/安心承诺型
#   模块6_尾图(CTA+互动+合规):
#     - 合规声明: "本文仅为科普,不构成医疗建议"
#     - 互动引导: "留言告诉我你的看法"+分享引导"转发给需要的人"
#     - 相关推荐: 2-3篇公众号其他相关文章(互引闭环)
# 
# ---
# 
# 图文内容排版规则:
# 
# 通用规则:
#   - 正文段落间必须1张内容图(纯文字超过200字无图=阅读疲劳)
#   - 每张内容图承载<=1个核心信息点(1图=1论点=信息密度可控)
#   - 内容图下方配文字说明(不超过150字/辅助理解+不抢注意力)
#   - 数据/对比/流程/要点必须卡片式排版(信息密度可控+专业感强)
#   - 数据/对比需要标注来源+证据等级(专业感核心)
#   - 流程图节点文字<=20字/节点(流程图信息密度可控)
#   - 要点清单使用圆角卡片+图标(品牌一致+专业感强)
#   - 所有图片标注来源出处(专业感底线)
#   - 小红书图片禁止医学过度化图表(受众不需要学术图)
#   - 正文行间距1.5-1.8倍字号(移动端阅读舒适)
#   - 强调文字使用加粗而非颜色变化(加粗=专业感/颜色=花哨感)
#   - 合规声明使用灰色小字固定措辞(降低干扰+保留底线)
# 
# 小红书专用规则:
#   - 正文必须生活化口语化(小红书受众不接受学术化表达)
#   - 内容图必须视觉化生活化(小红书偏好视觉内容而非学术图表)
#   - 封面使用遮盖后对比图(小红书封面生活化方向)
#   - 标题<=15字(小红书标题极短)
#   - 正文不超过500字(小红书图文内容限制)
#   - 禁止使用医学专业图学术图(小红书受众不需要)
#   - 互动引导使用"收藏起来备用"(小红书用户习惯收藏行为)
#   - 标签包含1个品类方向标签(品类标签=内容定位)
# 
# 知乎专用规则:
#   - 正文需要标注证据等级(知乎受众重视证据质量)
#   - 对比表格需要左右分栏+明确(对比表=知乎常见形式)
#   - 流程图节点文字<=5字(知乎流程图简化呈现)
#   - 正文500-1500字(知乎内容限制较宽)
#   - 互动引导使用"点赞支持"(知乎用户习惯点赞行为)
#   - 专栏文章需要系统性框架(知乎专栏=系列化内容形式)
# 
# 微信公众号专用规则:
#   - 正文1500-3000字(公众号长文=深度内容空间)
#   - 数据表必须全屏呈现(公众号数据表=重要论据形式)
#   - 流程图使用医学蓝线条+专业配色(公众号流程图=专业内容形式)
#   - 正文首段缩进2字符(公众号=传统排版规范)
#   - 合规声明使用标准措辞(公众号合规声明=专业底线)
#   - 互动引导"留言+分享+相关推荐"(公众号=三重互动引导)
# 
# ---
# 
# 图片处理标准:
# 
# 禁止使用:
#   - 真实患者患处照片(隐私保护+制造恐慌→使用示意图替代+标注"示意图")
#   - 过度恶化皮损图片(制造恐慌+违反正向叙事→使用遮盖后对比图/复色进度示意图)
#   - 真实检查报告病历(隐私保护+商业推广嫌疑→使用示意材料+标注"示意材料")
#   - 药盒品牌名清晰露出(商业推广嫌疑→模糊处理/使用通用名称)
#   - 真实手术照片(隐私保护+制造恐慌→使用示意图替代)
#   - 无来源数据图表(专业感缺失->标注来源出处)
#   - 低质量截图模糊图片(专业感缺失->使用高清图片或示意图)
# 
# 必须使用:
#   - 病理机制示意图(简洁线条+圆角方框+箭头+医学蓝配色→标注"示意图")
#   - 诊疗流程图(节点<=5字+箭头+医学蓝线条→标注"示意图")
#   - 数据对比卡片(医学蓝底+白字+来源标注+圆角矩形→标注来源+证据等级)
#   - 鉴别诊断对比表(左蓝右灰分栏+对比要点表格→标注"示意图")
#   - 复色进度示意图(简洁渐变+时间节点标注→标注"示意图")
#   - 遮盖化妆对比图(遮盖前vs遮盖后对比→标注"遮盖效果示意")
#   - 甲状腺筛查流程图(节点+箭头+筛查指标标注→标注"示意图")
#   - 用药安全清单(圆角卡片+图标+安全底线→标注"示意图")
# 
# 图片质量标准:
#   - 分辨率: >=1080px(适配高清显示)
#   - 格式: JPG/PNG(不使用GIF避免分散注意力)
#   - 色彩模式: RGB(不使用CMYK避免移动端显示偏差)
#   - 文件大小: 单图<=500KB(控制加载速度)
#   - 水印: 无水印或仅账号名(小水印降低专业感/仅账号名增加识别)
# 
# ---
# 
# 标签系统规范:
# 
# 小红书标签(4个/每篇笔记):
#   - 品类方向标签(1个): #白癜风日常护理 #白癜风遮盖化妆 #白癜风甲状腺
#   - 受众关键词(1个): #白癜风患者 #面部白癜风
#   - 平台关键词(1个): #小红书白癜风
#   - 互动引导标签(1个): #收藏起来备用
#   标签格式规则:
#     - 每个标签<=10字
#     - 使用#号分隔
#     - 品类方向标签放在最前(内容定位)
#     - 禁止使用#白癜风治疗#白癜风根治#等违规标签
# 
# 知乎标签: 不使用标签系统(知乎标签对搜索权重影响低)
# 微信公众号标签: 不使用标签系统(公众号标签对搜索权重影响低)
# 
# ---
# 
# 合规声明模板:
# 
#   - 小红书: "仅供科普参考，不构成医疗建议"
#   - 知乎: "本文仅为科普，不构成医疗建议"
#   - 微信公众号: "本文仅为科普，不构成医疗建议"
#   - 位置: 尾图最后一行
#   - 字号: Light300灰色
