# 
# 图文内容创作流程:
# 
# Step1_选题与定位:
#   - 读取赛道定义.md→确定品类方向
#   - 读取受众画像矩阵.yaml→选择目标受众层级
#   - 读取内容品类交叉矩阵.yaml→确定品类×受众交叉组合
#   - 读取长尾关键词总表.yaml→嵌入SEO关键词
#   - 读取平台适配指南.yaml→选择发布平台
# 
# Step2_标题设计:
#   - 读取标题公式库.yaml→选择标题公式+情感触发词
#   - 根据平台选择标题长度(小红书<=15字/知乎问答型/微信公众号专业标题)
#   - 组合标题公式+触发词+品类关键词+受众关键词
# 
# Step3_封面设计:
#   - 参照封面层次体系设计封面
#   - 使用统一配色体系(医学蓝系列)
#   - 使用统一图标体系(品类方向图标)
#   - 参照各平台封面尺寸标准
# 
# Step4_正文撰写:
#   - 根据平台选择结构模板(小红书笔记/知乎问答/微信公众号长文)
#   - 按模板逐模块填写内容
#   - 每个信息点配1张内容图(卡片式排版)
#   - 内容图标注来源+证据等级
#   - 正文穿插自然过渡
# 
# Step5_尾图与合规:
#   - 添加合规声明(标准措辞+灰色小字)
#   - 添加互动引导(适配平台特性)
#   - 添加相关推荐(不超过3篇互引)
# 
# Step6_去重检查:
#   - 读取白癜风去重机制.yaml+检查近30篇记录避免重复
#   - 检查品类/受众/标题是否与近30篇重叠
# 
# Step7_发布后追踪:
#   - 追加记录到content_history.json
#   - 追踪发布后7天互动数据
#   - 根据互动数据调整后续选题方向