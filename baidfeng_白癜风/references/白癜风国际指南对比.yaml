# ============================================================
# 1. 指南/共识列表
# ============================================================

guidelines:
  中国共识2024:
    名称: "白癜风诊疗共识（2024版）"
    英文名: "Consensus on the diagnosis and treatment of vitiligo (2024 version)"
    发布机构:
      - 中国中西医结合学会皮肤性病专业委员会色素病学组
      - 中华医学会皮肤性病学分会白癜风研究中心
      - 中国医师协会皮肤科医师分会色素病专委会
    发布年份: 2024
    发布月份: 12
    期刊: "中华皮肤科杂志, 2024, 57(12): 1065-1070"
    DOI: "10.35541/cjd.20240260"
    通讯作者: "许爱娥"
    类别: "专家共识"
    核心推荐要点:
      - "突出早期干预理念——尽早抑制黑素细胞不可逆损伤"
      - "强调综合治疗——外用药+光疗+系统用药联合策略"
      - "首次纳入JAK抑制剂应用指导（外用芦可替尼乳膏）"
      - "分型分期细化：非节段型/节段型/混合型/未定类型"
      - "活动度评估工具：VIDA评分、Wood灯、皮肤镜、RCM"
      - "面积评估推荐VASI、VES、VESTA等工具"
      - "特殊人群治疗单独章节（儿童、孕妇等）"
    关键词: [白癜风, 诊断, 治疗, 光疗法, 早期干预, JAK抑制剂, 专家共识]
    版本演进: "2014→2018→2021→2024，每版约3年更新周期"

  中国共识2021:
    名称: "白癜风诊疗共识（2021版）"
    发布机构:
      - 中国中西医结合学会皮肤性病专业委员会色素病学组
      - 中华医学会皮肤性病学分会
      - 中国医师协会皮肤科医师分会色素病专委会
    发布年份: 2021
    期刊: "中华皮肤科杂志, 2021, 54(2): 105-109"
    DOI: "10.35541/cjd.20200785"
    类别: "专家共识"
    核心要点:
      - "分型分期分级体系建立"
      - "外用激素和钙调磷酸酶抑制剂推荐"
      - "NB-UVB光疗为首选光疗方案"
      - "未包含JAK抑制剂（当时无循证证据）"
    与2024版差异: "2021版无JAK抑制剂内容，无早期干预强调，分型较简"

  中国共识2018:
    名称: "白癜风诊疗共识（2018版）"
    发布机构: "中国中西医结合学会皮肤性病专业委员会色素病学组"
    发布年份: 2018
    期刊: "中华皮肤科杂志"
    类别: "专家共识"
    核心要点:
      - "基础分型分期框架"
      - "传统治疗为主（激素、光疗、外科移植）"

  中国共识2014:
    名称: "白癜风诊疗共识(2014版)"
    发布机构: "中国中西医结合学会皮肤性病专业委员会色素病学组"
    发布年份: 2014
    类别: "专家共识"
    核心要点:
      - "首个中国白癜风共识，建立诊断与治疗基本框架"

  芦可替尼乳膏共识2025:
    名称: "芦可替尼乳膏治疗白癜风医药专家共识"
    发布机构: "广东省药学会"
    发布年份: 2025
    发布月份: 9
    类别: "医药专家共识"
    核心推荐要点:
      - "1级推荐(3条)：芦可替尼乳膏用于≥12岁非节段型白癜风；BSA≤10%时应用；至少连续3个月"
      - "2级推荐(2条)：联合光疗可提高复色效果；面部皮损优先推荐"
      - "GRADE分级系统评估证据等级"
      - "药代动力学：外用生物利用度6.2%±7.7%，系统暴露极低"
      - "TRuE-V1/V2三期试验数据：24周F-VASI75达标率约30%"
      - "机制：IFN-γ-JAK-STAT轴，芦可替尼JAK1/2选择性抑制"
      - "港澳药械通政策背景下中国临床经验积累"
    差异点标注: "中国首个针对单一药物的白癜风共识，填补了2024版共识对芦可替尼细节的不足"

  儿童白癜风共识2025:
    名称: "儿童白癜风诊疗专家共识"
    发布机构: "中国妇幼保健协会儿童变态反应专业委员会儿童皮肤病学组"
    发布年份: 2025
    期刊: "中国实用儿科杂志, 2025, 40(4): 284-292"
    类别: "专家共识"
    核心推荐要点:
      - "儿童白癜风患病率0-2.16%，占全部患者32-40%"
      - "发病年龄4-8岁为主"
      - "<2岁：中效激素隔日外用；≥2岁：中强效/强效激素"
      - "面颈部首选钙调磷酸酶抑制剂(他克莫司/吡美莫司)"
      - "≥12岁可外用1.5%芦可替尼乳膏(BSA≤10%)"
      - "主动维持治疗：复色后每周2次，持续6-12个月"
      - "分型：节段型儿童比例高于成人，疗效差"
      - "心理评估纳入常规，建议QOL评分"
      - "不建议禁食含维生素C的蔬果"
    差异点标注: "国内外首个儿童白癜风独立共识，填补了成人共识对儿童细节的空白"

  国际VitiligoTaskForce2023:
    名称: "International Vitiligo Task Force Position Statement Part 2: Specific Treatment Recommendations"
    英文名: "Worldwide expert recommendations for the diagnosis and management of vitiligo - Part 2"
    发布机构: "International Vitiligo Task Force (VTF)"
    发布年份: 2023
    期刊: "J Eur Acad Dermatol Venereol, 37(11): 2185-2195"
    DOI: "10.1111/jdv.19450"
    通讯作者: "Seneschal J, Speeckaert R, Taïeb A等"
    类别: "国际专家立场声明"
    核心推荐要点:
      - "全球多国专家共识，涵盖诊断与治疗两部分"
      - "Part 1: 诊断与评估(2023年同期发布)"
      - "Part 2: 治疗推荐——分级推荐系统"
      - "推荐NB-UVB为一线光疗"
      - "外用激素为局限型一线"
      - "JAK抑制剂纳入推荐（芦可替尼乳膏）"
      - "外科治疗限于稳定期"
      - "强调心理干预的重要性"
    差异点标注: "国际最权威的白癜风治疗推荐，中国2024版共识大量参考此文献"

  AAD_VWG_NBUVB2017:
    名称: "Vitiligo Working Group Recommendations for NB-UVB Phototherapy Treatment of Vitiligo"
    发布机构: "Vitiligo Working Group (与AAD关联)"
    发布年份: 2017
    期刊: "J Am Acad Dermatol, 76(5): 879-888"
    DOI: "10.1016/j.jaad.2016.12.041"
    通讯作者: "Mohammad TF, Hamzavi IH等"
    类别: "专家推荐"
    核心要点:
      - "NB-UVB光疗方案标准化"
      - "剂量递增方案详细规定"
      - "治疗频率和时长推荐"

  加拿大共识2025:
    名称: "Canadian Consensus Guidelines: Management of Vitiligo (2025)"
    发布机构: "加拿大皮肤科专家组"
    发布年份: 2025
    类别: "共识指南"
    核心要点:
      - "2025年新发布，细节待进一步获取"
    差异点标注: "北美视角，可能侧重JAK抑制剂和生物制剂"

  日本JDA指南2025:
    名称: "JDA Guidelines: Treatment of Vitiligo Vulgaris (2025)"
    英文名: "Japanese Dermatological Association Guidelines for treatment of vitiligo vulgaris"
    发布机构: "日本皮肤病协会(JDA)"
    发布年份: 2025
    类别: "协会指南"
    核心要点:
      - "寻常型白癜风治疗指南"
      - "亚太地区代表性指南"
    差异点标注: "可能包含亚洲肤色特点(Fitzpatrick III-IV)的特有推荐"

  EADV指南:
    名称: "European Academy of Dermatology and Venereology Guidelines on Vitiligo"
    发布机构: "欧洲皮肤性病学学会(EADV)"
    发布年份: "待确认(最新版本约2023-2024)"
    类别: "学会指南"
    核心要点:
      - "欧洲视角的白癜风管理指南"
    备注: "VTF 2023 Position Statement可视为EADV相关国际版"

  AAD儿科推荐2024:
    名称: "Expert Recommendations on Use of Topical Therapeutics for Vitiligo in Pediatric, Adolescent, and Young Adult Patients"
    发布机构: "美国皮肤科专家组(JAMA Dermatol发表)"
    发布年份: 2024
    期刊: "JAMA Dermatol, 160(4): 453-461"
    DOI: "10.1001/jamadermatol.2024.0021"
    通讯作者: "Renert-Yuval Y, Ezzedine K, Grimes P等"
    类别: "专家推荐"
    核心要点:
      - "聚焦儿童青少年外用治疗"
      - "芦可替尼乳膏≥12岁推荐"
      - "钙调磷酸酶抑制剂在面颈部推荐"
    差异点标注: "中国儿童共识2025大量参考此文"

# ============================================================
# 2. 各指南关键差异点对比
# ============================================================

differences:
  诊断分型:
    中国2024: "非节段型/节段型/混合型/未定类型四分法"
    VTF_2023: "类似四分法，增加未定类型细分说明"
    JDA_2025: "寻常型白癜风(vitiligo vulgaris)为独立分类术语"
    差异说明: "分型框架基本一致，术语差异(如'寻常型'vs'非节段型')"

  早期干预:
    中国2024: "2024版首次突出强调，为核心更新点"
    VTF_2023: "提及但非核心主题"
    AAD_2024儿科: "强烈推荐儿童早期干预"
    差异说明: "中国2024版在早期干预上最激进，与既往保守态度形成对比"

  JAK抑制剂:
    中国2024: "纳入JAK抑制剂应用指导，但芦可替尼乳膏当时中国未正式获批"
    芦可替尼共识2025: "1级推荐≥12岁非节段型，BSA≤10%，3个月起步"
    VTF_2023: "纳入推荐，但证据等级标注偏保守"
    AAD儿科2024: "≥12岁推荐1.5%芦可替尼乳膏"
    加拿大2025: "纳入(待确认细节)"
    差异说明: "中国2024版纳入时药物尚未在华获批→2025年药械通落地→共识填补应用细节"

  外用激素:
    中国2024: "中强效/强效激素为非面部一线，周期性间歇疗法"
    AAD儿科2024: "儿童<2岁中效隔日，≥2岁中强效"
    VTF_2023: "局限型一线外用激素"
    差异说明: "各指南均推荐激素为一线，但强度选择和周期方案细节不同"

  钙调磷酸酶抑制剂:
    中国2024: "面颈部/褶皱部首选，2岁以下可用(有中国RCT)"
    AAD儿科2024: "面颈部推荐他克莫司/吡美莫司"
    VTF_2023: "面颈部一线替代激素"
    差异说明: "中国共识有<2岁婴幼儿他克莫司RCT数据(Hu 2019)，国际指南引用较少"

  光疗方案:
    中国2024: "NB-UVB首选，308nm准分子激光/光为局限性优选"
    VWG_2017: "NB-UVB详细剂量递增方案标准化"
    JDA_2025: "可能有亚洲肤质光疗参数调整"
    差异说明: "光疗方案各指南框架一致，具体剂量和频率有细微差异"

  外科治疗:
    中国2024: "稳定期方可考虑，自体非培养黑素细胞-角质形成细胞移植(2283例经验)"
    VTF_2023: "稳定期推荐，技术选择灵活"
    差异说明: "中国外科移植有大量本土数据(Zhang 2021, 2283例)，国际引用较少"

  维持治疗:
    中国2024: "复色后需维持治疗防复发"
    儿童共识2025: "主动维持：每周2次TCI持续6-12月"
    AAD儿科2024: "强调维持治疗重要性"
    VTF_2023: "提及维持但细节较少"
    差异说明: "中国共识对维持治疗方案最具体(频率、时长、药物选择)"

  中医药:
    中国2024: "中西医结合学会主导，含中医药内容"
    所有国际指南: "不涉及中医药"
    差异说明: "中医药是中国共识独有内容，国际指南完全无此维度"

# ============================================================
# 3. 指南版本变迁要点
# ============================================================

version_evolution:
  中国共识演进:
    2014版:
      定位: "奠基版——建立诊断治疗基本框架"
      核心内容: "分型分期初步方案、传统治疗为主"
      不足: "循证证据少，推荐偏经验性"
    2018版:
      定位: "扩充版——细化治疗方案，增加光疗和外科"
      新增: "308nm准分子激光、外科移植内容"
      不足: "仍无JAK抑制剂，活动度评估工具不足"
    2021版:
      定位: "成熟版——分型分期分级体系完善"
      新增: "VIDA评分、VASI评估工具、分期标准细化"
      不足: "无JAK抑制剂，无早期干预理念"
    2024版:
      定位: "突破版——三大核心更新"
      关键更新:
        - "早期干预理念首次强调"
        - "JAK抑制剂应用指导首次纳入"
        - "综合治疗策略体系化"
      引用文献: 31篇，其中国际文献占多数
      新增参考文献亮点:
        - "VTF 2023 Position Statement(参考文献26)"
        - "AAD儿科外用治疗推荐2024(参考文献11)"
        - "芦可替尼ritlecitinib/upadacitinib研究(参考文献20-22)"
        - "IL-15抗体阻断研究(参考文献31)——未来方向线索"
      待改进: "芦可替尼乳膏中国未正式获批时纳入→实际应用受限"

  国际演进趋势:
    2017: "VWG发布NB-UVB光疗标准化推荐(AAD)"
    2023: "VTF发布全球诊断+治疗Position Statement——国际里程碑"
    2024: "AAD/JAMA Dermatol发布儿科外用治疗推荐"
    2025: "加拿大共识+JDA指南+芦可替尼乳膏中国专家共识→JAK抑制剂全面落地"

# ============================================================
# 4. 共识争议点
# ============================================================

controversies:
  JAK抑制剂适用年龄:
    争议: "芦可替尼乳膏≥12岁获FDA批准，但<12岁疗效安全性未证实"
    中国立场: "≥12岁推荐(BSA≤10%)，<12岁不推荐"
    国际立场: "AAD 2024儿科推荐同样限≥12岁"
    未解决: "6-11岁儿童JAK抑制剂需求迫切但无循证数据"

  芦可替尼乳膏BSA限制:
    争议: "BSA≤10%为推荐使用范围，但泛发型患者(BSA>10%)需求大"
    中国立场: "BSA≤10%为1级推荐条件"
    临床现实: "泛发型患者BSA常>10%，超出推荐范围仍被使用"
    未解决: "大面积使用时系统暴露安全性数据不足"

  激素使用强度与周期:
    争议: "儿童激素强度选择(中效vs强效)和周期方案各指南表述不一"
    中国: "<2岁中效隔日；≥2岁中强效/强效"
    AAD儿科: "类似但具体强度等级表述有差异"
    未解决: "长期间歇激素对儿童生长影响的精确数据不足"

  稳定期定义:
    争议: "12个月无新发白斑vs6个月vs更短——稳定期判定时间窗口"
    中国2024: "12个月无变化为稳定"
    VTF_2023: "类似12个月标准"
    临床现实: "部分患者6个月即被认为稳定，外科提前介入"
    未解决: "稳定期判定是否需要影像学确认(Wood灯/RCM)"

  早期干预时间窗:
    争议: "多早算'早期'？发病1个月内？3个月内？"
    中国2024: "强调早期干预但未精确定义时间窗"
    AAD儿科: "儿童发病后尽快干预"
    未解决: "缺乏'早期干预时间窗'的精确循证定义"

  儿童节段型治疗策略:
    争议: "节段型儿童比例高于成人且疗效差，治疗方案是否应不同"
    中国儿童共识2025: "节段型疗效差有标注但未给出差异化方案"
    未解决: "节段型是否需要独立的阶梯治疗方案"

  维生素C忌口:
    争议: "民间流传白癜风忌食维生素C，但无循证支持"
    中国儿童共识2025: "明确不建议禁食含维生素C蔬果"
    中国2024共识: "营养均衡建议"
    临床现实: "大量患者仍在忌口维生素C"
    争议本质: "民间认知vs指南推荐的显著冲突"

  光疗联合JAK抑制剂:
    争议: "光疗+芦可替尼乳膏联合是否优于单用"
    芦可替尼共识2025: "2级推荐(有条件推荐)联合光疗"
    系统综述(Phan 2022): "联合复色率高于单用"
    未解决: "最佳联合方案(光疗频率、药物顺序)尚缺标准化"

# ============================================================
# 5. 指南未覆盖的灰色地带
# ============================================================

gray_zones:
  婴幼儿(<2岁)白癜风:
    问题: "2岁以下白癜风治疗证据极少"
    中国: "仅有他克莫司小样本RCT(Hu 2019, <2岁)，无JAK抑制剂数据"
    国际: "几乎无<2岁系统性研究"
    创作角度: "婴幼儿白癜风的诊疗困境——证据真空区"

  6-11岁儿童JAK抑制剂:
    问题: "6-11岁非节段型白癜风患者无JAK抑制剂循证数据"
    中国: "芦可替尼乳膏限≥12岁"
    国际: "同样限≥12岁"
    创作角度: "6-11岁'夹心层'——药物可及性断层"

  泛发型(BSA>10%)JAK抑制剂:
    问题: "芦可替尼乳膏推荐BSA≤10%，大面积使用安全性数据不足"
    创作角度: "面积限制下的选择困境——10%之外怎么办"

  节段型白癜风系统方案:
    问题: "节段型占儿童比例高、疗效差，但无独立阶梯方案"
    所有指南: "节段型提及但治疗推荐与非节段型混在一起"
    创作角度: "节段型——被忽视的'另一半'"

  孕期白癜风治疗:
    问题: "孕期白癜风治疗选择极度有限"
    中国2024: "有提及但细节不足"
    Chi 2016(JAMA Dermatol): "孕期外用激素安全性数据(参考文献29)"
    创作角度: "孕期白癜风——安全与疗效的两难"

  合并症交叉管理:
    问题: "白癜风合并甲状腺疾病/斑秃/特应性皮炎的交叉治疗策略"
    各指南: "提及筛查但无交叉用药方案"
    创作角度: "白癜风不只是皮肤问题——合并症管理盲区"

  复色维持的长期策略:
    问题: "复色后如何长期维持，停药复发率数据缺乏"
    中国: "提及主动维持(每周2次TCI 6-12月)"
    国际: "维持策略细节模糊"
    创作角度: "复色不是终点——维持治疗的数据真空"

  亚洲肤色(Fitzpatrick III-IV)特异性:
    问题: "多数临床试验以白人为主(>80%)，亚洲肤质数据不足"
    JDA指南: "可能有亚洲数据"
    中国共识: "有中国人群数据但数量有限"
    创作角度: "白人数据主导下的亚洲皮肤——证据偏差问题"

  IL-15抗体/新型生物制剂:
    问题: "IL-15抗体(Richmond 2018)等前沿治疗尚未进入任何指南"
    中国2024: "在'未来研究方向'中提及"
    创作角度: "下一个JAK？IL-15抗体从实验室到指南的距离"

  精神心理干预标准化:
    问题: "心理干预重要性各指南均提及但无标准化方案"
    中国: "建议心理评估和QOL评分"
    VTF: "强调心理干预重要性"
    创作角度: "白癜风的心理维度——指南说'重要'但没说'怎么做'"

# ============================================================
# 6. 临床实践vs指南差距
# ============================================================

practice_vs_guidelines:
  JAK抑制剂可及性:
    指南推荐: "≥12岁非节段型可外用芦可替尼乳膏"
    临床现实: "中国2025年3月才通过港澳药械通部分落地，正式获批尚未完成"
    差距: "指南已推荐但药物不可及→患者通过博鳌乐城/药械通渠道获取"
    创作角度: "指南走在前面，药还在路上"

  早期干预执行:
    指南推荐: "尽早干预"
    临床现实: "多数患者首次就诊已在发病6个月以上，早期干预窗口已过"
    差距: "患者认知延迟导致错过早期干预"
    创作角度: "早期干预——指南说了，但患者来晚了"

  激素恐惧:
    指南推荐: "外用激素为一线，周期间歇疗法安全"
    临床现实: "大量患者/家长拒绝激素，担心副作用"
    差距: "患者认知与指南推荐严重偏离"
    创作角度: "激素恐惧——最有效的一线药，最被拒绝的方案"

  光疗可及性:
    指南推荐: "NB-UVB/308nm为标准光疗"
    临床现实: "基层医院光疗设备不足，家用光疗仪质量参差"
    差距: "指南推荐的光疗方案在基层难以执行"
    创作角度: "光疗——指南标配，基层奢侈品"

  维持治疗依从性:
    指南推荐: "复色后主动维持6-12个月"
    临床现实: "患者复色后即停药，复发率高"
    差距: "维持治疗依从性差，复发率高"
    创作角度: "复色≠治愈——停药复发的临床现实"

  分型分期执行:
    指南推荐: "精确分型分期，VIDA/VASI评估"
    临床现实: "基层医生简化分型，不使用量化评估工具"
    差距: "量化评估工具使用率低"
    创作角度: "分型分期——指南精密vs临床简化"

  中医药使用:
    指南推荐: "中西医结合学会共识含中医药"
    临床现实: "中医药使用广泛但缺乏标准化方案"
    差距: "中医药在共识中有位置但循证证据薄弱"
    创作角度: "中西医结合——中国特色的双刃剑"

# ============================================================
# 7. 指南解读创作框架
# ============================================================

content_creation_framework:
  核心原则:
    - "所有内容必须标注'仅供科普参考，具体诊疗请遵医嘱'"
    - "不替代指南原文，做'翻译+解读+对比'而非'替代'"
    - "争议点标注争议，灰色地带标注不确定性，不做断言"

  内容类型矩阵:
    指南解读类:
      标题公式: "最新共识解读：[年份][机构]白癜风指南[核心变化]"
      结构: "背景→核心变化逐条解读→与上一版对比→临床意义→患者须知"
      示例: "2024版白癜风共识三大突破：早期干预+JAK+综合治疗"
    指南对比类:
      标题公式: "[国家A]vs[国家B]白癜风指南：[差异维度]对比"
      结构: "对比维度表→差异解读→中国患者关注点→选择建议(不替代医嘱)"
      示例: "中国vs国际：白癜风JAK抑制剂推荐差异在哪"
    版本变迁类:
      标题公式: "[版本A]→[版本B]：白癜风共识[X年间]进化史"
      结构: "时间线→关键变化→删减内容→新增内容→趋势预判"
      示例: "2014→2024：十年间白癜风共识改了什么"
    争议解读类:
      标题公式: "白癜风指南没说清的：[争议点]到底怎么看"
      结构: "争议点→各指南立场→临床现实→患者困惑→理性建议"
      示例: "维生素C到底能不能吃？指南vs民间说法"
    灰色地带类:
      标题公式: "指南空白区：[未覆盖问题]的现实困境"
      结构: "问题定义→现有证据→指南空白→临床经验→期待未来"
      示例: "6-11岁白癜风患儿：药物可及性的夹心层困境"
    实践差距类:
      标题公式: "指南说了但做不到：[差距点]的现实困境"
      结构: "指南推荐→临床现实→差距原因→患者应对→未来期待"
      示例: "指南说早期干预，但多数患者来晚了——怎么办"

  争议话题处理规则:
    维生素C忌口:
      立场: "指南明确不忌口，民间认知相反"
      处理: "引用共识原文+解释循证依据+不否定患者担忧情绪"
    激素恐惧:
      立场: "指南推荐激素一线，患者恐惧"
      处理: "解释间歇疗法安全性数据+不贬低恐惧心理+提供替代方案信息"
    JAK抑制剂可及性:
      立场: "指南已推荐，药物未完全落地"
      处理: "标注当前获批状态+药械通进展+不引导患者自行获取"

  创作节奏规划:
    Q1_指南解读季: "年初新指南发布后2-4周内推出解读"
    Q2_对比分析季: "国际指南更新时做中外对比"
    Q3_争议话题季: "结合患者常见误解做争议解读"
    Q4_灰色地带季: "年度盘点时聚焦未解决问题"

  参考文献引用规范:
    - "引用指南时标注：名称+年份+机构"
    - "引用具体数据时标注：文献作者+年份+期刊"
    - "不引用的内容标注：'根据[指南名称]精神解读'"
    - "争议和灰色地带标注：'当前指南未明确覆盖此问题'"