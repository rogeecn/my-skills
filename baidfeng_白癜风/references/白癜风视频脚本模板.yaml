## T1 痛点爆破型脚本模板

适用品类: P5(患者教育/误区纠正), P6(心理干预)
适用受众: L5患者级, L3基层级
适用平台: 抖音(60-90秒), 视频号(3-5分钟扩展版)
场景: S1诊室科普(权威版) 或 S5患教对话(温暖版)

### 抖音90秒版结构

```
=== Section 1: Hook (0-3秒) ===
时长: 3秒
镜头: L3近景微推 → L1特写
场景: {S1或S5}
口播词: "{患者最恐惧的问题}？{颠覆性回答}"
叠加: 大字标题2行弹出
  行1: "{短句1, ≤8字}"
  行2: "{短句2, ≤8字}"
示例: "白癜风传染吗？4个最常见误区一次打消"

=== Section 2: 引入 (3-15秒) ===
时长: 12秒
镜头: L2中景固定
场景: {S1或S5}
口播词: "{问题定义：为什么这个问题重要/多常见}"
叠加: 关键词弹出动画(每3秒1个，共3-4个关键词)
示例: "这是白癜风患者最常问的问题——身边的人是不是也在担心？今天一次性讲清楚"
关键词: ["不传染", "不遗传必发", "可控可治", "慢性管理"]

=== Section 3: 误区爆破 (15-40秒) ===
时长: 25秒
镜头: L2中景 + L6侧切交替(每8秒1切)
场景: {S1或S5}
口播词: "误区{序号}：{错误认知} → 真相：{正确事实}+{简要机制或数据}"
叠加(侧切时): 误区vs真相对比卡片(左红右绿或左灰右蓝)
  误区侧: "{错误认知, ≤12字}"
  真相侧: "{正确事实, ≤12字}"
  来源标注: "{数据来源, ≤10字}"
示例口播: "误区1：白癜风会传染 → 真相：完全不传染，这是自身免疫病，免疫系统攻击自己的黑素细胞，跟病毒细菌无关"
示例叠加:
  误区侧: "白癜风会传染？"
  真相侧: "不传染，自身免疫病"
  来源标注: "[MSD+百度百科一致]"
爆破数量: 2-3个误区(90秒版最多3个，否则信息过载)

=== Section 4: 正确做法 (40-65秒) ===
时长: 25秒
镜头: L2中景 → L3近景微拉
场景: {S1或S5}
口播词: "知道了真相，正确的做法是：{2-3条实操建议}"
叠加: 清单卡片逐条弹入(每条0.3秒弹入)
  条1: "{实操建议1, ≤15字}"
  条2: "{实操建议2, ≤15字}"
  条3: "{实操建议3, ≤15字}"
示例口播: "知道了真相，正确的做法是：规范治疗+日常防晒+定期复诊"
示例叠加:
  条1: "规范治疗，不迷信偏方"
  条2: "日常防晒，避免暴晒"
  条3: "定期复诊，长期管理"

=== Section 5: 安心收束 (65-85秒) ===
时长: 20秒
镜头: L3近景缓拉(L8)
场景: {S1→S5过渡 或 S5全程}
口播词: "{安心话术：问题可控+希望传递+生活照常}"
叠加: 金句字幕弹出(2行)
  行1: "{安心金句, ≤8字}"
  行2: "{行动引导, ≤8字}"
BGM: 暖和弦渐入(3秒渐入)
示例口播: "白癜风不传染、可控可治、多数稳定——你照常生活，我们陪你管理"
示例叠加:
  行1: "不传染 可控可治"
  行2: "照常生活 规范管理"

=== Section 6: 尾板 (85-90秒) ===
时长: 5秒
镜头: L2中景
场景: {S1或S5}
口播词: "关注我，更多白癜风科普"
叠加: 合规声明字幕(5秒持续显示)
  "仅供科普参考，具体诊疗请遵医嘱"
```

### 视频号5分钟扩展版结构

扩展规则：误区爆破段从2-3个扩展至4-5个，每个误区增加1-2句机制/数据补充；增加"患者常见追问"段(30秒)；安心收束段增加"家属沟通建议"(30秒)。

```
=== Section 1: Hook (0-5秒) ===
[同抖音版，时长扩展至5秒]

=== Section 2: 引入 (5-30秒) ===
[同抖音版，时长扩展至25秒，口播词增加1-2句背景补充]

=== Section 3: 误区爆破 (30-180秒) ===
时长: 150秒
[每个误区扩展至30秒：
  - 误区呈现(5秒口播+L3近景)
  - 真相揭示(10秒口播+L2中景+L6侧切数据卡)
  - 机制补充(15秒口播+L7缓推或白板讲解S2)
  误区数量: 4-5个]

=== Section 4: 追问解答 (180-240秒) ===
时长: 60秒
口播词: "了解了真相后，患者最常追问的问题是：{1-2个追问}"
镜头: L2中景+L5过肩镜头(模拟患者视角)
场景: S5患教对话
叠加: 问答卡片(问+答各1行)

=== Section 5: 正确做法 (240-300秒) ===
时长: 60秒
[同抖音版但内容更详细，清单扩展至5条]

=== Section 6: 家属建议 (300-360秒) ===
时长: 60秒
口播词: "如果你是家属/朋友，最重要的是：{2-3条建议}"
镜头: S5患教对话+L5过肩
叠加: 家属建议清单卡片

=== Section 7: 安心收束 (360-390秒) ===
[同抖音版但时长扩展至30秒]

=== Section 8: 尾板 (390-300秒) ===
[同抖音版，合规声明持续5秒]
```

