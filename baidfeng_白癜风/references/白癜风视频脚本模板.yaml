## T5 对比答疑型脚本模板

适用品类: P3(治疗方案对比), P2(诊断鉴别), P12(合并症关联)
适用受众: L2临床级, L3基层级, L5患者级(L5时降低专业深度)
适用平台: 抖音(60-90秒简化版), B站(3-5分钟), 视频号(3-5分钟)
场景: S1诊室科普(对比段) + S2白板讲解(鉴别段)

### 抖音90秒简化版结构

```
=== Section 1: Hook (0-3秒) ===
口播词: "{方案A} vs {方案B}：{关键维度}对比"
叠加: 大字标题
示例: "308nm准分子激光 vs 窄谱UVB：5个维度帮你选光疗方案"

=== Section 2: 对比框架 (3-15秒) ===
口播词: "{为什么需要对比：不同场景适合不同方案}"
叠加: 对比框架卡片(左A右B布局)

=== Section 3: 逐维对比 (15-55秒) ===
口播词: 每个维度5-8秒："{维度名}：方案A{特点} vs 方案B{特点}"
叠加: 对比表格逐行弹入(5维度×2列)
  维度1: "{维度名}"
  A列: "{方案A在该维度的特点, ≤12字}"
  B列: "{方案B在该维度的特点, ≤12字}"
对比维度数量: 抖音版≤5维度
示例:
  维度1: 适用部位 → A: 小面积局限 → B: 大面积泛发
  维度2: 疗效速度 → A: 较快(8-12周) → B: 较慢(12-24周)
  维度3: 便利性 → A: 需去医院 → B: 家用设备可选
  维度4: 副作用 → A: 局部灼热 → B: 全身暴露
  维度5: 费用 → A: 较高 → B: 较低

=== Section 4: 选择建议 (55-75秒) ===
口播词: "{选择建议：什么情况选A、什么情况选B、什么情况可联合}"
叠加: 选择建议卡片(2-3条)

=== Section 5: 安心收束+尾板 (75-90秒) ===
[同T1安心收束+尾板]
```

### B站5分钟扩展版

扩展规则：对比维度从5扩展至7-8；每个维度增加数据支撑口播(10-15秒)；增加"常见追问"段(30秒)；增加"基层/患者适配建议"段(30秒)。

