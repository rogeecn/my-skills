# 白癜风和相关皮肤病 — 视频脚本模板

> 何时读取: 撰写任何视频内容脚本时读取，先选模板类型再填内容
> 创建日期: 2026-05-15
> 与"白癜风视频导演手册.md"配合使用——本文件定义内容结构，导演手册定义视觉语言
>
> 使用说明:
>   1. 根据内容品类选择对应的脚本模板类型
>   2. 按模板结构逐节填写口播词/画面指示/叠加信息
>   3. 每节标注时长、镜头编号(L1-L8)、场景编号(S1-S7)
>   4. 口播词总字数需匹配平台语速标准(抖音180-200字/分，B站120-150字/分)
>   5. 完成后对照"视频制作检查清单"(导演手册§10)逐项核对

---

## 脚本模板类型选择矩阵

| 内容品类 | 首选脚本类型 | 备选脚本类型 | 平台适配 |
|---------|-------------|-------------|---------|
| P5 患者教育(误区纠正) | T1 痛点爆破型 | T5 对比答疑型 | 抖音首选，视频号/B站可扩展 |
| P5 患者教育(清单指南) | T2 清单实操型 | — | 抖音首选 |
| P9 案例分享 | T3 案例叙事型 | — | B站首选，抖音需压缩为90秒版 |
| P1/P3/P10 机制方案指南 | T4 深度讲解型 | — | B站首选 |
| P3/P12 对比鉴别 | T5 对比答疑型 | T1 痛点爆破型 | 抖音+B站均可 |
| P4/P1 前沿速递 | T6 前沿播报型 | — | B站3分钟版或抖音90秒压缩版 |

