├─ 机制讲解/指南解读/方案逻辑 → T4深度讲解型
│   └─ 平台: B站首选
│   ┄─ 场景: S2(主体) + S4(开头/数据)
│
├─ 对比选择/鉴别诊断 → T5对比答疑型
│   └─ 平台: 抖音+B站均可
│   └─ 场景: S1(对比段) + S2(鉴别段)
│
└─ 新药速递/前沿播报 → T6前沿播报型
