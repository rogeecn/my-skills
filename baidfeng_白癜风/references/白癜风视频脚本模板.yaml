## T3 案例叙事型脚本模板

适用品类: P9(案例分享), C1-C8(各类病例)
适用受众: L2临床级, L4学习级, L5患者级(面向L5时用N5患者自述叙事)
适用平台: B站(3-8分钟), 视频号(5-10分钟)
场景: S3案例复盘(叙事段) + S2白板讲解(拆解段)

### B站5分钟版结构

```
=== Section 1: Hook (0-10秒) ===
时长: 10秒
镜头: L3近景 → L1特写切
场景: S3
口播词: "{病例悬念描述}→{追问}"
叠加: 悬念字幕弹出
示例: "误诊花斑癣半年——真相竟是进展期白癜风！3个鉴别要点你必须掌握"

=== Section 2: 病例背景 (10-60秒) ===
时长: 50秒
镜头: L2中景固定为主，每15秒L6侧切1次
场景: S3
口播词: "{病例背景卡片逐项口播：化名/年龄/性别/部位/病程/既往史}"
叠加: 病例背景卡片(分2-3次弹出)
  卡片1: "{化名}|{年龄段}|{性别}|{白斑部位}"
  卡片2: "{病程约数}|{分型分期}|{既往治疗}"
  卡片3: "{合并症/特殊因素}"
示例口播: "小王，28岁左右女性，面部手部对称白斑约3个月，最初被诊为花斑癣，外用抗真菌药2个月无效后转诊皮肤科"
示例叠加:
  卡片1: "小王|28岁左右|女性|面部+手部对称白斑"
  卡片2: "病程约3月|误诊2月|外用抗真菌无效"
  卡片3: "无甲状腺异常|无家族史"

=== Section 3: 诊疗时间轴 (60-180秒) ===
时长: 120秒
镜头: S3叙事段(前60秒) + S2白板讲解拆解段(后60秒)
  叙事段: L2中景为主，关键转折点L3近景/L7缓推
  拆解段: S2白板讲解，L2+L7缓推配合递进
场景: S3→S2切换
口播词叙事段: "{逐节点口播诊疗过程：初诊→检查→分型→方案→治疗→评估→调整}"
口播词拆解段: "{关键决策节点拆解：为什么选这个方案、如果选另一条路会怎样}"
叠加叙事段: 时间轴图逐步展开(每节点0.5秒)
  T0(初诊): "{初诊描述}"
  T3月(评估): "{3月评估结果}"
  T6月(复色): "{6月复色情况}"
  T12月(维持): "{12月维持管理}"
叠加拆解段: 决策树图/对比表
  决策1: "{为什么选方案A而非B}"
  决策2: "{什么信号触发方案调整}"
示例: [参照白癜风经典病例库.yaml的N1时间线叙事和N2决策链叙事结构]

=== Section 4: 数据呈现 (180-300秒) ===
时长: 120秒
镜头: L6侧切密集(每5秒1切)
场景: S2(数据段在白板场景更专业)
口播词: "{复色数据/疗效对比/方案差异数据口播}"
叠加: 数据表/对比图密集弹出
  数据卡1: "{核心疗效数据, ≤20字}" + 来源标注
  数据卡2: "{方案对比数据}" + 证据等级标注
  对比表: "{方案A vs 方案B: 5维度对比}"
BGM: 节奏感轻电子(数据段允许较高节奏)
示例: "芦可替尼乳膏Ⅲ期数据：24周F-VASI75达30.9%——但这不是所有患者都适用，需要看分型分期"

=== Section 5: 诊疗要点总结 (300-420秒) ===
时长: 120秒
镜头: L2中景+实操画面(S6)交替(如有实操段)
场景: S2 → S6(如有) → S1
口播词: "{诊疗要点清单逐条口播，每条1-2句}"
叠加: 清单卡片逐条弹入(5-7条)
示例要点清单:
  1. "面部白斑首诊必做Wood灯——灰白荧光=进展期"
  2. "进展期首选激素控制→稳定期再光疗复色"
  3. "3个月是首次评估节点——有复色迹象继续，无则调整"
  4. "合并甲状腺筛查不可省略"
  5. "患者预期管理：稳定+复色是目标，不是根治"

=== Section 6: 弹幕互动 (420-460秒) ===
时长: 40秒
镜头: L2中景微笑
场景: S1或S2
口播词: "你遇到过类似误诊吗？评论区分享——下期讲{预告主题}"
叠加: 弹幕引导文字
BGM: 音量降低至背景音

=== Section 7: 收束 (460-480秒) ===
时长: 20秒
镜头: L2中景
场景: S1
叠加: 合规声明字幕(5秒) + 下期预告卡片
口播词: "本文病例为创作范例，仅供科普参考，具体诊疗请遵医嘱。下期：{预告主题}"

=== 病例叙事脚本合规标注 ===
每条案例脚本必须包含:
  - 病例背景卡片标注: "化名/年龄段/约数"(参照经典病例库.yaml脱敏要求DES1-DES5)
  - 结尾合规声明: "本文病例为创作范例，仅供科普参考，具体诊疗请遵医嘱"
  - 如使用N5患者自述叙事: 额外标注"以下为创作范例，非真实患者自述"
```

