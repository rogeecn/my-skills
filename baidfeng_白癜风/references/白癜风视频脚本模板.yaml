```
你要做什么类型的视频？
│
├─ 误区纠正/患教安心 → T1痛点爆破型
│   └─ 平台: 抖音首选
│   └─ 场景: S1(权威版) 或 S5(温暖版)
│
├─ 清单/筛查/必做事项 → T2清单实操型
│   └─ 平台: 抖音首选
│   └─ 场景: S1 或 S6
│
├─ 病例/案例故事 → T3案例叙事型
│   └─ 平台: B站首选
│   └─ 场景: S3(叙事) + S2(拆解)
