## T2 清单实操型脚本模板

适用品类: P5(患者教育/清单指南), P3(治疗方案), P12(合并症筛查)
适用受众: L5患者级, L2临床级, L3基层级
适用平台: 抖音(60-90秒), 视频号(3-5分钟)
场景: S1诊室科普 或 S6实操演示

### 抖音90秒版结构

```
=== Section 1: Hook (0-3秒) ===
时长: 3秒
镜头: L3近景微推 → L1特写
场景: S1
口播词: "{场景}必做/必查/必知的{数量}件事"
叠加: 大字标题2行
  行1: "{场景关键词, ≤8字}"
  行2: "必做{N}件事"
示例: "白癜风患者必查5项甲状腺指标"

=== Section 2: 引入 (3-15秒) ===
时长: 12秒
镜头: L2中景固定
场景: S1
口播词: "{为什么这个清单重要：不做的后果/漏诊比例/影响}"
叠加: 1个数据卡片弹出
  "{关键数据, ≤20字}"
  来源标注: "{来源}"
示例: "15-25%白癜风患者合并甲状腺异常——不查=可能漏诊"

=== Section 3: 清单呈现 (15-55秒) ===
时长: 40秒
镜头: L2中景(口播段) + L6侧切(每条弹出时切一次)
场景: S1 或 S6(如涉及实操)
口播词: 每条："第{序号}：{清单条目}——{1句解释}"
叠加: 清单卡片逐条弹入
  条1: "{清单条目1, ≤15字}"
  条2: "{清单条目2, ≤15字}"
  条3: "{清单条目3, ≤15字}"
  条4: "{清单条目4, ≤15字}"
  条5: "{清单条目5, ≤15字}"
每条口播节奏: 6-8秒/条(含叠加弹出时间)
示例口播:
  "第1：甲状腺功能全套——TSH+FT3+FT4+抗体，白癜风合并率15-25%"
  "第2：甲状腺超声——排查结节和异常结构"
  "第3：血糖检测——合并糖尿病风险也升高"
  "第4：心理评估(DLQI)——不只是皮肤问题"
  "第5：年度复查——至少每年1次全面筛查"

=== Section 4: 操作提示 (55-75秒) ===
时长: 20秒
镜头: L2→L3近景微拉
场景: S6(如涉及实操) 或 S1
口播词: "{如何执行：去医院做什么检查/和医生说什么/多久做一次}"
叠加: 操作步骤卡片(2-3步)
示例: "下次复诊时，把这5项检查清单给医生看——大多数医院都可以一次完成"

=== Section 5: 安心收束 (75-85秒) ===
时长: 10秒
镜头: L3近景缓拉(L8)
场景: S1→S5过渡
口播词: "{安心话术：筛查不是担心而是负责}"
叠加: 金句字幕
BGM: 暖和弦渐入
示例: "筛查不是担心，是负责任的管理——查完安心，不查才焦虑"

=== Section 6: 尾板 (85-90秒) ===
[同T1尾板]
```

