## 口播词写作规范

### 通用规则

| 规则 | 说明 | 原因 |
|------|------|------|
| 口播词口语化 | 短句、自然语序、不用书面长句 | 视频口播≠文章写作，观众靠听觉接收 |
| 1句≤25字 | 口播每句话不超过25字 | 超过25字听觉无法一次理解 |
| 关键词前置 | 每段开头先抛关键词/数字 | 视频观众注意力窗口极短(3秒)，前置才能抓住 |
| 避免"嗯""那个" | 口播词中不出现犹豫词 | 犹豫词削弱专业感，拍摄时可剪辑去除 |
| 数据必须标注来源 | 口播数据时必须口头标注"根据{来源}" | 医学赛道专业感核心 |
| 合规声明口头+字幕 | 结尾口播+字幕双重呈现合规声明 | 确保观众无论如何都能看到声明 |

### 各受众口播词适配

| 受众 | 口播词特征 | 示例 | 禁忌 |
|------|-----------|------|------|
| L1专家 | 学术化+争议性，允许不确定表述 | "IFN-γ→JAK1/2→STAT轴是当前最受关注的通路，但IL-15的记忆T细胞维持机制可能更关键" | 过度通俗化(专家不需要比喻) |
| L2临床 | 实操导向+剂量数据+避坑提醒 | "面部选他克莫司而非强效激素——0.1%软膏每日2次，8周评估，避免皮肤萎缩" | 纯理论无实操指引 |
| L3基层 | 极简识别+转诊标准+安全边界 | "基层5分钟识别：对称白斑+Wood灯蓝白荧光=白癜风→转诊皮肤科" | 过度专业术语 |
| L5患者 | 安心话语+误区纠正+可行动 | "白癜风不传染、可控可治、多数稳定——你照常生活" | 数据堆砌(患者不需要看临床试验编号) |

### 口播词字数计算公式

| 平台 | 目标时长 | 语速 | 口播词总字数 | 计算公式 |
|------|---------|------|------------|---------|
| 抖音 | 90秒 | 180-200字/分 | 270-300字 | 时长(秒) × 3-3.3 |
| B站 | 5分钟=300秒 | 120-150字/分 | 600-750字 | 时长(秒) × 2-2.5 |
| 视频号 | 5分钟=300秒 | 130-160字/分 | 650-800字 | 时长(秒) × 2.2-2.7 |

注意: 口播词总字数 ≠ 全部口播内容字数。叠加信息卡片/数据标注的字数不计入口播字数，口播词仅统计"医生说的话"的字数。

