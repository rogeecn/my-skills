## T4 深度讲解型脚本模板

适用品类: P1(病理机制), P3(治疗方案), P10(指南解读), P12(合并症)
适用受众: L1专家级, L2临床级, L4学习级
适用平台: B站(5-8分钟), 视频号(5-10分钟)
场景: S2白板讲解(主体段) + S4前沿速递(开头/数据段)

### B站6分钟版结构

```
=== Section 1: Hook (0-10秒) ===
时长: 10秒
镜头: L3近景→L1特写切
场景: S4(前沿感开头) 或 S2(学术感开头)
口播词: "{反直觉发现/争议引入/指南核心变化}"
叠加: 悬念字幕弹出
示例(P10指南): "2024版白癜风共识3条核心变化——第一条就是：早期干预理念首次强调"
示例(P1机制): "为什么肤色深的人更容易得白癜风？氧化应激假说给出了答案"

=== Section 2: 问题定义 (10-60秒) ===
时长: 50秒
镜头: L2中景固定为主
场景: S2
口播词: "{定义核心问题：这个机制/指南/方案为什么重要，现有理解的局限在哪}"
叠加: 问题定义卡片弹出
示例(P10): "2014→2018→2021→2024：十年间共识改了什么？核心变化从'保守等待'到'早期干预'"

=== Section 3: 机制/核心内容讲解 (60-240秒) ===
时长: 180秒
镜头: S2白板讲解为主，L2中景+L7缓推配合知识递进
  每30秒插入1次L6侧切(白板内容更新)
场景: S2
口播词: "{机制链路/指南核心内容/方案选择逻辑逐段口播}"
叠加: 白板内容逐步呈现
  阶段1(0-60秒): "{机制/变化/逻辑第一层}"
  阶段2(60-120秒): "{机制/变化/逻辑第二层——深入}"
  阶段3(120-180秒): "{机制/变化/逻辑第三层——临床意义}"
每阶段L7缓推1次(3-5秒从MCU推至CU)
示例(P1机制链路): "免疫系统发出错误指令→CD8+T细胞攻击黑素细胞→IFN-γ发出信号→JAK-STAT通路→CXCL9/CXCL10→更多T细胞聚集→正反馈循环→白斑形成"

=== Section 4: 数据/证据呈现 (240-360秒) ===
时长: 120秒
镜头: L6侧切密集(每5秒1切)
场景: S2 或 S4
口播词: "{数据口播：临床数据/指南对比/方案疗效}"
叠加: 数据表/对比表/证据等级标注密集弹出
BGM: 节奏感ambient(数据段允许较高节奏)
示例(P10指南对比): "中国2024 vs VTF2023 vs AAD2024——JAK抑制剂推荐差异在哪？中国版纳入时药物尚未在华获批"

=== Section 5: 临床转化 (360-450秒) ===
时长: 90秒
镜头: L2中景为主，如有实操段切换至S6
场景: S2 → S6(如有实操) → S1
口播词: "{机制→临床转化：这个知识如何影响临床决策/患者沟通}"
叠加: 临床转化清单卡片
示例(P1→P3转化): "理解IFN-γ-JAK-STAT轴→临床选择JAK抑制剂→芦可替尼乳膏阻断信号→24周F-VASI75达30%"

=== Section 6: 弹幕互动+要点总结 (450-480秒) ===
时长: 30秒
镜头: L2中景微笑
场景: S1
口播词: "{2-3条核心要点快速回顾} + 互动引导"
叠加: 要点清单 + 弹幕引导

=== Section 7: 收束 (480-360秒) ===
[同T3收束，合规声明+系列预告]
```

