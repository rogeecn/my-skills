# 玄学正向叙事模板

> 何时读取: 确定叙事基调时；写正文选择赋能方向；避免恐吓/宿命论叙事

---

## 赋能型情感触发词表

| 词类 | 触发词 | 适用场景 |
|------|--------|---------|
| 破局类 | 转机、突破、逆袭、蓄力期、转折点、新起点 | 事业低谷/运势低迷 |
| 选择类 | 你可以选择、命不是定数、主动权在你、看清才能选好 | 命运话题 |
| 成长类 | 觉醒、升级、蜕变、蜕变期、成长契机 | 人生迷茫/修行阶段 |
| 能量类 | 旺、升、聚、激活、蓄、蓄满 | 转运/旺运 |
| 顺应类 | 顺势而为、借力、借运、借势、天时地利 | 择日/运势解读 |
| 平衡类 | 阴阳调和、五行平衡、身心合一、天人相应 | 风水/养生 |
| 智慧类 | 老祖宗智慧、处世之道、底层逻辑、看透本质 | 文化溯源/易学 |

---

## 赋能大纲模板（3种以上）

### 模板1: 破局叙事大纲

适用场景: 运势低迷/事业低谷/感情困境

```
1. 共情开篇: "我知道你现在{困境状态}，很多人在这个阶段都会..."
2. 玄学解读: "从命理/风水的角度看，这其实是{正面解读}..."
3. 破局方法: "3个方法帮你{破局方向}..."
   - 方法1: 简单可操作（日常生活调整）
   - 方法2: 玄学辅助（风水/转运小技巧）
   - 方法3: 心态升级（从命运观升级）
4. 赋能结尾: "低谷不是终点，是蓄力期。你有主动权。"
```

### 模板2: 顺势叙事大纲

适用场景: 运势解读/择日择吉/年运月运

```
1. 时令锚定: "{时令/节气/生肖年}来了，这是{时令特征}的时段..."
2. 运势拆解: "这段时间对{目标人群}的运势特点是..."
3. 顺势建议: "顺势而为，做好这{N}件事..."
   - 顺势行动1: 骑势而上（利用旺势）
   - 顺势行动2: 蓄势待发（为低谷期储备）
   - 顺势行动3: 避势减损（避开不利时机）
4. 平衡结尾: "运势是参考不是定数，顺势而为才有主动权。"
```

### 模板3: 觉醒叙事大纲

适用场景: 命运哲学/修行实践/文化溯源

```
1. 问题引入: "很多人问：{命运终极问题}..."
2. 玄学智慧: "从{体系}的角度看，答案是..."
3. 觉醒路径: "觉醒不是一夜之间，是这3个层次的递进..."
   - 第一层: 认识规律（知道命运有规律可循）
   - 第二层: 顺应规律（学会顺势而非逆势）
   - 第三层: 超越规律（从术入道，获得选择的自由）
4. 开悟结尾: "命理不是枷锁，是地图。看清地图，走好每一步。"
```

### 模板4: 实操叙事大纲

适用场景: 风水布局/转运方法/择日实操

```
1. 场景锚定: "{生活场景}（搬家/开店/结婚）时，玄学能帮你..."
2. 知识铺垫: "{品类}的核心原理是{简要原理}..."
3. 实操步骤: "按这个步骤来..."
   - Step 1: {准备/判断}
   - Step 2: {核心操作}
   - Step 3: {验证/调整}
4. 效果预期: "做好这些，你的{场景}会更有{正面效果}。"
```

---

## 叙事基调选择规则表

| 受众层级 | 推荐基调 | 禁用基调 | 说明 |
|----------|---------|---------|------|
| L1好奇观望者 | 好奇感+趣味感 | 恐吓感+宿命感 | 用"有趣"引导，不用"恐惧"逼迫 |
| L2生活应用者 | 实用感+破局感 | 宿命感+迷信感 | 强调"实用决策辅助"，不强调"命定不可改" |
| L3体系学习者 | 专业感+系统感 | 神秘感+玄乎感 | 用逻辑拆解体系，不用神秘包装 |
| L4修行实践者 | 智慧感+觉醒感 | 低俗感+功利感 | 强调"以术入道"，不强调"算命赚钱" |
| L5文化研究者 | 学术感+理性感 | 感性煽动+迷信 | 用理性分析，不用情感操控 |

---

## 叙事基调禁忌

1. **禁止宿命论绝对化**: 不能说"命定不可改""命中注定就是这样"
2. **禁止恐吓营销**: 不能说"不看风水就要出事""不转运就要倒霉"
3. **禁止迷信强化**: 不能说"这个东西你必须买""不做这个仪式就会遭殃"
4. **禁止伪科学混搭**: 不能说"量子力学证明了风水""易经是超科学"
5. **禁止绝对化承诺**: 不能说"做完100%转运""这个方法一定有效"
6. **禁止贬低理性**: 不能说"科学解释不了""理性的局限性"
7. **禁止贩卖焦虑**: 不能说"你的命很差""今年要出大事"
8. **禁止混淆层次**: L1-L2内容不能用L4-L5的语言体系