## 受众类型与品类对应

| 受众层级 | 主要品类 | 次要品类 |
|----------|---------|---------|
| L1好奇观望者 | 运势解读、简易占卜 | 转运指南、星命占星 |
| L2生活应用者 | 风水生活、择日择吉 | 运势解读、转运指南 |
| L3体系学习者 | 命理术数、卜筮体系 | 易学体系、堪舆风水 |
| L4修行实践者 | 道家玄学、修行实践 | 命理术数、易学体系 |
| L5文化研究者 | 文化溯源、道家玄学 | 易学体系、术数史 |

