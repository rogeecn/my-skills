## 选题公式

### 公式1: 品类+受众痛点
"{品类关键词}解决{受众痛点}" → "八字命理帮你看懂今年事业方向"

### 公式2: 品类+时令锚定
"{时令}的{品类关键词}指南" → "2026蛇年运势解读：属蛇人必看"

### 公式3: 品类+反常识
"你以为{品类}只是{常识}？其实{反常识}" → "你以为风水只是摆摆东西？其实暗藏五行生克逻辑"

