## 时令周期

| 品类 | 时令关联 |
|------|---------|
| 运势解读 | 年运（春节前）、月运（月初）、周运（周一） |
| 择日择吉 | 结婚旺季（5-10月）、搬家旺季（春节后） |
| 转运指南 | 新年/节气交替/个人低谷期 |
| 风水生活 | 换房季、装修季、新办公室 |
| 命理术数 | 无强时令，但"看年运"是春节前刚需 |
| 堪舆风水 | 春季看阳宅、秋季看阴宅（传统说法） |
| 文化溯源 | 无强时令，适合深度内容填充期 |

