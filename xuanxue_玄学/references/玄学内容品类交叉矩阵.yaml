## 多样性规则

1. **每周品类轮换**: 不要连续3天发同一品类
2. **生活类/专业类交替**: 每发2篇生活类，穿插1篇专业类
3. **受众层级递进**: L1→L2→L3→L4→L5，每周覆盖3个层级以上
4. **交叉组合优先**: 单品类选题占比不超过50%，交叉组合选题至少30%
5. **时令选题储备**: 提前2周储备时令选题（春节年运/节气转运）
6. **避免同质化**: 同一周不要出现"XX运势解读"超过2篇