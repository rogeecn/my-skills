## 平台侧重建议

| 受众层级 | 主力平台 | 辅助平台 |
|----------|---------|---------|
| L1好奇观望者 | 小红书+抖音 | 公众号短文 |
| L2生活应用者 | 公众号+小红书 | 抖音 |
| L3体系学习者 | 公众号+B站 | 知乎 |
| L4修行实践者 | 公众号 | B站+知乎 |
| L5文化研究者 | 知乎 | 公众号深度文 |