# 玄学平台适配指南

> 何时读取: 多平台发布时调整内容形式；确认平台规格限制

---

## 6平台内容适配

### 微信公众号（主力平台）

| 维度 | 规格 |
|------|------|
| 内容形式 | 长图文为主（1500-3000字）+ 短图文（800-1500字） |
| 标题风格 | 标题公式库全套适用；玄学提醒型/旺自己型是高频爆款模式 |
| 字数规格 | 长文1500-3000字，短文800-1500字 |
| 排版要点 | 分段短句、多用空行、加粗关键句、适当配图 |
| 发布时间 | 早上7-9点（运势/占卜类）/ 晚上8-10点（深度类） |
| 互动引导 | 结尾引导留言"你的运势如何"/"评论区抽一签" |

### 小红书（视觉+短内容）

| 维度 | 规格 |
|------|------|
| 内容形式 | 图文笔记（300-800字）+ 开运壁纸/头像类图片笔记 |
| 标题风格 | "玄学提醒""开运壁纸""旺自己攻略"型标题最火 |
| 字数规格 | 正文300-800字，标题不超过20字 |
| 视觉要点 | 首图必须是精美设计图（开运壁纸/五行配色/星座运势图） |
| 发布时间 | 晚上6-10点（女性用户高峰） |
| 互动引导 | "保存开运壁纸""评论区报星座看运势" |

### 抖音/视频号（短视频）

| 维度 | 规格 |
|------|------|
| 内容形式 | 短视频（30-90秒）+ 直播占卜 |
| 标题风格 | "玄学提醒""转运小妙招""运势预警"型封面标题 |
| 视频规格 | 30-90秒竖屏，封面文字不超过6字 |
| 内容要点 | 开头3秒必须出悬念/提醒；口播+画面切换 |
| 发布时间 | 早上7-9点/中午12-14点/晚上18-22点 |
| 互动引导 | "评论区留下你的星座/生肖，帮你看运势" |

### B站（中长视频）

| 维度 | 规格 |
|------|------|
| 内容形式 | 中长视频（5-20分钟）教学/科普类 |
| 标题风格 | 知识型标题"八字入门全教程""周易底层逻辑详解" |
| 视频规格 | 5-20分钟横屏，字幕必须齐全 |
| 内容要点 | 体系化教学内容；逻辑清晰+案例演示 |
| 发布时间 | 周五-周日晚上发布（学习型用户高峰） |
| 互动引导 | "弹幕留下你的八字，帮你解读" |

### 知乎（深度内容）

| 维度 | 规格 |
|------|------|
| 内容形式 | 长回答（2000-5000字）+ 专栏文章 |
| 标题风格 | 问题导向"八字到底准不准""玄学是迷信吗" |
| 字数规格 | 2000-5000字深度内容 |
| 内容要点 | 必须有逻辑论证+数据引用+理性分析 |
| 发布时间 | 工作日晚上 |
| 互动引导 | "欢迎评论区讨论/指正" |

### 搜狗/SEO（搜索流量）

| 维度 | 规格 |
|------|------|
| 内容形式 | 关键词导向的公众号文章 |
| 标题风格 | SEO关键词前置"八字命理入门""2026运势解读" |
| 关键词布局 | 标题包含主关键词；正文每段包含1-2个相关关键词 |
| 注意事项 | 搜狗对"算命""八字命理"等关键词有负面新闻倾向，需规避纯命理关键词 |
| 替代策略 | 用"运势解读""风水生活""玄学转运"等中性关键词代替敏感词 |

