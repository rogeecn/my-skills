## 玄学专项纪念日（单独列出）

| 日期 | 纪念日 | 选题方向 |
|------|--------|---------|
| 每年天赦日（4次） | 天赦日 | 天赦日是玄学中"天开恩赦"的日子，适合祈福、化解、转运。春季/夏季/秋季/冬季各一次 |
| 四离日（春分/夏至/秋分/冬至前1天） | 四离日 | 四离日忌嫁娶/出行/移徙，提醒禁忌 |
| 四绝日（春分/夏至/秋分/冬至后1天） | 四绝日 | 四绝日忌大事，提醒避讳 |
| 岁破日（每年不同） | 岁破日 | 与太岁相冲的日子，提醒大事避开 |
| 月破日（每月不同） | 月破日 | 当月不宜的日子提醒 |
| 三娘煞日 | 三娘煞 | 嫁娶忌日，提醒择日避开 |
| 杨公忌日（13天） | 杨公忌日 | 传统百忌日，提醒大事避开 |

