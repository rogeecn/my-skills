# 玄学受众画像矩阵

> 何时读取: 每次选题前，确认目标受众层级；创作时选择切入角度和叙事基调
> 分层逻辑: 按"信与用的深度梯度"5层递进（不是年龄）

---

## L1 好奇观望者（~40%）

核心特征: 偶尔接触，觉得神秘有趣，不信但好奇
核心心态: "玄学到底靠谱吗？想了解一下"

品类关注度排名:
  1. 运势解读（年运/月运/星座运势）
  2. 简易占卜（塔罗/抽签/每日一签）
  3. 星座运势
  4. 转运指南

切入角度:
  - "有趣的现象解读"：用科学视角拆解玄学现象（为什么星座好像准？心理学解释）
  - "文化猎奇"：展示玄学的奇特仪式和禁忌（老祖宗说的那些"怪"规矩）
  - "轻体验引导"：提供低成本体验入口（免费抽一签/塔罗入门小测试）

内容演变线:
  好奇尝试 → 轻体验 → 发现有趣 → 选择性信任或止步

禁忌:
  - 不要用恐吓性语言（"不看就倒霉"）
  - 不要说"你必须信"
  - 不要推销昂贵转运物

---

## L2 生活应用者（~30%）

核心特征: 用玄学做日常决策辅助（选日子/看风水/看运势）
核心心态: "帮我看看今年运势/这个房子能不能买"

品类关注度排名:
  1. 风水生活（家居风水/办公室风水）
  2. 择日择吉（搬家择日/结婚择日）
  3. 运势解读
  4. 转运指南

切入角度:
  - "实用决策辅助"：具体生活场景的玄学指引（搬家选楼层/开店择日）
  - "问题解决型"：遇到困扰时用玄学寻找答案（感情不顺怎么办/事业卡住了）
  - "简易改运法"：低成本可操作的转运方法（断舍离净化/色彩搭配）

内容演变线:
  遇到问题 → 寻求玄学解答 → 试试效果 → 部分接受 → 日常依赖

禁忌:
  - 不要恐吓营销（"不看风水就要出事"）
  - 不要推销高价开运物
  - 不要承诺绝对效果

---

## L3 体系学习者（~15%）

核心特征: 系统学习某一术数体系（八字/紫微/塔罗）
核心心态: "想真正学懂八字/塔罗，不只是算算玩"

品类关注度排名:
  1. 命理术数（八字命理/紫微斗数）
  2. 卜筮体系（梅花易数/六爻/奇门遁甲）
  3. 易学体系（周易/卦象研究）
  4. 堪舆风水

切入角度:
  - "知识系统拆解"：把复杂体系拆成可学的模块（八字入门7步/紫微斗数框架图）
  - "技术实操演示"：带读者一起推算（手把手教你排八字/梅花易数占例）
  - "体系对比选择"：帮助学习者选择适合的方向（八字vs紫微哪个适合你学）

内容演变线:
  入门好奇 → 选体系 → 系统学习 → 实操练习 → 形成判断力

禁忌:
  - 不要制造"学不完"的焦虑
  - 不要贬低其他体系
  - 不要暗示"只有大师才能学会"

---

## L4 修行实践者（~10%）

核心特征: 以玄学为修行/信仰路径
核心心态: "道家修行/易学是生命哲学，不只是工具"

品类关注度排名:
  1. 道家玄学（老庄哲学/内丹修炼）
  2. 修行实践（命运与修行/改命方法）
  3. 命理术数
  4. 易学体系

切入角度:
  - "以术入道"：从术数技术上升到哲学思考（从八字看命运的哲学含义）
  - "修行路径指引"：具体的修炼方法和心法（内丹入门/冥想与玄学）
  - "命运与自由意志"：玄学视角的终极问题探讨（命能改吗？业力是什么？）

内容演变线:
  学术数 → 思考意义 → 走上修行 → 日常修炼 → 追求悟道

禁忌:
  - 不要否定术数的工具价值（修行者也需要术数辅助）
  - 不要暗示"只有修行才是正路"
  - 不要混淆道教信仰和玄学学术

---

## L5 文化研究者（~5%）

核心特征: 学术视角审视玄学传统
核心心态: "魏晋玄学的哲学价值/易学对中国文化的影响"

品类关注度排名:
  1. 文化溯源（玄学史/术数史）
  2. 道家玄学（魏晋玄学）
  3. 易学体系（易学哲学）
  4. 术数史

切入角度:
  - "学术溯源"：玄学思想的历史脉络和哲学体系（魏晋玄学三大流派）
  - "文化影响解读"：玄学对中国文化的深层影响（易学如何塑造中国人的思维）
  - "理性审视"：科学视角审视玄学现象（玄学为什么能持续存在？社会学解释）

内容演变线:
  发现问题 → 学术调研 → 形成观点 → 写作输出 → 学术交流

禁忌:
  - 不要简单否定（"玄学就是迷信"）
  - 不要过度美化（"玄学是中华瑰宝不可质疑"）
  - 不要脱离学术规范