# 玄学生命事件维度

> 何时读取: 寻找事件触发选题；关联受众个人经历；规划情感共鸣内容

---

## 事件触发器列表（15个）

### A类: 命运转折事件（5个）

| # | 事件 | 触发场景 | 情感关键词 | 适用受众 | 选题方向 |
|---|------|---------|-----------|---------|---------|
| 1 | 事业低谷/裁员 | 工作不顺/被裁员/创业失败 | 焦虑、迷茫、不甘 | L2-L3 | "八字看事业低谷期如何转机" / "命理视角：裁员是转机还是劫数" |
| 2 | 感情挫折 | 分手/离婚/感情不顺 | 痛、不甘、想挽回 | L1-L2 | "塔罗占卜：这段感情还有救吗" / "八字看姻缘：为什么总是遇不到对的人" |
| 3 | 财运突变 | 破财/投资亏损/意外开支 | 慌、不甘、想扭转 | L2 | "玄学转运：破财后的3步挽回法" / "风水调整：让财运重新流动" |
| 4 | 健康警讯 | 突然生病/体检异常 | 恐惧、焦虑 | L2 | "命理看健康预警：哪些八字容易出问题" / "玄学养生：顺应五行调体质" |
| 5 | 人生迷茫期 | 30岁危机/找不到方向 | 迷茫、空虚、想找到意义 | L1-L3 | "塔罗牌帮你找到人生方向" / "命理不是定命，是帮你看清选择" |

