## 事件触发选题模板

"当你在{事件}时，玄学能帮你{解决方向}" → "当你在事业低谷时，命理能帮你看清转机时机"

"{事件}背后的玄学真相" → "感情挫折背后的命理真相：不是命不好，是时机不对"

"经历过{事件}的人都说了这句玄学忠告" → "经历过裁员的人都说了这句命理忠告：低谷是蓄力期"