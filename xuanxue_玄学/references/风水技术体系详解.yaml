## 家居风水实操指南（L2受众核心内容）

### 入门级：5个最简单的风水调整

| 序号 | 操作 | 原理 | 效果预期 |
|------|------|------|---------|
| 1 | 玄关保持整洁明亮 | 玄关是气的入口，堵了气就进不来 | "气进门了，家才活" |
| 2 | 床头不靠窗 | 窗口气流不稳，靠窗睡觉气场紊乱 | "睡得好才有精力冲事业" |
| 3 | 厨房灶台不对门 | 灶属火，门冲灶火气散 | "灶稳则财稳" |
| 4 | 卫生间门常关 | 卫生间属水且属秽，气散影响全屋 | "水气不乱跑，家运才稳" |
| 5 | 办公桌左高右低 | 左青龙右白虎，青龙位宜高宜动 | "左动右静=主动权在你手里" |

### 进阶级：按方位布局（适合L3受众）

| 方位 | 五行 | 适宜 | 创作切入角度 |
|------|------|------|-------------|
| 东方 | 木 | 绿植、书柜、学习区 | "东方属木——放个书架或绿植，助学业助成长" |
| 南方 | 火 | 灯光、红色装饰、厨房 | "南方属火——明亮+暖色调，助名声助社交" |
| 西方 | 金 | 金属摆件、白色装饰、收银台 | "西方属金——适合放收纳区，助财运助收获" |
| 北方 | 水 | 水景、深色装饰、冥想区 | "北方属水——适合安静休息区，助思考助蓄力" |
| 中央 | 土 | 稳重摆件、黄棕色、客厅核心 | "中央属土——客厅核心区稳重大气，全家气场稳" |

