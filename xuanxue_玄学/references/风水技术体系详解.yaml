## 风水核心概念框架

### 基本原理

| 概念 | 定义 | 创作切入角度 |
|------|------|-------------|
| 气 | 风水核心概念，指环境中的能量流动 | "风水研究的不是'气'这个玄的东西，是环境中能量的流动方向——阳光、风向、水流，都是气的具体形态" |
| 阴阳 | 环境中阴阳平衡（光线明暗、空间动静） | "好风水的核心是阴阳平衡——不是越亮越好，也不是越暗越好，是白天有光晚上能歇" |
| 五行 | 空间中的五行元素分布（木家具、火灶台、土墙面、金电器、水管路） | "你家每个角落都有五行属性——厨房属火、卧室属木、卫生间属水，布局对了五行就流通" |
| 方位 | 二十四山方位体系（360度分24个15度区间） | "风水看方位不是简单的'坐北朝南'——是24个细分方向，每个方向气场不同" |
| 形势 | 环境的外形特征（山脉、水流、建筑形状） | "形势派看风水：先看地形再看内部——房子外形不好，里面再摆也有限" |
| 理气 | 空间中的气场计算（飞星、九宫、命卦） | "理气派看风水：用数学计算气场——同一个房间，不同年份飞星不同，运势跟着变" |

