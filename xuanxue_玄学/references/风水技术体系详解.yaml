## 风水两大流派详解

### 形势派（看外形）

| 要素 | 核心内容 | 创作切入角度 |
|------|---------|-------------|
| 山（龙） | 地形走势如龙脉，山势起伏代表气场流动 | "古人说'龙脉'不是神话——是地形走势影响气流方向，城市规划师也在用" |
| 水（砂） | 水流方向和形态决定气的聚散 | "水聚则气聚——为什么河边城市多繁华？因为水聚气，气聚人，人聚财" |
| 穴 | 最佳选址点（气聚之处） | "穴不是随便选的——是山水交汇处气场最强的那个点" |
| 明堂 | 前方开阔空间（前景） | "明堂开阔=前景开阔——你的办公桌前面最好别堆东西，给自己留个'前景'" |

### 理气派（算气场）

| 要素 | 核心内容 | 创作切入角度 |
|------|---------|-------------|
| 玄空飞星 | 按时间计算九星飞布方位（每年飞星位置不同） | "玄空飞星像给房间做年度体检——每年气场分布变了，布局跟着调" |
| 八宅明镜 | 按命卦分东四宅/西四宅，匹配个人吉凶方位 | "八宅明镜简单实用：先算你是东四命还是西四命，再选对的方位睡觉办公" |
| 杨公风水 | 形势+理气综合体系（杨筠松创立） | "杨公风水是形势理气合一的体系——最接近风水全貌的流派" |

