## 风水创作选题公式

### 公式1: 场景+方位型
"{场景}的{方位}风水：{效果描述}" → "卧室东方放绿植：助学业助成长"

### 公式2: 禁忌+化解型
"{场景}风水禁忌：{禁忌描述}+{化解方法}" → "办公室风水禁忌：横梁压顶怎么化解"

### 公式3: 流年+方位型
"{年份}流年飞星：{方位运势解读}" → "2026年九紫星到正南：财运旺位怎么布局"

### 公式4: 品类+五行型
"{品类}的五行布局法：{具体操作}" → "客厅五行布局法：中央土稳、东木、南火"

### 公式5: 拆解+对比型
"形势派vs理气派：看风水到底该看什么" → "看风水先看地形还是先算飞星？两派逻辑拆解"