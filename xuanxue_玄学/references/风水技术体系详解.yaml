## 玄空飞星简明指南（L3受众）

| 概念 | 说明 | 创作切入角度 |
|------|------|-------------|
| 九星 | 一白到九紫，每年飞布不同方位 | "九星像9个打工仔——每年换岗位，你得知道今年谁在你家哪个角落上班" |
| 当运星 | 当前20年大运的主星（2024-2043为九运） | "九运期间九紫星当令——正南方是旺位，布局重点在南" |
| 流年飞星 | 每年九星飞布变化 | "2026年飞星分布变了——哪个方位旺财哪个方位要小心" |
| 五黄煞 | 每年五黄星飞到的方位忌动 | "五黄到了哪个方位，那个角落今年别装修别动——安静就好" |
| 二黑煞 | 每年二黑星飞到的方位忌动 | "二黑方位注意健康——那个角落保持干净整洁" |

