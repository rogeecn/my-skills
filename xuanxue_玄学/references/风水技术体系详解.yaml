# 风水技术体系详解

> 何时读取: 创作风水品类深度内容时；需要技术细节支撑时；L2-L3受众内容创作
> 数据来源: Wikipedia风水词条 + firecrawl搜索结果蒸馏 + 搜狗微信搜索竞品数据

