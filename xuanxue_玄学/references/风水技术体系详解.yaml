## 办公室风水实操指南

| 要素 | 操作 | 创作切入角度 |
|------|------|-------------|
| 座位方位 | 背靠实墙，面朝门口（但不能正对门） | "背后有靠=有人撑你，面朝门口=看得见机会" |
| 桌面布局 | 左高右低，左动右静 | "青龙位放电脑文件（动），白虎位放水杯笔筒（静）" |
| 植物选择 | 左侧放阔叶绿植，不放仙人掌 | "阔叶植物纳气聚财——仙人掌散气带刺，职场慎用" |
| 照明 | 头顶灯不要直射桌面 | "头顶灯太亮=心浮气躁——柔和照明=专注沉稳" |
| 避讳 | 不坐横梁下，不对楼梯口 | "横梁压顶=压力大，楼梯口冲=气场散" |

