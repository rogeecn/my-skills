## 易学三大流派

| 流派 | 核心 | 代表人物 | 创作切入角度 |
|------|------|---------|-------------|
| 象数派 | 以卦象和数字推演为主 | 汉易（京房、郑玄） | "象数派是周易的'数学家'——用符号和推算看规律" |
| 义理派 | 以哲学义理阐发为主 | 宋易（程颐、朱熹） | "义理派是周易的'哲学家'——看重卦背后的道理" |
| 象数理占合一 | 综合象数义理与占卜实践 | 现代易学研究者 | "最好的学易方式：象数理占缺一不可——看象、明理、知数、善占" |

