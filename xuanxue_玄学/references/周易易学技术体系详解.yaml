## 经典书目库

| 书名 | 适读阶段 | 核心价值 | 创作切入角度 |
|------|---------|---------|-------------|
| 《周易原文》 | 入门后 | 原典必读 | "读周易原文不是背古文，是看古人怎么给处境分类" |
| 《易传》（十翼） | 基础阶段 | 卦象解读的钥匙 | "没有易传，周易就是一堆符号——易传给你翻译了" |
| 黄寿祺《周易译注》 | 入门-基础 | 最权威的现代注本 | "入门第一本：黄寿祺的译注，白话翻译+学术严谨" |
| 朱熹《周易本义》 | 基础-进阶 | 义理派经典 | "朱熹不是把周易神秘化，是帮你看到卦背后的道理" |
| 尚秉和《周易尚氏学》 | 进阶 | 象数派经典 | "象数派的解读方式——用符号推算，不是用道理猜测" |
| 刘大钧《周易概论》 | 入门 | 现代易学入门必读 | "刘大钧教授写的概论，最适合现代读者入门" |