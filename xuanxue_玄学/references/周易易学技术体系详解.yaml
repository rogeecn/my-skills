# 周易易学技术体系详解

> 何时读取: 创作易学/周易品类深度内容时；需要技术细节支撑时；L3-L5受众内容创作
> 数据来源: Wikipedia易经词条 + firecrawl搜索结果蒸馏

---

## 周易核心概念框架

### 基本结构

| 概念 | 定义 | 创作切入角度 |
|------|------|-------------|
| 易 | 三层含义：变易（变化）、简易（规律可简化）、不易（变中有不变） | "易不是'玄'，是帮你看到变化的规律——看到规律就能顺势而为" |
| 阴阳 | 万物由阴阳二气构成，阳爻（—）、阴爻（--） | "阴阳不是对立，是互补——白天黑夜不是打架，是轮班" |
| 八卦 | 乾坎艮震巽离坤兑，由三爻组成，代表8种基本自然现象 | "八卦是古人给宇宙做的8个分类标签——天、水、山、雷、风、火、地、泽" |
| 六十四卦 | 八卦相叠成64卦，每卦有卦辞和爻辞 | "64卦不是64种命运，是64种处境+64种应对策略" |
| 卦辞 | 每卦的总判断词（如：乾，元亨利贞） | "卦辞像一篇文章的摘要——看完卦辞就知道这卦在说什么处境" |
| 爻辞 | 每卦6爻，每爻有具体判断词 | "爻辞是同一处境下的6个阶段——从初爻到上爻，处境在演进" |

### 八卦详解（创作素材库）

| 卦名 | 自然象 | 人事象 | 卦德 | 创作切入角度 |
|------|--------|--------|------|-------------|
| 乾 | 天 | 创造/领导 | 刚健 | "乾卦教你：什么时候该主动出击" |
| 坤 | 地 | 包容/承载 | 柔顺 | "坤卦教你：什么时候该耐心等待" |
| 坎 | 水 | 险难/困局 | 智慧 | "坎卦不是说你完了，是说你在深水区——要冷静别慌" |
| 离 | 火 | 文明/依附 | 明辨 | "离卦提醒：光太亮的时候要注意别被灼伤" |
| 震 | 雷 | 变动/惊醒 | 行动 | "震卦像突然的电话——提醒你该动了" |
| 巽 | 风 | 渗入/渐进 | 柔入 | "巽卦教你：有些变化不是一瞬间，是慢慢渗透的" |
| 艮 | 山 | 停止/稳固 | 镇定 | "艮卦说：停一下不是放弃，是在等对的时机" |
| 兑 | 泽 | 喜悦/交流 | 和悦 | "兑卦是周易里最开心的一卦——适合写好运降临的内容" |

### 六十四卦选题方向（高频创作用）

| 类别 | 代表卦 | 选题方向 | 受众 |
|------|--------|---------|------|
| 事业起步 | 乾卦/大畜卦 | "什么时候该主动出击/蓄力等待" | L2-L3 |
| 困局应对 | 坎卦/蹇卦/困卦 | "低谷期的周易应对策略" | L2 |
| 转机捕捉 | 震卦/复卦/渐卦 | "变化来临如何顺势而为" | L2 |
| 稳守蓄力 | 艮卦/坤卦/谦卦 | "守得住才能冲得远" | L2-L4 |
| 好运延续 | 兑卦/泰卦/丰卦 | "运势好时如何拉满" | L1-L2 |
| 婚恋感情 | 姤卦/家人卦/咸卦 | "周易看感情：缘分和选择" | L1-L2 |

