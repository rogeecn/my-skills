## 情感触发词（7类）

### 通用情感触发词（4类）

| 类别 | 触发词列表 |
|------|-----------|
| 好奇感 | 你不知道、真相、揭秘、背后、原来 |
| 焦虑感 | 千万别、注意、警示、禁忌、提醒、避开 |
| 期待感 | 必看、必读、终于、来了、惊喜、旺运 |
| 行动感 | 3步、5个、教你、帮你、怎么、攻略 |

### 玄学特有情感触发词（3类）

| 类别 | 触发词列表 |
|------|-----------|
| 破局感 | 破局、转折、转机、逆转、低谷是蓄力期 |
| 玄妙感 | 玄学提醒、命理真相、运势密码、五行能量、暗藏 |
| 宿命感 | 命定、业力、因果、缘分、天意、命中注定、注定 |

**注意：宿命感触发词必须搭配"可改"的角度使用，禁止单独使用制造宿命论绝对化**