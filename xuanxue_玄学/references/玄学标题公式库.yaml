# 玄学标题公式库

> 何时读取: 创作标题时选择公式；标题优化时参考情感触发词

---

## 标题公式（20种）

### 通用公式（10种）

| # | 公式名称 | 结构模板 | 适用品类 | 适用受众 | 示例 |
|---|---------|---------|---------|---------|------|
| 1 | 好奇引诱型 | "你不知道的{品类}{真相}" | 命理/风水 | L1-L2 | "你不知道的八字真相：同一天生的人命运完全不同" |
| 2 | 痛点解决型 | "{痛点}怎么办？{品类}帮你{方向}" | 转运/运势 | L2 | "运势低谷怎么办？3步玄学改运法亲测有效" |
| 3 | 反常识型 | "你以为{常识}？其实{反常识}" | 全品类 | L1-L3 | "你以为风水只是摆摆东西？其实暗藏五行生克逻辑" |
| 4 | 数字清单型 | "{数字}个{品类}{关键词}，{效果}" | 转运/风水 | L1-L2 | "5个家居风水禁忌，你家至少犯了2个" |
| 5 | 对比选择型 | "{A}vs{B}：哪个更适合你？" | 命理/占星 | L3 | "八字vs紫微斗数：哪个更适合你学？" |
| 6 | 时令刚需型 | "{时令}{品类}{关键词}" | 运势/择日 | L1-L2 | "2026蛇年运势解读：属蛇人必看" |
| 7 | 故事引入型 | "那个{经历}的人，{品类}告诉了他{结论}" | 命理/修行 | L2-L4 | "那个被裁员的人，命理告诉了他这是蓄力期" |
| 8 | 禁忌警示型 | "{品类}提醒：这{数字}件事千万别做" | 风水/择日 | L1-L2 | "玄学提醒：别人送你这两样东西，真不能要" |
| 9 | 系列标记型 | "{品类}第{N}期：{具体内容}" | 全品类 | L3 | "八字入门第5课：如何看懂日柱" |
| 10 | 终极追问型 | "{终极问题}：{品类}的{角度}答案" | 修行/文化 | L4-L5 | "命能改吗？修行者的真实答案" |

### 玄学特有公式（10种）

| # | 公式名称 | 结构模板 | 适用品类 | 适用受众 | 示例 |
|---|---------|---------|---------|---------|------|
| 11 | 玄学提醒型 | "玄学提醒：{提醒内容}" | 转运/禁忌 | L1-L2 | "玄学提醒：允许一切发生，凡事发生皆有利于我" |
| 12 | 旺自己型 | "玄学上如何{旺运词}" | 转运 | L1-L2 | "玄学上如何旺自己？" |
| 13 | 命理揭秘型 | "命理真相：{揭秘内容}" | 命理 | L2-L3 | "命理真相：你的八字藏着你不知道的事业密码" |
| 14 | 破局型 | "{困境}破局：{品类}教你{方法}" | 命理/转运 | L2-L3 | "事业低谷破局：八字教你找到转机时机" |
| 15 | 五行能量型 | "五行{属性}人{效果/方法}" | 命理/转运 | L1-L2 | "五行火人今年运势最旺，做好这3件事更上一层楼" |
| 16 | 星座运势型 | "{星座/生肖}{时间段}{运势词}" | 运势/占星 | L1 | "天秤座本周运势：感情有惊喜" |
| 17 | 开运物型 | "玄学{开运物}：{效果描述}" | 转运 | L1-L2 | "玄学小妙招：招财硬币放在这个位置最有效" |
| 18 | 运势预警型 | "注意！{时间段}{生肖/星座}{预警内容}" | 运势 | L1-L2 | "注意！下周这几个生肖运势有波动" |
| 19 | 因果业力型 | "当你有{征兆}，说明{因果结论}" | 修行 | L3-L4 | "当你有这3个征兆，说明你的业力越来越轻" |
| 20 | 命运哲学型 | "{命运话题}：{玄学角度}怎么看" | 修行/文化 | L4-L5 | "命运与自由意志：道家怎么看" |

