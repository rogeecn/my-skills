# 玄学内容系列模板

> 何时读取: 规划内容系列时；安排排期表；启动创作流程

---

## 系列类型（3种）

### 类型1: 时令系列

定义: 围绕节气/节日/玄学专项日策划的连续内容

系列名称模板: "{时令}玄学指南系列"

排期格式:
| 期数 | 发布日期 | 时令锚点 | 选题 | 品类 | 受众 |
|------|---------|---------|------|------|------|
| 1 | W5 | 春节前 | 2026蛇年运势总览 | 运势解读 | L1-L2 |
| 2 | W5 | 春节前 | 属蛇人年运详解 | 运势解读 | L1-L2 |
| 3 | W6 | 春节 | 春节禁忌+开运指南 | 风水生活 | L2 |
| 4 | W6 | 春节 | 新年转运壁纸系列 | 转运指南 | L1 |

示例系列: "2026春节开运指南"（5期，春节前2周+春节周）

### 类型2: 主题系列

定义: 围绕一个核心主题深度展开的连续内容

系列名称模板: "{主题}深度解读系列"

排期格式:
| 期数 | 发布日期 | 主题角度 | 选题 | 品类 | 受众 |
|------|---------|---------|------|------|------|
| 1 | 周一 | 基础概念 | 八字是什么？一图看懂 | 命理术数 | L3 |
| 2 | 周三 | 实操入门 | 手把手教你排八字 | 命理术数 | L3 |
| 3 | 周五 | 应用场景 | 八字看事业方向 | 命理术数 | L2-L3 |
| 4 | 下周一 | 进阶思考 | 八字的哲学含义 | 命理术数 | L4-L5 |

示例系列: "八字入门7步走"（7期，每周2篇，持续3.5周）

### 类型3: 事件系列

定义: 围绕热点事件/社会现象策划的快速响应内容

系列名称模板: "{事件}玄学解读系列"

排期格式:
| 期数 | 发布日期 | 事件角度 | 选题 | 品类 | 受众 |
|------|---------|---------|------|------|------|
| 1 | 事件当天 | 快速解读 | {事件}的玄学视角 | 文化溯源 | L1-L2 |
| 2 | 事件后2天 | 深度分析 | 从{事件}看{品类}原理 | 命理/易学 | L3 |
| 3 | 事件后5天 | 实操建议 | {事件}后如何用玄学调整 | 转运指南 | L2 |

示例系列: "年轻人玄学消费热解读"（3期，事件响应型）

---

## 创作流程

### Step 1: 确认系列类型和目标

- 选择系列类型（时令/主题/事件）
- 确定目标受众层级
- 确定品类组合
- 填写排期表

### Step 2: 选题细化

- 从品类交叉矩阵选择交叉组合
- 从标题公式库选择公式
- 从受众画像确认切入角度
- 从叙事模板选择叙事大纲

### Step 3: 内容创作

- 按写作风格库选择手法
- 按正向叙事模板确保基调正确
- 按平台适配指南调整形式

### Step 4: 去重检查

- 对照content_history.json检查近30篇记录
- 确认选题/角度/标题未重复
- 创作完成后追加记录

### Step 5: 发布与复盘

- 按排期表发布
- 记录阅读数据
- 复盘：哪些选题效果好、哪些受众反响大