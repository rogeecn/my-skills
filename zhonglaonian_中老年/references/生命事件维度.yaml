# 生命事件维度 — 中老年内容选题的突发事件触发器
# 用途：与C_时令周期并列，作为C2_生命事件维度，捕捉非节令驱动的流量爆发点

维度定义:
  C2_生命事件:
    来源: 本文件
    元素数量: 15
    取值方式: 事件触发型——当用户或其受众正在经历某事件时优先选取

    各事件属性:
      正式退休日:
        适用年龄段: [45-60, 55-70]
        内容调性: [共鸣, 赋能, 好奇]
        品类关联: [退休适应, 退休理财, 退休生活, 人生感悟]
        情感关键词: [自由, 空落, 新开始, 第二人生]
        典型选题方向: "退休第一天怎么过不慌", "退休后才明白的事", "退休后怎么重建生活节奏"
        流量强度: 极高（个人身份巨变，内容需求爆发期持续1-3个月）

      第一次带孙子:
        适用年龄段: [55-70]
        内容调性: [温暖, 实用, 共鸣]
        品类关联: [隔代教育, 婆媳相处, 家庭关系, 健康养生]
        情感关键词: [喜悦, 累, 责任, 甜蜜负担]
        典型选题方向: "第一次带孙子手忙脚乱怎么办", "带孙子和媳妇教育分歧怎么处", "带孙也能照顾好自己的身体"
        流量强度: 高（角色叠加，持续3-6个月）

      老伴住院出院:
        适用年龄段: [55-70, 65-80]
        内容调性: [实用, 权威, 温暖, 赋能]
        品类关联: [常见病防治, 日常养生, 退休理财, 家庭关系]
        情感关键词: [担忧, 照顾, 康复, 一起扛]
        典型选题方向: "老伴出院后居家护理怎么做", "照顾住院老伴怎么不把自己累垮", "老伴出院后的饮食调理清单"
        流量强度: 极高（家庭紧急事件，需求爆发持续1-2个月）

      子女结婚:
        适用年龄段: [45-60, 55-70]
        内容调性: [温暖, 实用, 共鸣]
        品类关联: [家庭关系, 消费观, 仪式感生活, 人生感悟]
        情感关键词: [放手, 欣慰, 空巢, 新关系]
        典型选题方向: "子女结婚后怎么重新和老伴相处", "子女婚礼上父母该说什么", "孩子成家了，我的生活怎么调整"
        流量强度: 高（家庭结构变化，持续2-4个月）

      子女离婚:
        适用年龄段: [55-70, 65-80]
        内容调性: [共鸣, 温暖, 实用]
        品类关联: [家庭关系, 空巢心态, 社交情感, 退休理财]
        情感关键词: [心疼, 无力, 重新接纳, 照顾]
        典型选题方向: "子女离婚后老人怎么调整心态", "帮子女带离婚后的孙辈怎么办", "孩子离了婚我的养老计划要变吗"
        流量强度: 中高（敏感但刚需，需温暖基调）

      搬新家/换城市:
        适用年龄段: [45-60, 55-70]
        内容调性: [赋能, 实用, 好奇]
        品类关联: [退休适应, 社区融入, 居家生活优化, 实用技能]
        情感关键词: [新环境, 不适应, 重新开始, 探索]
        典型选题方向: "退休后搬到新城市怎么融入社区", "新小区里的第一次社交怎么自然地开始", "搬家后老人最需要的3样东西"
        流量强度: 中（生活重建需求，持续3-6个月）

      丧偶:
        适用年龄段: [65-80, 55-70]
        内容调性: [温暖, 共鸣, 赋能]
        品类关联: [孤独感应对, 社交情感, 退休理财, 人生感悟]
        情感关键词: [思念, 孤独, 慢慢走出来, 陪伴]
        典型选题方向: "老伴走了以后怎么过好每一天", "一个人吃饭也能好好吃", "老朋友怎么帮你走出来"
        流量强度: 极高（情感刚需，持续6-12个月，需极度温暖和谨慎的基调）

      体检出指标异常:
        适用年龄段: [45-60, 55-70, 65-80]
        内容调性: [权威, 实用, 赋能]
        品类关联: [常见病防治, 饮食调理, 运动健身, 退休理财]
        情感关键词: [慌, 稳住, 可以管, 不怕]
        典型选题方向: "体检发现血糖偏高怎么稳住不慌", "血压高了不一定就要吃药", "体检报告上这几个词别吓自己"
        流量强度: 极高（健康焦虑爆发，持续1-3个月）

      首次使用智能手机关键功能:
        适用年龄段: [55-70, 65-80]
        内容调性: [赋能, 实用, 好奇]
        品类关联: [智能手机使用, 线上购物, 防诈骗指南, 出行攻略]
        情感关键词: [学会了, 原来不难, 老也能学, 自立]
        典型选题方向: "第一次用手机挂号怎么做", "学会手机买菜以后不用跑市场", "手机上怎么安全转账不被骗"
        流量强度: 中（技能门槛突破，持续1-3个月）

      被诈骗/差点被骗:
        适用年龄段: [55-70, 65-80]
        内容调性: [权威, 赋能, 实用]
        品类关联: [防诈骗指南, 实用技能, 退休理财, 心理健康]
        情感关键词: [警惕, 防住, 不再怕, 智慧]
        典型选题方向: "差点被骗！老年人最容易上当的3种套路", "被骗后怎么挽回和调整心态", "识别诈骗短信的5个诀窍"
        流量强度: 高（恐惧驱动+赋能需求，持续3-6个月）

      孙辈入学/升学:
        适用年龄段: [55-70]
        内容调性: [实用, 共鸣, 温暖]
        品类关联: [隔代教育, 子女沟通, 家庭关系]
        情感关键词: [操心, 新节奏, 交接, 长大了]
        典型选题方向: "孙辈入学后老人生活怎么调整", "上学接送怎么安排不累", "孩子上学了老人终于有自己的时间了"
        流量强度: 中（节奏调整，持续1-3个月）

      开始学一项新技能/兴趣:
        适用年龄段: [45-60, 55-70, 65-80]
        内容调性: [赋能, 好奇, 温暖]
        品类关联: [新技能学习, 兴趣娱乐, 社交情感, 退休适应]
        情感关键词: [学会, 有意思, 交新朋友, 活力]
        典型选题方向: "退休后学书法3个月的心路历程", "50岁学摄影比年轻人还拍得好", "学太极第100天的变化"
        流量强度: 中（个人成长叙事，持续3-12个月）

      社区活动首次参与:
        适用年龄段: [55-70, 65-80]
        内容调性: [赋能, 温暖, 好奇]
        品类关联: [社区融入, 老年交友, 兴趣娱乐, 社交情感]
        情感关键词: [走出来, 一起, 被接纳, 不孤单]
        典型选题方向: "第一次去社区活动中心的感受", "怎么自然地加入老年合唱团", "走出家门交到第一个新朋友"
        流量强度: 中（社交突破，持续1-3个月）

      住院康复出院:
        适用年龄段: [65-80, 55-70]
        内容调性: [实用, 赋能, 温暖]
        品类关联: [常见病防治, 饮食调理, 运动健身, 居家生活优化]
        情感关键词: [慢慢好, 不急, 可以恢复, 再来]
        典型选题方向: "出院后怎么在家做康复锻炼", "出院后饮食从流食到正常怎么过渡", "出院后第一次出门散步的感受"
        流量强度: 高（康复刚需，持续1-3个月）

      退休后第一次长途旅行:
        适用年龄段: [45-60, 55-70]
        内容调性: [赋能, 好奇, 温暖]
        品类关联: [旅游出行, 退休适应, 兴趣娱乐, 人生感悟]
        情感关键词: [出发, 自由, 发现, 新视野]
        典型选题方向: "退休后第一次长途旅行怎么规划", "60岁自驾游比年轻时还爽", "第一次出国旅行的准备清单"
        流量强度: 中高（生活方式突破，持续1-3个月）

  时令与生命事件叠加规则:
    规则: "C_时令 + C2_生命事件 → 双触发选题，时令提供养生方向，事件提供情感切入"
    示例: "冬至 + 老伴住院出院 → '老伴出院后冬天怎么在家做康复护理'"
    示例: "春节窗口 + 丧偶 → '过年一个人怎么过也能温暖'"
    示例: "立夏 + 正式退休日 → '退休后的第一个夏天怎么过不慌'"
    示例: "重阳窗口 + 第一次带孙子 → '重阳节带孙子去看老朋友']"

    优先级规则: "生命事件优先级高于时令——当用户正在经历生命事件时，即使时令不匹配也优先选取事件相关选题"