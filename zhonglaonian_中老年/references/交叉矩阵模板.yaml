# 交叉矩阵模板 — 中老年内容素材自动生成规格
# 用途：定义维度×元素的交叉规则，用于批量推导每条素材的5个字段
# 不含具体素材内容，仅含交叉逻辑和维度定义

维度定义:
  A_子品类:
    来源文件: 关键词矩阵/长尾关键词总表.yaml
    元素数量: 42
    取值方式: 从一级品类.二级子品类遍历取key
    示例取值: [中医养生, 常见病防治, 运动健身, 睡眠改善, 饮食调理, 心理健康, 季节养生,
               婆媳相处, 夫妻关系, 子女沟通, 隔代教育, 空巢心态, 家庭矛盾化解,
               退休适应, 闲适生活, 回忆怀旧, 人生感悟, 日常闲聊, 仪式感生活,
               智能手机使用, 防诈骗指南, 线上购物, 出行攻略, 政务办理, 新技能学习,
               旅游出行, 美食烹饪, 手工园艺, 棋牌文化, 广场舞运动, 摄影书画,
               养老金规划, 退休理财, 房产安排, 保险选择, 消费观, 遗产规划,
               老年交友, 孤独感应对, 婚恋再出发, 社区融入, 代际社交, 情感表达]

  B_年龄段:
    来源文件: 关键词矩阵/年龄段偏好矩阵.yaml
    元素数量: 3
    取值方式: 固定三档
    取值: [45-60, 55-70, 65-80]
    各档属性映射:
      45-60:
        核心心态: "我不想变老，还能做很多事"
        内容调性偏好: [权威知识, 轻松娱乐]
        内容形式偏好: "短视频3-5分钟，节奏明快"
        信任来源偏好: [医院专家, 知名媒体, 同龄人经验]
        切入模式: "预防/规划/探索"
      55-70:
        核心心态: "我在适应新生活，需要实用指导"
        内容调性偏好: [实用指导, 权威知识, 情感共鸣]
        内容形式偏好: "短视频1-3分钟，节奏中速，大字字幕"
        信任来源偏好: [医生, 官方, 同龄人, 子女推荐]
        切入模式: "管理/适应/处理"
      65-80:
        核心心态: "我需要陪伴，需要简单可行的方法"
        内容调性偏好: [情感共鸣, 实用指导]
        内容形式偏好: "短视频1-2分钟，语速慢，大字幕"
        信任来源偏好: [医生, 子女, 老朋友, 熟人推荐]
        切入模式: "应对/维系/支撑"

  C_时令周期:
    来源文件: 参考资料/全年节令日历.yaml
    元素数量: 26
    取值方式: 24节气 + 2个关键节日窗口
    取值: [立春, 雨水, 惊蛰, 春分, 清明, 谷雨,
           立夏, 小满, 芒种, 夏至, 小暑, 大暑,
           立秋, 处暑, 白露, 秋分, 寒露, 霜降,
           立冬, 小雪, 大雪, 冬至, 小寒, 大寒,
           春节窗口, 重阳窗口]
    各元素属性:
      立春: {季节: 春, 养生方向: 养肝, 饮食关键词: [绿色蔬菜, 春笋, 荠菜], 情感关键词: [新年开始, 万物复苏]}
      雨水: {季节: 春, 养生方向: 祛湿, 饮食关键词: [薏米, 红豆, 山药], 情感关键词: [春雨润物, 新的开始]}
      惊蛰: {季节: 春, 养生方向: 疏肝理气, 饮食关键词: [清淡, 菊花茶, 枸杞], 情感关键词: [万物萌动, 活力复苏]}
      春分: {季节: 春, 养生方向: 阴阳平衡, 饮食关键词: [均衡, 豆类, 绿叶菜], 情感关键词: [平衡, 调和, 中正]}
      清明: {季节: 春, 养生方向: 清肝明目, 饮食关键词: [清淡, 菊花, 绿茶], 情感关键词: [怀念, 珍惜, 踏青]}
      谷雨: {季节: 春, 养生方向: 祛湿养脾, 饮食关键词: [薏米, 茼蒿, 香椿], 情感关键词: [春末, 准备入夏]}
      立夏: {季节: 夏, 养生方向: 养心, 饮食关键词: [清淡, 苦瓜, 绿豆], 情感关键词: [热情, 活力]}
      小满: {季节: 夏, 养生方向: 祛湿养心, 饮食关键词: [薏米, 苦瓜, 冬瓜], 情感关键词: [适度, 不贪多]}
      芒种: {季节: 夏, 养生方向: 清热祛湿, 饮食关键词: [绿豆汤, 西瓜, 冬瓜], 情感关键词: [忙碌, 收获前]}
      夏至: {季节: 夏, 养生方向: 养心安神, 饀食关键词: [莲子, 百合, 绿豆], 情感关键词: [最热, 安静内心]}
      小暑: {季节: 夏, 养生方向: 防暑降温, 饮食关键词: [西瓜, 绿豆, 薄荷], 情感关键词: [避暑, 安心]}
      大暑: {季节: 夏, 养生方向: 防暑消暑, 饮食关键词: [西瓜, 绿豆薏米, 酸梅汤], 情感关键词: [极热, 家里待着]}
      立秋: {季节: 秋, 养生方向: 滋阴润燥, 饮食关键词: [银耳, 百合, 雪梨], 情感关键词: [凉爽, 新的开始]}
      处暑: {季节: 秋, 养生方向: 润燥养肺, 饮食关键词: [莲藕, 百合, 秋梨], 情感关键词: [暑气消, 秋凉来]}
      白露: {季节: 秋, 养生方向: 防秋燥, 饀食关键词: [银耳, 雪梨, 百合], 情感关键词: [晨露, 温柔过渡]}
      秋分: {季节: 秋, 养生方向: 阴阳平衡润燥, 饮食关键词: [山药, 莲藕, 银耳], 情感关键词: [平衡, 收获, 感恩]}
      寒露: {季节: 秋, 养生方向: 温补防寒, 饮食关键词: [红枣, 核桃, 羊肉], 情感关键词: [秋深, 准备过冬]}
      霜降: {季节: 秋, 养生方向: 温补润燥, 饮食关键词: [红薯, 核桃, 柿子], 情感关键词: [秋冬交替, 最后秋景]}
      立冬: {季节: 冬, 养生方向: 冬补开始, 饮食关键词: [羊肉, 红枣, 枸杞], 情感关键词: [入冬, 开始储备]}
      小雪: {季节: 冬, 养生方向: 温补防寒, 饮食关键词: [羊肉汤, 红枣粥, 核桃], 情感关键词: [初寒, 家里温暖]}
      大雪: {季节: 冬, 养生方向: 冬补加强, 饀食关键词: [当归羊肉, 红枣枸杞粥, 黑芝麻], 情感关键词: [大雪, 家里最暖]}
      冬至: {季节: 冬, 养生方向: 冬补冲刺, 饮食关键词: [饺子, 羊肉汤, 红枣], 情感关键词: [最冷, 团圆, 阳气始生]}
      小寒: {季节: 冬, 养生方向: 温补御寒, 饮食关键词: [羊肉, 当归, 红枣], 情感关键词: [寒冷, 注意保暖]}
      大寒: {季节: 冬, 养生方向: 温补收尾, 饮食关键词: [羊肉, 枸杞, 红枣核桃], 情感关键词: [最冷末, 春要来了]}
      春节窗口: {季节: 冬转春, 养生方向: 饮食节制+情感团聚, 饮食关键词: [年货, 饺子, 年糕], 情感关键词: [团圆, 亲情, 新年]}
      重阳窗口: {季节: 秋, 养生方向: 养肺+敬老, 饮食关键词: [菊花茶, 秋梨, 栗子], 情感关键词: [敬老, 陪伴, 登高]}

  D_标题公式:
    来源文件: 参考资料/标题公式库.yaml
    元素数量: 17
    取值方式: 从标题公式库.标题公式遍历取key
    取值: [年龄必知型, 数字痛点型, 身份共鸣型, 疑问好奇型, 对比反常识型,
           温暖情感型, 经验分享型, 身份转变型, 警示后果型, 时代回忆型,
           关系感悟型, 日常发现型, 名人权威型, 对比选择型, 误解纠正型,
           步骤实操型, 状态变化型, 简单高效型]
    各公式属性:
      年龄必知型: {公式模板: "{年龄段}后{必知/必做/千万要}{数字}个{品类关键词}", 适用品类: [健康养生, 实用技能, 退休规划], 适用年龄段: [45-60, 55-70, 65-80], 情感触发: [焦虑, 权威]}
      数字痛点型: {公式模板: "{比例}%的{中老年/老人}{忽略/不知道}{痛点关键词}", 适用品类: [健康养生, 生活常识, 防骗科普], 适用年龄段: [45-60, 55-70], 情感触发: [焦虑, 好奇]}
      身份共鸣型: {公式模板: "{身份状态}后{才明白/终于懂了}{感悟关键词}", 适用品类: [情感故事, 人生感悟, 退休生活], 适用年龄段: [55-70, 65-80], 情感触发: [共鸣, 温暖]}
      疑问好奇型: {公式模板: "为什么{越来越多/很多人}{选择/喜欢}{好奇关键词}？", 适用品类: [健康养生, 生活趋势, 新事物科普], 适用年龄段: [45-60, 55-70], 情感触发: [好奇]}
      对比反常识型: {公式模板: "你以为的{品类词}{其实/反而}{反常识结论}", 适用品类: [健康养生, 生活常识, 防骗科普], 适用年龄段: [45-60, 55-70, 65-80], 情感触发: [好奇, 焦虑]}
      温暖情感型: {公式模板: "{亲情对象}{的一句话/一个动作}{让我泪流满面}", 适用品类: [情感故事, 亲情回忆, 节日温情], 适用年龄段: [55-70, 65-80], 情感触发: [温暖, 共鸣]}
      经验分享型: {公式模板: "我用了{这个方法/习惯}{结果关键词}好了很多", 适用品类: [健康养生, 生活技能, 美食烹饪], 适用年龄段: [55-70, 65-80], 情感触发: [共鸣, 好奇]}
      身份转变型: {公式模板: "从{X身份}到{Y身份}{才}{感悟关键词}", 适用品类: [退休生活, 人生感悟], 适用年龄段: [55-70], 情感触发: [共鸣, 好奇]}
      警示后果型: {公式模板: "{行为}{正在/悄悄}{伤身/毁健康}", 适用品类: [健康养生, 生活常识], 适用年龄段: [45-60, 55-70], 情感触发: [焦虑, 权威]}
      时代回忆型: {公式模板: "{年代}的{人/事}{才知道/还记得}", 适用品类: [怀旧回忆, 人生感悟], 适用年龄段: [55-70, 65-80], 情感触发: [共鸣, 温暖]}
      关系感悟型: {公式模板: "到了{年龄段}{才看清}{关系关键词}的真相", 适用品类: [情感故事, 家庭关系], 适用年龄段: [55-70, 65-80], 情感触发: [共鸣, 温暖]}
      日常发现型: {公式模板: "{日常场景}时{发现}{发现关键词}", 适用品类: [生活常识, 生活技能], 适用年龄段: [45-60, 55-70], 情感触发: [好奇, 共鸣]}
      名人权威型: {公式模板: "{专家/医生}{提醒/警告}{中老年}{关键词}", 适用品类: [健康养生, 生活常识], 适用年龄段: [55-70, 65-80], 情感触发: [权威, 焦虑]}
      对比选择型: {公式模板: "{选项A}还是{选项B}？中老年该选{正确选项}", 适用品类: [健康养生, 退休理财], 适用年龄段: [45-60, 55-70], 情感触发: [好奇, 焦虑]}
      误解纠正型: {公式模板: "很多人都{搞错/以为}的{关键词}{真相是}", 适用品类: [健康养生, 防骗科普], 适用年龄段: [45-60, 55-70, 65-80], 情感触发: [焦虑, 好奇, 权威]}
      步骤实操型: {公式模板: "{数字}步/分钟/个动作搞定{品类关键词}", 适用品类: [生活技能, 美食烹饪, 手机教程], 适用年龄段: [55-70, 65-80], 情感触发: [好奇, 共鸣]}
      简单高效型: {公式模板: "只需/只要{简单条件}{就能}{效果关键词}", 适用品类: [健康养生, 生活技能, 美食烹饪], 适用年龄段: [65-80], 情感触发: [好奇, 共鸣]}
      状态变化型: {公式模板: "从{负面}到{正面}我只做了{数字}个{方法}", 适用品类: [健康养生, 退休生活], 适用年龄段: [45-60, 55-70], 情感触发: [共鸣, 好奇]}

  E_情感触发:
    来源文件: 参考资料/标题公式库.yaml
    元素数量: 5
    取值: [焦虑触发, 共鸣触发, 好奇触发, 权威触发, 温暖触发]
    各触发属性:
      焦虑触发:
        核心词库: [忽略, 危险, 伤身, 后悔, 错过, 亏了, 上当, 悄悄, 正在, 缩短, 毁, 害, 警告, 千万别]
        适用年龄段: [45-60, 55-70]
        适用品类: [健康养生, 防骗科普, 生活常识, 财富理财]
        开头风格: "制造损失感+紧迫感，如'你有没有这样的经历...'"
      共鸣触发:
        核心词库: [才明白, 终于懂了, 原来, 说实话, 心酸, 遗憾, 过来人, 经历过, 深有体会]
        适用年龄段: [55-70, 65-80]
        适用品类: [情感故事, 人生感悟, 退休生活, 家庭关系]
        开头风格: "建立认同感，如'原来不只是我这样...'"
      好奇触发:
        核心词库: [揭秘, 真相, 秘密, 为什么, 竟然, 万万没想到, 到底, 才发现, 神奇]
        适用年龄段: [45-60, 55-70]
        适用品类: [健康养生, 生活常识, 新事物科普, 实用技能]
        开头风格: "制造信息缺口，如'你知道为什么...'"
      权威触发:
        核心词库: [专家说, 医生提醒, 研究证明, 老中医, 主任医师, 官方, 证实]
        适用年龄段: [55-70, 65-80]
        适用品类: [健康养生, 生活常识, 财富理财]
        开头风格: "借权威背书开头，如'XX医生提醒...'"
      温暖触发:
        核心词库: [感动, 泪目, 暖心, 幸福, 珍贵, 珍惜, 感恩, 温情, 思念, 泪流满面, 哭了, 笑了]
        适用年龄段: [55-70, 65-80]
        适用品类: [情感故事, 亲情回忆, 节日温情, 社交情感]
        开头风格: "触发情感记忆，如'那一刻我才明白...'"

  F_平台适配:
    来源文件: 参考资料/平台适配指南.yaml
    元素数量: 6
    取值: [抖音, 快手, 视频号, 公众号, 头条, 小红书]
    各平台属性:
      抖音: {内容形式: "15-60秒口播+字幕", 算法偏好: [完播率, 互动率], 标题风格: "悬念式开头+数字+痛点", 节奏: "快", 字幕: "大字醒目"}
      快手: {内容形式: "1-3分钟方言+接地气", 算法偏好: [社交信任, 评论互动], 标题风格: "接地气+情感金句", 节奏: "中", 字幕: "口语化"}
      视频号: {内容形式: "1-5分钟正能量+养生", 算法偏好: [社交裂变, 转发>点赞], 标题风格: "子女视角+熟人背书", 节奏: "中慢", 字幕: "清晰易懂"}
      公众号: {内容形式: "1200-1500字长文20号字", 算法偏好: [女性标签+转发裂变], 标题风格: "食物方案+情感共鸣", 节奏: "慢", 字幕: "大字号排版"}
      头条: {内容形式: "1800-2000字深度长文", 算法偏好: [男性标签+评论互动], 标题风格: "真相揭秘+数字对比", 节奏: "中", 字幕: "结构化排版"}
      小红书: {内容形式: "9图图文笔记+实测", 算法偏好: [反差感+品质+搜索流量], 标题风格: "代际融合+实测分享", 节奏: "轻快", 字幕: "图片为主文字辅助"}

交叉推导规则:

  选题推导:
    逻辑: "A_子品类 × B_年龄段 → 选题切入点"
    规则: "从年龄段偏好矩阵取该子品类在该年龄段的切入角度，作为选题核心方向"
    示例: "A=睡眠改善 × B=55-70 → 切入角度='管理：日常失眠怎么应对不靠吃药'"
    示例: "A=隔代教育 × B=55-70 → 切入角度='处理：帮带孙和媳妇教育分歧怎么处'"
    示例: "A=回忆怀旧 × B=65-80 → 切入角度='维系：老照片里的回忆让老人不孤独'"
    时令叠加规则: "选题 × C_时令 → 在切入角度基础上叠加时令元素"
    示例: "睡眠改善×55-70×冬至 → '冬天睡不好怎么调理不靠吃药'"
    示例: "回忆怀旧×65-80×春节窗口 → '过年看老照片想起当年的年'"

  标题推导:
    逻辑: "选题 × D_标题公式 × E_情感触发 → 5+标题变体"
    规则: "从标题公式取公式模板，填充选题关键词+年龄段+情感触发词"
    约束: "D和E必须与选题的品类和年龄段兼容（查标题公式的适用品类/适用年龄段字段）"
    生成数量: "每个选题生成5-8个标题变体"
    示例: "选题='冬天睡不好' × D=年龄必知型 × E=焦虑触发 → '55岁后冬天睡不好千万要记住这3个方法'"
    示例: "选题='冬天睡不好' × D=经验分享型 × E=共鸣触发 → '我用了这个方法，冬天终于睡得安稳了'"
    示例: "选题='过年看老照片' × D=时代回忆型 × E=温暖触发 → '70年代的老照片还记得吗？过年翻出来泪目了'"
    示例: "选题='帮带孙和媳妇分歧' × D=身份共鸣型 × E=共鸣触发 → '当婆婆后才明白：帮带孙不是管教是帮忙'"

  大纲推导:
    逻辑: "选题 × B_年龄段 → 大纲框架"
    规则: "根据年龄段偏好矩阵的切入模式，自动选择大纲结构"
    大纲结构库:
      预防/规划/探索型(适合45-60):
        开头: "痛点共鸣+数据引入"
        主体: "3-5个预防/规划方法"
        结尾: "行动建议+互动引导"
      管理/适应/处理型(适合55-70):
        开头: "日常场景引入+共鸣"
        主体: "3-5个实操步骤/管理方法"
        结尾: "清单总结+收藏引导"
      应对/维系/支撑型(适合65-80):
        开头: "情感共鸣+温暖场景"
        主体: "1-3个极简方法+1个情感建议"
        结尾: "鼓励+陪伴感"
    示例: "选题='冬天睡不好' × B=55-70(管理模式) → 开头:'你是不是冬天越冷越睡不着...' 主体:'3个日常调理步骤' 结尾:'今晚试试这个方法'"
    示例: "选题='过年看老照片' × B=65-80(维系模式) → 开头:'过年翻老照片那一刻...' 主体:'1个怀旧+1个联系老友的建议' 结尾:'这些照片背后都是好日子'"

  开头推导:
    逻辑: "选题 × E_情感触发 × B_年龄段 → 开头段落"
    规则: "根据情感触发的开头风格模板，填充选题关键词+年龄段代入词"
    开头风格模板:
      焦虑触发: "你有没有这样的{夜晚/经历/时刻}——{痛点场景描述}...别急，{转折提示}..."
      共鸣触发: "{身份代入}才发现，原来不只是我这样...{共鸣场景}..."
      好奇触发: "你知道为什么{好奇现象}吗？{悬念铺垫}..."
      权威触发: "{权威人物}提醒：{年龄段}后{关键提醒}..."
      温暖触发: "那一刻我才明白，{温暖感悟}...{温暖场景描述}..."
    示例: "选题='冬天睡不好' × E=焦虑触发 × B=55-70 → '你有没有这样的夜晚——躺在床上翻来覆去，越想睡越睡不着...别急，今天分享几个不吃药的方法'"
    示例: "选题='过年看老照片' × E=温暖触发 × B=65-80 → '那一刻我才明白，这些老照片不只是纸片，是一辈子的故事...过年翻出来，每一张都有话说'"

  平台适配推导:
    逻辑: "选题 × F_平台 → 平台适配建议"
    规则: "根据平台属性中的内容形式、标题风格、节奏等，给出该选题在该平台的具体适配方案"
    示例: "选题='冬天睡不好' × F=抖音 → '15秒口播，痛点切入+大字字幕，标题悬念开头'"
    示例: "选题='冬天睡不好' × F=公众号 → '1200字长文，3个方法详述+读者互动评论区，20号字排版'"
    示例: "选题='过年看老照片' × F=视频号 → '3分钟温馨视频，老照片展示+旁白回忆，转发驱动'"

交叉矩阵生成规则:

  主矩阵: A_子品类 × B_年龄段 × C_时令周期
  矩阵规模: 42 × 3 × 26 = 3,276个选题交叉点
  实际需求: 1,095条素材（365天 × 3条/天）

  需求映射策略:
    策略1_均匀覆盖: "3,276个交叉点中按优先级选取1,095个，确保每个子品类×年龄段至少出现8-10次"
    策略2_时令优先: "有C_时令绑定的选题优先选取（约800条），剩余295条从无时令绑定的选题补充"
    策略3_品类权重: "按年龄段偏好矩阵的关注度高/中/低分配选题密度"
      45-60岁_高关注品类: [健康养生, 家庭关系, 生活方式, 兴趣娱乐, 财富理财] → 各分配约55条
      45-60岁_中关注品类: [实用技能, 社交情感] → 各分配约25条
      55-70岁_高关注品类: [健康养生, 家庭关系, 社交情感] → 各分配约55条
      55-70岁_中关注品类: [生活方式, 实用技能, 兴趣娱乐, 财富理财] → 各分配约25条
      65-80岁_高关注品类: [健康养生, 社交情感] → 各分配约55条
      65-80岁_中关注品类: [家庭关系, 兴趣娱乐, 财富理财] → 各分配约25条
      65-80岁_低关注品类: [生活方式, 实用技能] → 各分配约15条

  每条素材的最终格式:
    选题ID: "{A_子品类代号}-{B_年龄段代号}-{C_时令代号或通用}-{序号}"
    一级品类: "{从A_子品类反向映射}"
    二级子品类: "{A_子品类}"
    长尾关键词: "{从长尾关键词总表取该子品类在该年龄段的关键词列表}"
    目标年龄段: "{B_年龄段}"
    时令标签: "{C_时令周期或空}"
    平台适配建议: "{选题 × F_平台推导结果}"
    标题备选5+: "{选题 × D_标题公式 × E_情感触发推导的5-8个标题}"
    大纲框架: "{选题 × B_年龄段推导的大纲结构}"
    开头示例: "{选题 × E_情感触发 × B_年龄段推导的开头段落}"

  兼容性约束:
    约束1: "D_标题公式的适用品类必须包含当前A_子品类所属一级品类"
    约束2: "D_标题公式的适用年龄段必须包含当前B_年龄段"
    约束3: "E_情感触发的适用年龄段必须包含当前B_年龄段"
    约束4: "E_情感触发的适用品类必须包含当前A_子品类所属一级品类"
    约束5: "C_时令的养生方向应与A_子品类有一定关联（如季节养生子品类优先匹配对应节气）"
    约束6: "排除政治和新闻类内容"