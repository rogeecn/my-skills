# 跨品类交叉选题推导规则
# 用途：定义品类间交叉选题的合法组合、推导逻辑和约束

交叉品类组合库:
  # 品类交叉产生创新选题——两个看似不相关的品类碰撞出差异化内容
  # 格式: 品类A × 品类B → 交叉选题方向 + 适配年龄段 + 典型标题示例

  健康养生_x_兴趣娱乐:
    交叉逻辑: "把养生方法嵌入娱乐活动，降低执行门槛，增加趣味性"
    适配年龄段: [45-60, 55-70, 65-80]
    典型组合:
      季节养生_x_手工园艺: "种花治失眠——园艺疗法让老人自然入睡"
      运动健身_x_广场舞运动: "广场舞不仅是娱乐，这3个动作专门练膝盖"
      饮食调理_x_美食烹饪: "这碗养生粥比外卖好吃还养胃"
      常见病防治_x_摄影书画: "学画画的时候手指灵活了——预防关节炎的文艺方法"
    切入角度: "不是苦哈哈地养生，是乐呵呵地做有意思的事，顺便把身体也养了"

  实用技能_x_财富理财:
    交叉逻辑: "用技能操作解决理财恐惧，让抽象概念变成可执行的步骤"
    适配年龄段: [55-70, 65-80]
    典型组合:
      智能手机使用_x_退休理财: "手机上安全买国债的3步操作图解"
      防诈骗指南_x_养老金规划: "识别养老理财骗局的5个特征——守住退休金"
      线上购物_x_消费观: "拼多多上怎么买到便宜又不坑的东西"
      政务办理_x_保险选择: "手机上申请大病医保的完整流程"
    切入角度: "不是教你理财理论，是一步一步在手机上做出来"

  家庭关系_x_兴趣娱乐:
    交叉逻辑: "用共同活动修复/增强家庭关系，让关系问题通过行动解决而非说教"
    适配年龄段: [55-70, 45-60]
    典型组合:
      夫妻关系_x_旅游出行: "和老伴一起学摄影，退休后不吵架了"
      隔代教育_x_手工园艺: "和孙子一起种花的3个月——从吵嘴到配合"
      子女沟通_x_新技能学习: "和女儿一起学短视频剪辑——找到了新的聊天话题"
      婆媳相处_x_美食烹饪: "婆婆教媳妇做家常菜——厨房里的和解"
    切入角度: "不说'要好好沟通'，是给你一件一起做的事，关系自然就好了"

  社交情感_x_健康养生:
    交叉逻辑: "孤独不只是心理问题，社交活动本身就有养生功效——给出证据和行动"
    适配年龄段: [65-80, 55-70]
    典型组合:
      孤独感应对_x_运动健身: "加入太极班3个月后不孤独了——社交运动比吃药还管用"
      社区融入_x_饮食调理: "社区食堂不只是吃饭——每周在这里交到一个新朋友"
      老年交友_x_广场舞运动: "广场舞组里的那几个人比家人还亲"
      婚恋再出发_x_季节养生: "秋天遇见一个新的开始——65岁重新交友的勇气"
    切入角度: "解决情感问题的方法不是讲道理，是给你一个走出家门的具体活动"

  生活方式_x_实用技能:
    交叉逻辑: "退休后的品质生活需要技能支撑，把美好愿景变成可操作的指南"
    适配年龄段: [45-60, 55-70]
    典型组合:
      退休适应_x_智能手机使用: "退休后用手机记录每一天——学会了生活就有了节奏"
      闲适生活_x_出行攻略: "60岁后第一次独自旅行的手机导航指南"
      仪式感生活_x_线上购物: "网上订花送到家——退休后每周给老伴一个惊喜"
      日常闲聊_x_新技能学习: "学会了做短视频——退休生活突然有了观众"
    切入角度: "退休不是闲着，是终于有时间学那些想做但没空做的事"

  社交情感_x_兴趣娱乐:
    交叉逻辑: "娱乐不是打发时间，是社交载体和情感疗愈的双重工具"
    适配年龄段: [65-80, 55-70]
    典型组合:
      孤独感应对_x_摄影书画: "每天画一幅画——不再一个人空等天黑"
      社区融入_x_棋牌文化: "棋牌室里交到的朋友比同事还铁"
      老年交友_x_旅游出行: "老年旅行团不只是旅游——回来多了10个朋友"
      情感表达_x_回忆怀旧: "把老照片做成视频发给老朋友——思念有了去处"
    切入角度: "不是让你去社交，是给你一件好玩的事，朋友自然就来了"

推导规则:
  # 选题推导公式扩展
  基础选题: "A_子品类 × B_年龄段 × C_时令周期"
  事件选题: "A_子品类 × B_年龄段 × C2_生命事件"
  交叉选题: "A1_子品类 × A2_子品类 × B_年龄段 × (C_时令 | C2_生命事件)"

  交叉选题约束:
    约束1: "A1和A2必须属于不同的一级品类（健康养生≠兴趣娱乐），避免伪交叉"
    约束2: "交叉组合必须来自交叉品类组合库中的已定义组合，不可随意搭配"
    约束3: "交叉选题的切入角度必须明确说明品类交叉的价值——为什么两个品类一起比分开更好"
    约束4: "交叉选题的标题必须同时包含两个品类的关键词信号"
    约束5: "交叉选题适用年龄段必须同时满足A1和A2在该年龄段的关注度要求"
    约束6_正文篇幅分配: "交叉选题正文中品类A1和品类A2必须各占至少30%篇幅。大纲主体要点中至少1个专门展开A1方法、至少1个专门展开A2价值。不能只展开一个品类而另一个只做点缀。正文篇幅比例: A1核心内容35-40% + A2核心内容35-40% + 两者连接过渡20-30%"

  每批选题的交叉比例: "3-5个选题中至少1个是跨品类交叉选题，确保创新性"

  标题交叉模式:
    模式A_并列式: "{品类A关键词}不只是{品类A标签}——还是{品类B价值}"
      示例: "广场舞不只是娱乐——这3个动作专门练膝盖"
    模式B_因果式: "{品类B活动}让{品类A问题}好了"
      示例: "和老伴一起学摄影——退休后不吵架了"
    模式C_操作式: "{品类A目标}的{品类B方法}——{具体步骤数}步搞定"
      示例: "手机上安全买国债的3步操作图解"