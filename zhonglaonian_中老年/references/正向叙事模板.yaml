# 正向叙事模板 — 赋能型情感触发和标题公式
# 用途：与焦虑触发并列，提供"获得追求"而非"损失规避"的叙事方向
# 核心理念：中老年内容不应只有恐惧驱动，赋能型叙事对65-80岁尤其重要

赋能型情感触发:
  E2_赋能触发:
    核心词库: [做到了, 学会了, 可以, 不难, 活力, 越来越好, 真正自由, 比想象中, 原来我也能, 新开始, 第二人生, 重新发现, 依然, 还有]
    适用年龄段: [45-60, 55-70, 65-80]
    适用品类: [健康养生, 退休生活, 兴趣娱乐, 实用技能, 社交情感, 人生感悟]
    开头风格: "建立能力感和可能性，如'原来我可以...'、'比想象中更容易...'"
    设计原则: "不制造恐惧，而是展示可能性——把'你不做就会坏'变成'做了就会好'"
    对比示例:
      焦虑版: "55岁后冬天睡不好千万要注意这3个方法"
      赋能版: "冬天睡得好的人都做这3件简单的事"
      焦虑版: "冬天睡不好正在悄悄伤你的心脏"
      赋能版: "学会3个睡前习惯，冬天一觉到天亮比夏天还踏实"

  E2_温暖成就触发:
    核心词库: [做到了, 终于, 真好, 原来这么简单, 别人说我厉害, 才发现不难, 学完很开心, 比年轻时还]
    适用年龄段: [55-70, 65-80]
    适用品类: [实用技能, 兴趣娱乐, 社交情感, 人生感悟]
    开头风格: "分享一个小成就，引发共鸣'原来我也行'"
    设计原则: "用具体的微小成就证明可能性，比宏大的励志更有效"
    对比示例:
      权威版: "医生提醒：65岁后这3件事必须学会"
      成就版: "65岁的她学会了手机挂号——比年轻人还快"
      权威版: "专家说老人不能独居"
      成就版: "一个人住也能过得很舒服——她做到了"

赋能型标题公式:
  # 与D_标题公式并列的D2_赋能公式系列

  可能发现型:
    公式模板: "原来{年龄段}后{品类关键词}{比想象中/竟然}{正面结果}"
    适用品类: [健康养生, 退休生活, 兴趣娱乐, 实用技能]
    适用年龄段: [45-60, 55-70, 65-80]
    情感触发: [赋能]
    对比焦虑版: "年龄必知型"
    示例: "原来60岁后学摄影比想象中更容易"
    示例: "原来退休后比上班时还自由"

  行动成就型:
    公式模板: "{做了一件小事}后{品类关键词}{好了/改善了/不一样了}"
    适用品类: [健康养生, 实用技能, 社交情感]
    适用年龄段: [55-70, 65-80]
    情感触发: [温暖成就]
    示例: "学会手机挂号后看病再也不慌了"
    示例: "加入太极班后膝盖反而比以前灵活了"

  同龄示范型:
    公式模板: "{年龄段}的{某人/一群人}{做到了/正在做}{品类关键词}"
    适用品类: [健康养生, 兴趣娱乐, 实用技能, 社交情感]
    适用年龄段: [55-70, 65-80]
    情感触发: [赋能, 温暖成就]
    示例: "70岁的张阿姨每天画一幅画——不再一个人空等天黑"
    示例: "一群60岁的姐妹自驾游——比年轻时还自由"

  简单可行型:
    公式模板: "{品类关键词}只需/只要{1-3个简单条件}{就能}{正面效果}"
    适用品类: [健康养生, 实用技能, 美食烹饪, 生活技能]
    适用年龄段: [65-80, 55-70]
    情感触发: [赋能]
    示例: "冬天睡得踏实只需睡前做3件小事"
    示例: "血压稳住只要每天走路15分钟就够了"

  重新定义型:
    公式模板: "{年龄段}不是{负面标签}而是{正面定义}"
    适用品类: [退休生活, 人生感悟, 社交情感, 兴趣娱乐]
    适用年龄段: [45-60, 55-70, 65-80]
    情感触发: [赋能]
    示例: "退休不是退出舞台而是换了新舞台"
    示例: "70岁不是老了而是终于有时间做自己"

  对比进步型:
    公式模板: "从{负面状态}到{正面状态}{我/她/他们}{只用了/只做了}{数字}{品类方法}"
    适用品类: [健康养生, 退休生活, 实用技能]
    适用年龄段: [45-60, 55-70]
    情感触发: [赋能, 温暖成就]
    示例: "从睡不着到一觉天亮我只用了3个睡前习惯"
    示例: "从退休迷茫到越活越好我只做了这5个改变"

赋能型大纲结构:
  # 赋能型大纲与焦虑型大纲的关键区别：开头是"你可以"而非"你不注意就会"

  赋能_预防型(适合45-60):
    开头: "可能性展示+同龄人案例：有人已经做到了，你也可以"
    主体: "3-5个具体方法，每个方法附带'做起来有多简单'的证据"
    结尾: "行动邀请+社群归属：'试试看，你会发现比想象中容易'"

  赋能_管理型(适合55-70):
    开头: "小成就展示+方法揭秘：原来搞定这件事不难"
    主体: "3-5个实操步骤，强调'已经有人用这些方法成功了'"
    结尾: "打卡挑战+社区分享：'今天试一个，7天后看效果'"

  赋能_应对型(适合65-80):
    开头: "温暖共鸣+简单可能性：'原来这个小习惯就有这么大的变化'"
    主体: "1-3个极简方法+1个陪伴鼓励：强调'不难，慢慢做就好'"
    结尾: "鼓励+陪伴感：'今天哪怕只做一个，也比昨天好了一点'"

叙事基调选择规则:
  # 如何选择焦虑型 vs 赋能型
  
  默认规则: "健康养生和财富理财品类默认可选焦虑型或赋能型；其他品类优先赋能型"
  
  65-80岁特殊规则: "65-80岁禁止使用纯焦虑触发，必须搭配赋能或温暖成分。如果使用焦虑开头，结尾必须有明确的'你可以做到'转化。原因：纯恐惧叙事对高龄脆弱人群有伦理风险"
  
  55-70岁平衡规则: "55-70岁可使用焦虑开头但必须在中段转为赋能叙事——'痛点→方法→我可以做到'的三段式"
  
  45-60岁灵活规则: "45-60岁可自由选择焦虑或赋能，但同批选题中焦虑型和赋能型各占一半，避免整批内容基调单一"
  
  跨品类交叉选题规则: "跨品类交叉选题一律使用赋能型叙事——因为交叉选题的价值就是'原来还有这种好方法'，焦虑基调与此冲突"
  
  生命事件选题规则: "丧偶类事件一律温暖/共鸣基调，禁止焦虑；住院出院类可焦虑开头+赋能结尾；退休类优先赋能型"