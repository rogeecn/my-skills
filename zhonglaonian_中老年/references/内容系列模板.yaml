# 内容系列/连载规划模板
# 用途：支持批量选题→系列排期的输出模式，一次选题产出一周/一个月的内容排期表

系列类型:
  时令系列:
    名称模板: "{节气/节日}养生{天数}天系列"
    示例: "冬至养生7天系列", "春节健康饮食5天系列", "立夏养心14天计划"
    规则: "每个时令系列覆盖该时令前后{天数}天的每日选题，选题从时令日历中对应周的方向选取"
    选题来源: "references/全年节令日历.yaml + references/交叉矩阵模板.yaml"
    天数范围: [5, 7, 14, 21]
    排期节奏: "每天1篇，按时令强度递减排列（节气当天最强→前后几天衰减）"

  主题系列:
    名称模板: "{核心主题}{天数}天系列"
    示例: "退休适应30天指南", "中老年手机求生7天课", "冬季血压管理14天计划"
    规则: "围绕一个核心主题，按学习/适应的递进逻辑排列——从认知→方法→实操→巩固"
    选题来源: "A_子品类 × B_年龄段 × (C_时令 | C2_生命事件)"
    递进结构:
      第1阶段_认知(占20%): "这是什么问题/为什么重要/有没有希望"
      第2阶段_方法(占40%): "有哪些方法/怎么选适合我的/原理是什么"
      第3阶段_实操(占30%): "今天做什么/一步一步怎么做/常见卡点怎么解"
      第4阶段_巩固(占10%): "坚持了{天数}天的变化/怎么持续/社群分享"

  事件系列:
    名称模板: "{生命事件}应对指南"
    示例: "退休第一个月适应指南", "老伴出院后14天护理计划", "带孙子第一周不崩溃手册"
    规则: "围绕一个生命事件，按时间线排列——从事件当天到适应期结束"
    选题来源: "A_子品类 × B_年龄段 × C2_生命事件"
    时间线结构:
      当天-第3天(紧急期): "应对/稳定/基本操作"
      第4天-第14天(适应期): "建立新节奏/找到方法"
      第15天-第30天(巩固期): "形成习惯/长期规划"

系列排期表格式:
  # 输出到 outputs/YYYY-MM-DD-<series-slug>/series_plan.md
  
  ```markdown
  # {系列名称}

  > 系列类型: {时令/主题/事件} | 总天数: {N} | 目标年龄段: {B} | 起始时令: {C}
  > 创建日期: YYYY-MM-DD | 状态: 进行中/已完成

  ## 排期表

  | 天数 | 日期 | 选题名称 | 目标年龄段 | 品类 | 叙事基调 | 文章状态 |
  |------|------|----------|-----------|------|----------|----------|
  | Day 1 | MM-DD | {选题1} | {B} | {品类} | {焦虑/赋能/温暖} | 待创作 |
  | Day 2 | MM-DD | {选题2} | {B} | {品类} | {焦虑/赋能/温暖} | 待创作 |
  | ... | ... | ... | ... | ... | ... | ... |
  | Day N | MM-DD | {选题N} | {B} | {品类} | {焦虑/赋能/温暖} | 待创作 |

  ## 系列选题推导记录

  > 以下为本系列所有选题的完整推导过程，供去重审核使用。

  ### Day 1: {选题1}
  - 推导公式: A_子品类 × B_年龄段 × (C_时令 | C2_生命事件)
  - 推荐理由: {理由}
  - 长尾关键词: {关键词列表}
  - 品类关注度: {关注度等级}

  ### Day 2: {选题2}
  ...（每个Day都有完整推导记录）

  ## 系列叙事基调规划

  > 本系列整体基调: {焦虑开头→赋能中段→温暖结尾 | 全赋能型 | 温暖陪伴型}

  | 天数 | 基调 | 说明 |
  |------|------|------|
  | Day 1-2 | {基调} | {为什么选这个基调} |
  | Day 3-N | {基调} | {为什么转换基调} |
  ```

系列创作流程:
  步骤1_确认系列类型: "询问用户想做哪种系列（时令/主题/事件），或者从用户描述中推断"
  步骤2_生成排期表: "按系列类型规则生成排期表，保存至 series_plan.md"
  步骤3_逐篇创作: "从Day 1开始，逐篇生成article.md，每篇创作后更新排期表中的文章状态"
  步骤4_去重审核: "每篇创作前，对比近30篇章记录（content_history.json）确保不与近期内容重复"
  步骤5_完成归档: "系列完成后更新排期表状态为已完成"

单篇与系列输出选择:
  默认: "单篇选题→单篇文章"
  系列触发条件: 
    - 用户明确要求"系列"、"连载"、"连续做几天"、"一周内容"
    - 选题涉及生命事件（自动建议事件系列）
    - 用户连续3次选题来自同一品类/同一年龄段（建议做主题系列）
    - 当前处于节气前后7天内（建议做时令系列）