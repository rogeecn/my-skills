# 职场平台适配指南
# 何时读取: 选择发布平台时、调整内容格式时、适配标题风格时

平台适配:
  微信公众号:
    内容形式: "深度长文(1500-3000字) + 短观点文(500-800字)"
    标题风格: "规则揭秘型/反认知型/身份觉醒型为主，15字以内最佳"
    字数规格: "长文1500-3000字，短文500-800字"
    排版特点: "段落短、重点加粗、金句独立成段、配1-3张图"
    发布节奏: "每周2-3篇，1篇长文+1-2篇短观点"
    互动方式: "评论区引导讨论、社群深度运营"

  小红书:
    内容形式: "图文笔记(500-1000字) + 短视频(1-3分钟)"
    标题风格: "共鸣型/极简型/打工人标签型，强调'感'和'真实'"
    字数规格: "500-1000字，强调配图质量"
    排版特点: "封面图吸睛、列表式内容、emoji适量、标签精准"
    发布节奏: "每周3-5篇，以图文为主穿插短视频"
    互动方式: "评论区互动、话题标签参与、笔记分享"

  抖音:
    内容形式: "短视频(30秒-3分钟)为主"
    标题风格: "提问型/反直觉型/数字型，15字以内，强调悬念"
    字数规格: "脚本300-800字，视频30秒-3分钟"
    排版特点: "开头3秒钩子、字幕清晰、节奏快、结尾给出核心洞察"
    发布节奏: "每周3-5条短视频"
    互动方式: "评论区引导、直播连麦、合集系列化"

  B站:
    内容形式: "中长视频(5-15分钟) + 短视频(1-5分钟)"
    标题风格: "深度分析型/人物故事型/职场观察型，标题可稍长"
    字数规格: "脚本2000-5000字，视频5-15分钟"
    排版特点: "开头钩子+结构清晰+数据可视化+结尾升华"
    发布节奏: "每周1-2条视频"
    互动方式: "弹幕互动、评论区深度讨论、专栏同步文字版"

  知乎:
    内容形式: "深度回答(1500-5000字) + 短回答(500字以内)"
    标题风格: "问题式标题，强调专业性和深度"
    字数规格: "长回答1500-5000字，短回答300-800字"
    排版特点: "逻辑清晰、数据支撑、案例佐证、结构化排版"
    发布节奏: "每周2-3个回答"
    互动方式: "评论区讨论、赞同互推、专栏同步"

  微博:
    内容形式: "短观点(140字) + 长微博(500字) + 九宫格图文"
    标题风格: "金句型/反认知型，140字以内，强调冲击力"
    字数规格: "短观点140字，长微博500字以内"
    排版特点: "金句先行、九宫格配图、话题标签、转发链"
    发布节奏: "每天1-3条"
    互动方式: "转发评论互动、话题参与、热搜蹭点"

平台侧重_职场赛道:
  主阵地: "微信公众号（深度内容核心）+ 小红书（打工人共鸣传播）"
  次阵地: "抖音（短视频引流）+ B站（深度视频内容）"
  补充阵地: "知乎（专业背书）+ 微博（即时观点传播）"
  说明: "职场赛道以文字深度内容为核心竞争力，短视频是引流工具不是主阵地"