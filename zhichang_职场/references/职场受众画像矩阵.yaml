# 职场受众画像矩阵
# 何时读取: 创作选题时、确定切入角度时、选择情感基调时

受众类型:
  L1_萌芽期新人:
    定义: "0-3年职场人，刚从学校进入社会"
    核心特征: ["对规则陌生", "对身份困惑", "对未来焦虑", "极度渴望被认可"]
    核心心态: "我到底该怎么活？规则是什么？我能不能活下来？"
    品类关注度排名: ["职场生存(最高)", "情绪共鸣(高)", "晋升加薪(中)", "职场生活(中)", "认知升级(低)", "身份认同(低)", "管理实战(最低)"]
    切入角度: "用揭秘感切入——把不透明规则变成可操作知识，同时给予情感认同"
    内容演变线: ["入职适应期→试用期生存→同事关系建立→第一个晋升窗口"]
    禁忌: ["不要嘲笑新人的无知", "不要贩卖过度的焦虑", "不要暗示他们永远无法融入"]

  L2_上升期攻坚者:
    定义: "3-8年职场人，正在争取晋升和影响力"
    核心特征: ["有基本能力但缺杠杆", "渴望被看见", "对竞争敏感", "开始思考长期价值"]
    核心心态: "我怎么才能比别人快？我的价值怎么被看见？"
    品类关注度排名: ["晋升加薪(最高)", "认知升级(高)", "职场生存(中)", "身份认同(中)", "管理实战(中)", "情绪共鸣(低)", "职场生活(低)"]
    切入角度: "用对标感切入——让别人成功路径成为参照，赋能而非焦虑"
    内容演变线: ["能力积累期→晋升冲刺期→管理转型期→瓶颈突破期"]
    禁忌: ["不要暗示成功只有一条路", "不要制造同辈压力", "不要贩卖'不进则退'焦虑"]

  L3_管理期带人者:
    定义: "中高层管理者，核心挑战从做事变成带人"
    核心特征: ["夹心层压力大", "需要全局思维", "团队激励是痛点", "时间精力极度稀缺"]
    核心心态: "我怎么让团队为我打仗？我的精力怎么分配？"
    品类关注度排名: ["管理实战(最高)", "认知升级(高)", "职场生活(中)", "晋升加薪(低)", "身份认同(中)", "职场生存(低)", "情绪共鸣(中)"]
    切入角度: "用通透感切入——把管理困境拆成可操作的方法论，承认疲惫但给出解法"
    内容演变线: ["带人摸索期→团队成型期→战略转型期→组织建设期"]
    禁忌: ["不要简化管理为口号", "不要美化中层困境", "不要暗示管理就是'管人'"]

  L4_瓶颈转型期:
    定义: "8-15年职场人，遇到天花板或倦怠，或主动转型"
    核心特征: ["经验丰富但价值感下降", "对现状有困惑", "渴望重新定义自己", "对未来恐惧与期待并存"]
    核心心态: "我到底要不要继续？我是不是被困住了？还能不能重新开始？"
    品类关注度排名: ["情绪共鸣(最高)", "身份认同(高)", "职场生活(高)", "认知升级(中)", "职场生存(低)", "晋升加薪(低)", "管理实战(低)"]
    切入角度: "用解绑感切入——承认困境的存在，给予重新定义自我的勇气和路径"
    内容演变线: ["倦怠觉察期→意义追问期→破局尝试期→二次曲线期"]
    禁忌: ["不要暗示35岁就完了", "不要贩卖中年危机焦虑", "不要暗示转型只有一条路"]

交叉受众洞察:
  打工人标签_全员共鸣: "打工人"身份标签穿透所有阶段，是职场赛道最强的情绪入口
  极简主义_新生代: 小红书数据显示打工人倾向极简生活，简化物质负担提升幸福感
  下班新生活_上升期瓶颈期: "下班后开启新的一天"成为当代职场人共同渴求
  高质量休养_全员: 健康关注+情绪关注，从工作切换到生活模式的需求跨阶段存在
  自主性选择_新生代上升期: 精英文化祛魅，投资自己而非躺平，处于丧与正的张力中