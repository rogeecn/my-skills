# 职场标题公式库
# 何时读取: 写标题时、选择标题情感触发策略时

标题公式:

  公式1_规则揭秘型:
    结构模板: "{N}条没人告诉你的职场{品类词}"
    适用品类: ["职场生存", "晋升加薪"]
    适用受众: ["L1", "L2"]
    示例: ["5条没人告诉你的职场潜规则", "3个没人教你的加薪策略"]

  公式2_阶段对标型:
    结构模板: "{职业阶段}的人，{核心痛点/认知}"
    适用品类: ["全部品类"]
    适用受众: ["按阶段精准匹配"]
    示例: ["入职3个月的人，最容易踩的3个雷区", "升职后的人，最需要补的不是能力而是视角"]

  公式3_反认知型:
    结构模板: "你以为{常见认知}，其实{真相}"
    适用品类: ["认知升级", "职场生存", "晋升加薪"]
    适用受众: ["L2", "L3"]
    示例: ["你以为加班是努力，其实是在消耗你的核心价值", "你以为升职靠能力，其实靠的是认知升级的速度"]

  公式4_身份觉醒型:
    结构模板: "{身份标签}的{痛点}，本质是{深层原因}"
    适用品类: ["情绪共鸣", "身份认同"]
    适用受众: ["L4", "L1"]
    示例: ["打工人的焦虑，本质是你还没找到'我是谁'", "不想上班不是懒，是你的身份感正在崩溃"]

  公式5_数字盘点型:
    结构模板: "{N}个职场{品类词}，第{X}个最关键"
    适用品类: ["全部品类"]
    适用受众: ["全员"]
    示例: ["7个职场生存法则，第3个最容易被忽略", "10个管理陷阱，第5个让80%的新管理者栽了"]

  公式6_对比型:
    结构模板: "{A}的人{结果1}，{B}的人{结果2}"
    适用品类: ["晋升加薪", "认知升级", "职场生存"]
    适用受众: ["L2"]
    示例: ["汇报的人升了职，不汇报的人还在原地", "有边界感的人活得好，没有边界感的人活得很累"]

  公式7_提问型:
    结构模板: "为什么{常见现象}？{解密/真相}"
    适用品类: ["认知升级", "职场生存"]
    适用受众: ["全员"]
    示例: ["为什么你很努力却升不上去？因为缺的不是能力", "为什么越休越累？因为你没有真正切换模式"]

  公式8_职场人物型:
    结构模板: "{人物/角色}的{场景}：{洞察}"
    适用品类: ["管理实战", "身份认同"]
    适用受众: ["L3", "L4"]
    示例: ["中层管理者的真实困境：夹在中间的不是你，是你的认知", "离职那一刻，打工人才真正开始思考'我是谁'"]

  公式9_时间节点型:
    结构模板: "{时令节点}，职场人最该做的{N}件事"
    适用品类: ["全部品类"]
    适用受众: ["全员"]
    示例: ["年底述职季，5件事决定你明年的晋升", "劳动节，打工人最该问自己的3个问题"]

  公式10_痛感共鸣型:
    结构模板: "{痛点描述}——{情感共鸣点}"
    适用品类: ["情绪共鸣", "职场生活"]
    适用受众: ["L4", "L1"]
    示例: ["996不是你的错——但你可以选择不996的生活", "不想上班不是矫情——是你在寻找真正的自己"]

  公式11_方法论型:
    结构模板: "{N}步{目标}：{方法概要}"
    适用品类: ["晋升加薪", "管理实战", "职场生存"]
    适用受众: ["L1", "L2", "L3"]
    示例: ["5步向上管理法：从被动执行到主动影响", "3步辞职决策法：走还是留，不再纠结"]

  公式12_故事型:
    结构模板: "我{职场经历}，{洞察/教训}"
    适用品类: ["全部品类"]
    适用受众: ["全员"]
    示例: ["我入职第一天就犯了最蠢的错，后来才明白职场不是学校", "我升职后反而更焦虑，直到明白管理不是管人"]

  公式13_金句型:
    结构模板: "{金句}——{展开说明}"
    适用品类: ["认知升级", "身份认同"]
    适用受众: ["L2", "L3", "L4"]
    示例: ["打工人的终极自由不是不上班——是上班时也能做自己", "中层不是夹心层——是价值枢纽"]

  公式14_场景型:
    结构模板: "当{职场场景}时，{应对策略/洞察}"
    适用品类: ["职场生存", "管理实战"]
    适用受众: ["L1", "L3"]
    示例: ["当领导说'你随意'时，千万别随意", "当下属挑战你的决策时，先别急着反击"]

  公式15_极简型:
    结构模板: "{品类词}的本质是{一句话洞察}"
    适用品类: ["认知升级"]
    适用受众: ["L2", "L3"]
    示例: ["职场生存的本质是边界感", "管理能力的本质是让别人愿意为你做事"]

  公式16_条件触发型:
    结构模板: "如果{条件/信号}，说明{判断}"
    适用品类: ["职场生存", "晋升加薪", "情绪共鸣"]
    适用受众: ["全员"]
    示例: ["如果你上班总想辞职，说明不是工作的问题是身份的问题", "如果你的汇报总被打断，说明不是内容的问题是方式的问题"]

  公式17_转折型:
    结构模板: "不是{常见误解}，而是{真相}"
    适用品类: ["认知升级", "职场生存"]
    适用受众: ["全员"]
    示例: ["不是你不够努力，而是你的努力方向错了", "不是领导不喜欢你，而是你没学会向上管理"]

  公式18_潜规则揭秘型_职场特有:
    结构模板: "职场{场景}的潜规则：{揭秘内容}"
    适用品类: ["职场生存", "晋升加薪"]
    适用受众: ["L1", "L2"]
    示例: ["职场汇报的潜规则：不是汇报内容，而是汇报时机", "薪资谈判的潜规则：不是要多少，而是怎么要"]

  公式19_阶段对标型_职场特有:
    结构模板: "入职{时间}的你，{阶段洞察/预警}"
    适用品类: ["职场生存", "晋升加薪"]
    适用受众: ["L1", "L2"]
    示例: ["入职3个月的你，最容易犯的5个错", "工作5年的你，正在面对最危险的职场瓶颈"]

  公式20_职场人物型_职场特有:
    结构模板: "{职场角色}最{情感词}的{N}个瞬间"
    适用品类: ["情绪共鸣", "管理实战"]
    适用受众: ["L3", "L4"]
    示例: ["中层管理者最无助的5个瞬间", "打工人最委屈的3个场景"]

情感触发词:
  规则冲击类_职场特有:
    词表: ["没人告诉", "潜规则", "暗逻辑", "雷区", "陷阱", "踩坑", "避雷"]
    用法: "打破信息不对称，用揭秘感激发好奇心和求知欲"

  身份觉醒类_职场特有:
    词表: ["本质", "真正", "其实", "真相", "底层逻辑", "不是...而是"]
    用法: "触发身份思考，用觉醒感激发深层认同"

  共鸣类:
    词表: ["不想上班", "内耗", "焦虑", "倦怠", "疲惫", "打工人", "996"]
    用法: "先承认痛点存在，建立情感连接"

  好奇类:
    词表: ["揭秘", "真相", "潜规则", "暗逻辑", "没人教", "为什么"]
    用法: "打破信息不对称，激发求知欲"

  赋能类:
    词表: ["掌握", "学会", "升级", "破局", "逆袭", "掌控", "通透"]
    用法: "给予行动信心，用正向赋能驱动"

  紧迫类:
    词表: ["越早越好", "现在不改", "再不行动", "已经晚了", "别等到"]
    用法: "制造适度紧迫感（注意：不贩卖焦虑）"

  对标类:
    词表: ["像XX一样", "别人怎么做", "对标", "参照", "那一步"]
    用法: "提供参照物，激发对标心理"