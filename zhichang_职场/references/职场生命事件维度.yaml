# 职场生命事件维度
# 何时读取: 捕捉受众情绪触发点时、规划共鸣型选题时

事件触发器:
  E1_刚入职:
    触发场景: "第一天上班/入职新公司"
    情感关键词: ["紧张", "兴奋", "不安", "期待", "自我怀疑"]
    适用受众: ["L1_萌芽期新人"]
    选题方向: "入职第一天生存指南/新人如何快速融入"

  E2_试用期通过:
    触发场景: "试用期结束考核/转正"
    情感关键词: ["如释重负", "成就感", "归属感", "开始真正投入"]
    适用受众: ["L1_萌芽期新人"]
    选题方向: "试用期后的真实职场/转正不是终点而是起点"

  E3_第一次被批评:
    触发场景: "领导批评/项目失误/被否定"
    情感关键词: ["挫败", "羞耻", "怀疑", "想辞职", "愤怒"]
    适用受众: ["L1_萌芽期新人", "L2_上升期攻坚者"]
    选题方向: "被批评后的情绪自救/职场否定感的正确处理方式"

  E4_第一次升职:
    触发场景: "升职通知/角色变化"
    情感关键词: ["兴奋", "焦虑", "不配感", "压力", "期待"]
    适用受众: ["L2_上升期攻坚者"]
    选题方向: "升职后的心理调适/从执行者到管理者的身份转换"

  E5_薪资谈判:
    触发场景: "谈薪资/加薪谈判/薪资不满意"
    情感关键词: ["焦虑", "不自信", "害怕被拒绝", "不甘心"]
    适用受众: ["L2_上升期攻坚者"]
    选题方向: "薪资谈判的正确方式/你的薪资谈判可能犯的3个错"

  E6_第一次带人:
    触发场景: "从执行者变成管理者/第一次有下属"
    情感关键词: ["手足无措", "身份困惑", "不知所措", "想做好但不知道怎么做"]
    适用受众: ["L3_管理期带人者"]
    选题方向: "第一次带人的真实体验/从做事到带人的认知跳跃"

  E7_团队冲突:
    触发场景: "团队成员冲突/跨部门矛盾/下属不服"
    情感关键词: ["疲惫", "无力感", "想逃避", "愤怒", "自我怀疑"]
    适用受众: ["L3_管理期带人者"]
    选题方向: "管理者如何处理团队冲突/不是你的错但你得解决"

  E8_中年倦怠:
    触发场景: "工作8年后感到倦怠/对当前职业失去热情"
    情感关键词: ["麻木", "空虚", "质疑意义", "想逃离", "恐惧"]
    适用受众: ["L4_瓶颈转型期"]
    选题方向: "职场倦怠不是你的错/倦怠的信号你可能已经收到了"

  E9_被裁员:
    触发场景: "裁员/被动离职/组织调整被边缘化"
    情感关键词: ["震惊", "愤怒", "自我否定", "恐慌", "被背叛感"]
    适用受众: ["L2_上升期攻坚者", "L4_瓶颈转型期"]
    选题方向: "被裁员后的心理重建/裁员不是你不行而是时代变了"

  E10_跳槽决策:
    触发场景: "拿到新offer/纠结要不要走/离开舒适区"
    情感关键词: ["纠结", "期待", "不舍", "恐惧", "兴奋"]
    适用受众: ["L2_上升期攻坚者", "L4_瓶颈转型期"]
    选题方向: "跳槽决策的5个维度/你到底该走还是该留"

  E11_职业转型:
    触发场景: "换行业/换赛道/重新定义自己"
    情感关键词: ["迷茫", "勇气", "恐惧", "期待", "不安"]
    适用受众: ["L4_瓶颈转型期"]
    选题方向: "职业转型的真实路径/过去的经验还值不值钱"

  E12_职场PUA:
    触发场景: "被领导PUA/精神控制/情绪暴力"
    情感关键词: ["自我怀疑", "愤怒", "无力感", "想反抗但不敢", "羞耻"]
    适用受众: ["L1_萌芽期新人", "L4_瓶颈转型期"]
    选题方向: "如何识别职场PUA/职场PUA的心理自救指南"

  E13_996加班:
    触发场景: "持续加班/加班文化/工作侵占生活"
    情感关键词: ["疲惫", "愤怒", "无力感", "想反抗", "麻木"]
    适用受众: ["全员"]
    选题方向: "加班不是你的问题/如何在不加班的环境下活得更好"

  E14_辞职那一刻:
    触发场景: "决定辞职/提交离职申请/告别同事"
    情感关键词: ["如释重负", "不舍", "勇气", "兴奋", "不安"]
    适用受众: ["L2_上升期攻坚者", "L4_瓶颈转型期"]
    选题方向: "辞职那一刻的心理变化/离职不是逃避而是选择"

  E15_副业启动:
    触发场景: "开始做副业/探索第二曲线/工作外的新身份"
    情感关键词: ["期待", "兴奋", "不安", "时间焦虑", "成就感"]
    适用受众: ["L2_上升期攻坚者", "L4_瓶颈转型期"]
    选题方向: "副业的正确打开方式/从打工者到自己当家"