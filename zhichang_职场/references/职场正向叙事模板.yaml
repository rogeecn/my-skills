# 职场正向叙事模板
# 何时读取: 写赋能型内容时、选择叙事基调时、避免负面叙事陷阱时

赋能型情感触发词表:
  身份赋能: ["你值得", "你有选择", "你不是被困住", "你可以重新定义", "你的经验有价值"]
  行动赋能: ["从现在开始", "先做这一步", "不需要完美再开始", "小步也能走远"]
  认知赋能: ["看透了就不焦虑", "理解了就能掌控", "知道了就有方向", "通透是一种力量"]
  情感赋能: ["你不是一个人", "你的感受是合理的", "焦虑不是你的错", "倦怠是信号不是失败"]
  未来赋能: ["下一次你会更清楚", "转型不是从零开始", "过去的经验不会白费", "第二曲线值得期待"]

赋能大纲模板:

  模板1_困境→认知→解法型:
    步骤:
      - 第1段: "承认困境的存在（共鸣先入场）"
      - 第2段: "拆解困境的底层逻辑（认知升级）"
      - 第3段: "给出具体可操作的解法（行动赋能）"
      - 第4段: "展望未来可能性（未来赋能）"
    适用场景: "职场焦虑/倦怠/内耗/跳槽纠结等负面情绪型选题"
    叙事基调: "先沉后浮——开头沉重共鸣，结尾轻盈赋能"
    示例: "职场倦怠自救→你不是一个人→倦怠的本质是身份迷失→3步重新定义自己→第二曲线值得期待"

  模板2_认知升级型:
    步骤:
      - 第1段: "提出反直觉观点（好奇心入场）"
      - 第2段: "论证这个观点（用案例/逻辑/数据）"
      - 第3段: "延伸到具体场景应用（落地赋能）"
      - 第4段: "升华到人生视角（身份赋能）"
    适用场景: "认知升级/底层逻辑/职场真相类选题"
    叙事基调: "通透感——一针见血但不刺痛，看透但不冷漠"
    示例: "升职不是靠努力→升职靠的是认知速度→3个认知跳跃→通透是职场最大的竞争力"

  模板3_阶段对标型:
    步骤:
      - 第1段: "描绘特定阶段的真实困境（身份共鸣入场）"
      - 第2段: "对标同阶段成功者的路径（对标感入场）"
      - 第3段: "拆解可复制的核心步骤（行动赋能）"
      - 第4段: "定义该阶段的价值（身份赋能）"
    适用场景: "职业阶段型选题（入职/升职/管理/转型）"
    叙事基调: "温暖但不鸡汤——承认痛苦存在，同时给出路径"
    示例: "入职3个月的真实困境→对标那批活下来的人→5个关键行为→你现在的阶段不丢人"

叙事基调选择规则表:
  职场生存类:
    推荐基调: "通透感+揭秘感"
    说明: "看透规则但不利用规则害人，揭秘是为了让更多人少踩坑"
    禁忌: "不要变成阴谋论/不要暗示职场全是黑暗"

  情绪共鸣类:
    推荐基调: "共鸣感+赋能感"
    说明: "先共鸣再赋能，承认痛苦后给出解法"
    禁忌: "不要只共鸣不解法/不要贩卖焦虑/不要暗示痛苦不可解决"

  晋升加薪类:
    推荐基调: "对标感+行动感"
    说明: "对标成功路径，给出可操作步骤"
    禁忌: "不要暗示只有一条成功路/不要制造同辈压力"

  认知升级类:
    推荐基调: "通透感+好奇心"
    说明: "看透本质激发好奇，让人产生'原来如此'的感觉"
    禁忌: "不要居高临下/不要用术语壁垒隔绝读者"

  身份认同类:
    推荐基调: "觉醒感+未来感"
    说明: "帮助定义自我，给出重新开始的可能性"
    禁忌: "不要暗示35岁就完了/不要贩卖中年危机"

  管理实战类:
    推荐基调: "通透感+方法论感"
    说明: "承认管理困境真实存在，拆成可操作方法论"
    禁忌: "不要简化管理为口号/不要美化中层困境"

  职场生活类:
    推荐基调: "解绑感+生活感"
    说明: "工作不是全部，生活值得被认真对待"
    禁忌: "不要暗示不工作就是堕落/不要美化996"