# 职场内容品类交叉矩阵
# 何时读取: 选题策划时、组合创作角度时、确保内容多样性时

品类体系:
  职场生存:
    子品类: ["职场潜规则与暗逻辑", "向上管理与汇报技巧", "人际博弈与社交策略", "跨部门协作与资源争取", "避坑指南与常见雷区"]
    高度兼容品类: ["情绪共鸣", "晋升加薪"]

  晋升加薪:
    子品类: ["升职逻辑与路径规划", "加薪谈判与薪资策略", "跳槽时机与选择判断", "职业周期与阶段对标", "能力模型与成长杠杆"]
    高度兼容品类: ["认知升级", "职场生存"]

  情绪共鸣:
    子品类: ["职场焦虑与倦怠", "内耗与精神离职", "996加班文化反思", "职场PUA与边界感", "不想上班的情绪出口"]
    高度兼容品类: ["身份认同", "职场生活"]

  认知升级:
    子品类: ["商业思维与底层逻辑", "管理思维与领导力", "行业判断与趋势洞察", "战略视角与全局思维", "从执行者到决策者的转变"]
    高度兼容品类: ["管理实战", "晋升加薪"]

  身份认同:
    子品类: ["职业标签与专业身份", "个人品牌与影响力", "职业尊严与自我定义", "从打工者到合伙人", "职业转型与二次曲线"]
    高度兼容品类: ["情绪共鸣", "职场生活"]

  管理实战:
    子品类: ["团队管理与激励", "招人用人与辞人", "目标管理与OKR", "会议效率与决策机制", "冲突处理与组织文化"]
    高度兼容品类: ["认知升级", "职场生活"]

  职场生活:
    子品类: ["工作生活平衡", "副业与第二曲线", "时间管理与精力分配", "职场健康与心理韧性", "退休规划与财务自由"]
    高度兼容品类: ["情绪共鸣", "身份认同"]

受众类型映射:
  L1_萌芽期新人: ["职场生存", "情绪共鸣", "职场生活"]
  L2_上升期攻坚者: ["晋升加薪", "认知升级", "身份认同"]
  L3_管理期带人者: ["管理实战", "认知升级", "职场生活"]
  L4_瓶颈转型期: ["情绪共鸣", "身份认同", "职场生活"]

时令周期:
  春季_3-5月: "招聘季/跳槽季→晋升加薪、职场生存"
  夏季_6-8月: "年中考核/新人入职→职场生存、情绪共鸣"
  秋季_9-11月: "秋招季/晋升季→晋升加薪、认知升级"
  冬季_12-2月: "年终考核/年度反思→情绪共鸣、职场生活、身份认同"

选题公式:
  公式1_品类×受众: "{品类子项} + {受众阶段} → 针对特定阶段的品类深度内容"
  公式2_品类×时令: "{品类子项} + {时令节点} → 顺应时间节点的品类内容"
  公式3_品类×品类: "{品类A子项} × {品类B子项} → 交叉视角的创新内容"

跨品类交叉组合:
  组合1_职场生存×情绪共鸣:
    切入: "职场潜规则背后的情绪伤害"
    示例选题: ["那些没人告诉你的职场潜规则，正在悄悄毁掉你的情绪", "向上管理不是讨好，而是边界感"]
    适用受众: ["L1", "L4"]

  组合2_晋升加薪×认知升级:
    切入: "升职不是努力就够了，是认知先到位"
    示例选题: ["为什么你很努力却升不上去？因为你缺的不是能力而是视角", "从月薪3万到年薪百万，底层逻辑是什么"]
    适用受众: ["L2"]

  组合3_情绪共鸣×身份认同:
    切入: "焦虑的本质是身份迷失"
    示例选题: ["不想上班不是懒，是你还没找到'我是谁'", "打工人的身份困局：到底是活着还是活过"]
    适用受众: ["L4", "L1"]

  组合4_管理实战×认知升级:
    切入: "管理是认知的外化"
    示例选题: ["中层管理者最缺的不是技巧，是战略视角", "从执行者到决策者，最关键的一次认知跳跃"]
    适用受众: ["L3"]

  组合5_职场生活×情绪共鸣:
    切入: "生活失衡是倦怠的核心来源"
    示例选题: ["下班Gap Hour：当代职场人的自救方式", "为什么越休越累？因为你没有真正切换模式"]
    适用受众: ["全员"]

  组合6_晋升加薪×职场生存:
    切入: "活下来才能往上走"
    示例选题: ["试用期3个月，这5个雷区踩了就出局", "你的汇报方式，正在决定你能不能升职"]
    适用受众: ["L1", "L2"]

多样性规则:
  规则1: "连续3篇不超过同一品类"
  规则2: "每5篇至少覆盖3个品类"
  规则3: "每10篇必须包含至少1组交叉组合选题"
  规则4: "受众覆盖：每5篇至少覆盖2种受众类型"
  规则5: "情绪共鸣型内容不超过总量的30%，避免过度情绪化"