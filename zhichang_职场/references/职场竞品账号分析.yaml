竞品内容模式分布:
  合集盘点型:
    占比: "约35%"
    示例: ["7个升职加薪建议", "15条职场生存忠告", "5个职场处事法则", "3个职场转型关键策略"]
    说明: "数字盘点型标题占比最高，用数字制造确定性是职场赛道核心手法"

  深度解读型:
    占比: "约15%"
    示例: ["职场社交的'黑洞'", "职场潜规则才是真正的企业文化", "领导力的6个误区"]
    说明: "头部大号（虎嗅/36氪/企业管理杂志）主导，需要专业背景支撑"

  情绪共鸣型:
    占比: "约25%"
    示例: ["95%的人想离职", "职场不接受Gap Year", "做得越多死得越快", "老实人总是吃亏"]
    说明: "打工人情绪共鸣占比高，传播力强，是职场赛道最主流打法"

  影视借势型:
    占比: "约8%"
    示例: ["《我的前半生》职场潜规则", "《人民的名义》职场潜规则", "《沧浪之水》7条职场潜规则"]
    说明: "借热播影视讲职场道理，视觉志等大号擅长，标题冲击力极强"

  反规则/犀利观点型:
    占比: "约10%"
    示例: ["职场升职加薪绝不是因为你努力", "职场潜规则:做得越多死得越快", "别想用职场PUA去控制员工"]
    说明: "毒舌职场/恶魔奶爸等小号专攻此类型，反常识是核心手法"

  自愈/转型实操型:
    占比: "约5%"
    示例: ["职场焦虑自救手册", "35+职场人转型5个务实方向", "转型不是跳槽是身份重建"]
    说明: "心理自愈+转型实操是竞争空白，搜索结果少但需求明确"

