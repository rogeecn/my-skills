# 职场行业地图
# 何时读取: 需要行业洞察素材时、需要认知升级型内容参照时、选题需要行业对标时
# 赛道特有维度: 职场赛道需要行业地图——读者通过"行业怎么变"来确认"我该怎么转"

行业分类: "按变革程度×职场影响深度双维度组织"

行业档案:

  # === 高变革行业（正在剧烈变化的行业） ===

  - 行业名称: "互联网/AI"
    变革程度: "极高"
    职场影响深度: "极深——所有人的工作方式都在被重构"
    核心现象:
      - "AI重构职场：从工具内卷到生存变局"
      - "微软清退大龄员工：职场人高估了自己的职业寿命"
      - "互联网大厂裁员潮：从增量时代到存量博弈"
    创作切入角度:
      - "AI+狂飙，职场人该焦虑吗？——不焦虑不行，但焦虑也不够"
      - "互联网职场人的三条出路：留下、跳走、转型"
      - "大厂P8跳槽去小厂当副总，3个月后人没了——存量时代的跳槽真相"
    适用受众: "所有职业阶段（偏上升期+管理期）"
    情感关键词: ["焦虑", "不确定", "想抓住新机会", "恐惧被淘汰"]

  - 行业名称: "金融"
    变革程度: "高"
    职场影响深度: "深——证书+学历门槛变化，数字化转型加速"
    核心现象:
      - "在事务所沉淀五年，跳槽去制造业当财务经理"
      - "2026年职场人转型与搞钱必备的高含金量证书"
      - "金融从业者转型新方向：数字化金融+绿色金融"
    创作切入角度:
      - "金融人转型地图——从传统金融到新金融的三条路径"
      - "证书还是经验？2026年金融职场人的选择逻辑变了"
      - "5年事务所经验跳槽制造业——跨界转型的底层逻辑"
    适用受众: "上升期+瓶颈/转型期"
    情感关键词: ["想稳定", "想转型", "证书焦虑", "选择困难"]

  - 行业名称: "制造业"
    变革程度: "中高"
    职场影响深度: "中深——智能制造转型正在重塑技能需求"
    核心现象:
      - "2026制造业职场：转型智能制造，这3个技能必学"
      - "数字化转型必备证书——制造业职场人突围指南"
      - "制造业中层管理者的真实困境：传统管理方式失效"
    创作切入角度:
      - "制造业职场转型地图——从传统制造到智能制造的技能迁移"
      - "制造业中层管理者的觉醒——技术变了，管理方式也必须变"
      - "制造业职场人的突围——不是换行业，是换技能模型"
    适用受众: "管理期+瓶颈/转型期"
    情感关键词: ["想跟上变化", "技能焦虑", "传统思维失效", "转型决心"]

  # === 中变革行业（正在缓慢转型的行业） ===

  - 行业名称: "教育"
    变革程度: "中"
    职场影响深度: "中——政策变化+AI辅助教学正在重塑教师角色"
    核心现象:
      - "新教师如何摆脱职场焦虑和内耗——从'菜鸟'到'大神'"
      - "教育行业数字化转型——教师角色的重新定义"
      - "双减后的教师生存——从增量市场到存量市场的转变"
    创作切入角度:
      - "教师职场生存地图——从'菜鸟'到'大神'的真实路径"
      - "AI时代教师不会被淘汰，但会被重新定义"
      - "教育工作者的职场转型——不是离开教育，是教育新形态"
    适用受众: "萌芽期+瓶颈/转型期"
    情感关键词: ["迷茫", "政策焦虑", "想跟上变化", "想突破"]

  - 行业名称: "医疗"
    变革程度: "中"
    职场影响深度: "中深——职称体系+科室管理+医患关系多重压力"
    核心现象:
      - "医生职场倦怠——高强度+低回报+职业尊严困境"
      - "医疗行业管理变革——从科室主任到科室CEO"
      - "年轻医生的职场困境——晋升路径长+收入低+社会压力大"
    创作切入角度:
      - "医生职场困境地图——不是你不够好，是体系在压你"
      - "从科室主任到科室CEO——医疗管理者的角色转变"
      - "年轻医生的职场觉醒——职业尊严不是职称给的，是能力给的"
    适用受众: "萌芽期+管理期"
    情感关键词: ["倦怠", "压力", "职业尊严", "想突破体系限制"]

  - 行业名称: "房地产"
    变革程度: "极高（下行期）"
    职场影响深度: "极深——整个行业收缩，从业者被迫转型"
    核心现象:
      - "地产人转型——从地产到互联网/金融/制造业的路径"
      - "房地产职场人的职业寿命被高估——和微软清退大龄员工同理"
      - "地产从业者转型路径——管理能力可迁移，但行业认知需重建"
    创作切入角度:
      - "地产人转型地图——行业下行不是终点，是起点"
      - "地产从业者的可迁移能力——管理能力是最大的资产"
      - "从地产到互联网——跨行业转型的底层逻辑不是换赛道，是换技能模型"
    适用受众: "瓶颈/转型期"
    情感关键词: ["恐慌", "被迫转型", "想找到出路", "不确定"]

  # === 稳定行业（变化较慢但职场规则同样复杂） ===

  - 行业名称: "体制内/国企"
    变革程度: "低"
    职场影响深度: "深——规则极度不透明，晋升逻辑完全不同于市场化行业"
    核心现象:
      - "体制内职场潜规则——表面是人情，实际是利益"
      - "体制内晋升逻辑——不是业绩说了算，是关系+时机+表态"
      - "体制内中年困局——想走不敢走，想升升不动"
    创作切入角度:
      - "体制内职场地图——潜规则不是毒药，是导航仪"
      - "体制内vs市场化的职场规则对比——两个世界的生存逻辑"
      - "体制内中年困局的破局点——不是离开，是在内部找到新赛道"
    适用受众: "萌芽期+管理期+瓶颈/转型期"
    情感关键词: ["想了解规则", "被困", "想突破", "想稳定也想成长"]

  - 行业名称: "零售/服务业"
    变革程度: "中高"
    职场影响深度: "中——数字化转型+消费者行为变化"
    核心现象:
      - "零售行业职场人转型——从线下到线上的技能迁移"
      - "服务业职场人的困境——低薪资+高强度+职业天花板低"
      - "零售管理者的挑战——从管人到管数据的转变"
    创作切入角度:
      - "零售职场转型地图——线下到线上不是换渠道，是换思维"
      - "服务业职场人的觉醒——职业天花板不是行业给的，是自己设的"
      - "零售管理者的数字化转型——从管人到管数据"
    适用受众: "上升期+瓶颈/转型期"
    情感关键词: ["想突破天花板", "想跟上数字化", "转型决心", "不确定"]

行业选题使用规则:
  - 行业地图是认知升级型内容的素材库，不是直接搬运行业新闻
  - 每篇行业相关内容必须回答一个问题："这个行业的变化，对我的职场选择有什么影响？"
  - 行业地图+人物档案组合使用：行业变化是宏观，人物困境是微观，二者结合才有完整叙事
  - 高变革行业优先选题——变革越大，职场人的焦虑和需求越强
  - 行业地图每季度更新一次——行业变化快，素材需要同步更新
  - 行业洞察不是行业报告——要把行业数据转化为"职场决策参考"