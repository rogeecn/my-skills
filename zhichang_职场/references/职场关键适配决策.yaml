# 职场赛道关键适配决策记录
# 何时读取: 检验品类/受众/公式是否适配赛道时

适配决策:
  决策1_受众分层方式:
    默认值: "按年龄段3档"
    职场赛道适配值: "按职业阶段4档（萌芽/上升/管理/瓶颈转型）"
    理由: "年龄不是变量，职业阶段才是。25岁的管理者面对的问题和35岁的管理者相似"

  决策2_品类数量:
    默认值: "7个"
    职场赛道适配值: "7个（职场生存/晋升加薪/情绪共鸣/认知升级/身份认同/管理实战/职场生活）"
    理由: "生活类赛道标准，职场品类逻辑清晰无冗余"

  决策3_品类子项数量:
    默认值: "每品类3-5个"
    职场赛道适配值: "每品类5个子项"
    理由: "职场话题足够丰富，5个子项覆盖全面"

  决策4_受众类型数量:
    默认值: "3类"
    职场赛道适配值: "4类（L1萌芽/L2上升/L3管理/L4瓶颈转型）"
    理由: "职业阶段4档比3档更精准，瓶颈转型是职场赛道特有阶段"

  决策5_交叉组合数量:
    默认值: "6组"
    职场赛道适配值: "6组"
    理由: "7个品类交叉组合6组覆盖核心场景，无需更多"

  决策6_生命事件类型:
    默认值: "生活变故类15个"
    职场赛道适配值: "职业变故类15个（入职/晋升/离职/跳槽/倦怠/PUA/996/辞职/裁员/带人/冲突/转型/试用期/谈判/副业）"
    理由: "职场赛道的事件触发器是职业阶段事件而非生活变故"

  决策7_时令锚定方式:
    默认值: "通用节气节日"
    职场赛道适配值: "通用节气节日 + 职场专项节点（毕业季/秋招/晋升季/年终考核/年中考核/述职季/跳槽季）"
    理由: "职场有强烈的时间节奏（招聘/考核/晋升），必须锚定"

  决策8_标题公式数量:
    默认值: "17种"
    职场赛道适配值: "20种（17种通用 + 3种职场特有：潜规则揭秘型/阶段对标型/职场人物型）"
    理由: "职场赛道有特有的标题逻辑（规则揭秘/阶段对标/角色叙事）"

  决策9_情感触发词数量:
    默认值: "5类"
    职场赛道适配值: "7类（5类通用 + 2类职场特有：规则冲击类/身份觉醒类）"
    理由: "职场特有情感是规则冲击和身份觉醒，不同于一般赛道的共鸣/好奇"

  决策10_风格体系名称:
    默认值: "活人感"
    职场赛道适配值: "通透感"
    理由: "职场赛道核心感受是'看透了'，不是'贴近生活气息'也不是'沉浸艺术世界'"

  决策11_叙事基调伦理:
    默认值: "年龄焦虑禁忌"
    职场赛道适配值: "禁止贩卖焦虑（8条硬性禁令）"
    理由: "职场赛道最容易滑入焦虑营销，必须严格禁令。不只是年龄焦虑，还包括35岁歧视/美化加班/同辈压力等"

  决策12_额外维度:
    默认值: "无"
    职场赛道适配值: "职场人物档案 + 行业地图（后续补充）"
    理由: "职场赛道需要参照物——人物档案提供对标，行业地图提供方向感"