# 职场人物档案
# 何时读取: 需要职场人物故事素材时、需要创作参照人物时、选题需要人物对标时
# 赛道特有维度: 职场赛道需要参照物——读者通过"别人怎么活"来确认"我该怎么活"

人物分类: "按职业阶段×典型困境双维度组织"

人物档案:

  # === 萌芽期人物（0-3年职场新人） ===

  - 人物代号: "小陈-试用期危机"
    职业阶段: "萌芽期"
    典型困境: "试用期被淘汰/不被认可"
    人物画像: "22-25岁应届生，名校毕业但职场不适应，汇报被领导嫌啰嗦，同事关系冷漠"
    核心心态: "我到底该怎么活？规则是什么？"
    创作切入角度:
      - "试用期生存指南——从学生思维到职场思维的转变"
      - "名校毕业为什么也会被试用期淘汰——职场不看学历看适应力"
      - "新人三个月沉默期的真相——不是没人帮你，是你不会求助"
    适用受众: "萌芽期新人"
    情感关键词: ["迷茫", "焦虑", "不被认可", "不知所措", "自我怀疑"]

  - 人物代号: "小林-职场性骚扰"
    职业阶段: "萌芽期"
    典型困境: "遭遇职场不当行为/边界感缺失"
    人物画像: "00后女员工，拒绝陪客户喝酒被辞退，或者遭遇上级不当言语骚扰"
    核心心态: "职场底线在哪里？我该怎么保护自己？"
    创作切入角度:
      - "00后拒绝陪酒被辞退——职场边界感的代价和勇气"
      - "职场性骚扰背后——不是你的错，是规则的错"
      - "职场新人的第一条底线——学会说不"
    适用受众: "萌芽期新人（偏女性）"
    情感关键词: ["愤怒", "恐惧", "无助", "委屈", "觉醒"]

  - 人物代号: "小张-内耗新人"
    职业阶段: "萌芽期"
    典型困境: "刚上班就焦虑内耗/精神离职"
    人物画像: "25岁入职半年，每天想辞职但又不敢，刷手机摸鱼度日，精神已经不在工作上了"
    核心心态: "我到底要不要继续？为什么我连上班都做不到？"
    创作切入角度:
      - "刚上班就内耗——5个科学心态帮你度过新手期"
      - "精神离职的真相——不是你不努力，是你没找到锚点"
      - "新人的三种死法：跪着活、站着死、摸着鱼——哪条路能走通？"
    适用受众: "萌芽期新人"
    情感关键词: ["焦虑", "内耗", "想逃", "自我怀疑", "倦怠"]

  # === 上升期人物（3-8年成长攻坚者） ===

  - 人物代号: "大伟-晋升困局"
    职业阶段: "上升期"
    典型困境: "拼命干活但不被提拔/升职逻辑不透明"
    人物画像: "28岁5年经验，业绩数一数二但晋升总轮不到自己，领导说'你还不够成熟'"
    核心心态: "我怎么做才能被看见？我的价值到底怎么衡量？"
    创作切入角度:
      - "升职加薪绝不是因为你努力——揭秘职场晋升的真正逻辑"
      - "业绩第一却晋升失败——职场看的不只是结果，还有姿态"
      - "从'做事好'到'被看见'——上升期的三道门槛"
    适用受众: "上升期攻坚者"
    情感关键词: ["不甘", "迷茫", "憋屈", "想证明自己", "渴望认可"]

  - 人物代号: "小美-老实人困境"
    职业阶段: "上升期"
    典型困境: "太老实/太勤快反而被忽视甚至被利用"
    人物画像: "30岁7年经验，加班最多功劳最少，领导说'你踏实可靠'但从来不给机会"
    核心心态: "为什么越老实越不吃香？我是不是该变得'聪明'一点？"
    创作切入角度:
      - "职场最掉价的3种'老实人'行为——越勤快越不吃香"
      - "老实人的觉醒——从被利用到被尊重的三步转变"
      - "职场不需要老实人，需要的是有边界感的好人"
    适用受众: "上升期攻坚者"
    情感关键词: ["委屈", "不甘", "困惑", "想改变", "边界感缺失"]

  - 人物代号: "小李-跳槽决策"
    职业阶段: "上升期"
    典型困境: "要不要跳槽/骑驴找马还是裸辞"
    人物画像: "28岁3年经验，觉得现在公司没前途但房贷压着不敢动，想裸辞又怕找不到更好的"
    核心心态: "换环境就能重生吗？还是我只是在重复痛苦？"
    创作切入角度:
      - "别再迷信'骑驴找马'——这才是职场跳槽的真相"
      - "裸辞还是骑驴找马——3个维度帮你做跳槽决策"
      - "跳槽不是重生，是选择——你逃不掉的是自己"
    适用受众: "上升期攻坚者"
    情感关键词: ["纠结", "犹豫", "渴望突破", "恐惧", "想要确定性"]

  # === 管理期人物（8-15年带人成事者） ===

  - 人物代号: "老王-夹心饼干"
    职业阶段: "管理期"
    典型困境: "中层管理者上下夹击/团队带不动"
    人物画像: "35岁10年经验中层，上面要求结果下面不听指挥，开会没人说话但执行全推回来"
    核心心态: "我怎么让团队为我打仗？我的精力怎么分配？"
    创作切入角度:
      - "职场中层,夹心饼干——上下夹击的生存法则"
      - "团队不听指挥——不是他们不努力，是你没有'领导力密码'"
      - "从做事到带人——中层管理者的三道坎"
    适用受众: "管理期带人者"
    情感关键词: ["疲惫", "夹击感", "力不从心", "孤独", "想授权但不会"]

  - 人物代号: "陈姐-管理PUA困局"
    职业阶段: "管理期"
    典型困境: "管理方式滑向PUA/用力过猛控制欲强"
    人物画像: "38岁部门经理，觉得下属不努力就想用高压控制，结果团队更消极，自己也越来越焦虑"
    核心心态: "我怎么才能让他们听话？为什么越管越不听？"
    创作切入角度:
      - "领导力的6个误区——别想用职场PUA去控制员工"
      - "管理不是控制，是激发——从PUA型管理者到赋能型管理者"
      - "用力过猛的管理者——你不是在带团队，是在压团队"
    适用受众: "管理期带人者"
    情感关键词: ["焦虑", "控制欲", "无力感", "想改变", "自我觉察"]

  - 人物代号: "赵总-团队危机"
    职业阶段: "管理期"
    典型困境: "团队遇到危机/如何检验和锤炼领导力"
    人物画像: "40岁高管，公司遇到重大变故（裁员/业务调整），团队士气崩盘，需要快速重建信任"
    核心心态: "危机时刻才能看出谁是真正的领导者"
    创作切入角度:
      - "一个人有没有领导力，经历一次团队危机就知道了"
      - "危机时刻的领导力——不是稳住局面，是稳住人心"
      - "从管理者到领导者——危机是你最大的考场"
    适用受众: "管理期带人者"
    情感关键词: ["紧迫", "责任", "坚定", "使命感", "压力"]

  # === 瓶颈/转型期人物 ===

  - 人物代号: "张姐-35岁天花板"
    职业阶段: "瓶颈/转型期"
    典型困境: "35岁职场天花板/年龄焦虑/职业寿命恐慌"
    人物画像: "35岁15年经验，薪资不再涨了，新来的年轻人更有冲劲，微软清退大龄员工让她恐慌"
    核心心态: "我到底要不要继续？我是不是被困住了？还能不能重新开始？"
    创作切入角度:
      - "微软清退大龄员工——职场人都高估了自己的职业寿命"
      - "35岁天花板不是年龄的问题，是认知的问题"
      - "被困住的不是你，是你的职业模型——35岁转型第一步是拆掉旧框架"
    适用受众: "瓶颈/转型期"
    情感关键词: ["恐慌", "被困", "不甘", "想突围", "迷茫"]

  - 人物代号: "刘姐-职场妈妈双重困境"
    职业阶段: "瓶颈/转型期"
    典型困境: "职场妈妈时间精力被撕裂/上顾工作下顾娃"
    人物画像: "36岁职场妈妈，白天开会晚上带娃，加班被怨不顾家，不加班被嫌不上进"
    核心心态: "上顾工作下顾娃——谁来顾顾我？"
    创作切入角度:
      - "36岁职场妈妈：我终于读懂了财富的真相"
      - "职场妈妈的双重困局——不是你不够努力，是规则不允许你两全"
      - "31岁职场妈妈：上顾工作下顾娃，我这样悄悄哄好自己"
    适用受众: "瓶颈/转型期（偏女性）"
    情感关键词: ["疲惫", "撕裂感", "委屈", "想平衡", "孤独"]

  - 人物代号: "老陈-转型一人公司"
    职业阶段: "瓶颈/转型期"
    典型困境: "从职场人转型独立工作者/一人公司"
    人物画像: "42岁20年经验，厌倦了组织里的博弈，想用专业能力独立生存，但不知道从何开始"
    核心心态: "过去的经验还值不值钱？新的路我能不能走？"
    创作切入角度:
      - "职场老鸟如何转型一人公司——从组织内博弈到独立生存"
      - "转型不是跳槽，是身份重建——你不再是员工，你是产品"
      - "35+职业危机？这是我见过职场人转型最成功的路径"
    适用受众: "瓶颈/转型期"
    情感关键词: ["想自由", "不确定", "恐惧", "勇气", "重建身份"]

人物选题使用规则:
  - 每篇内容至少引用1个人物代号作为故事锚点
  - 人物代号不是真人，是典型困境的人格化——读者看到的是"我"而不是"他"
  - 同一人物代号可以反复使用，每次聚焦不同困境侧面
  - 人物故事先行，方法论后置——先共鸣再解法
  - 人物代号命名规则：代号+核心困境关键词（如"小陈-试用期危机"）
  - 每个职业阶段至少储备3个人物代号