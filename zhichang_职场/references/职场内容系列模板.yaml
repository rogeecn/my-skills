# 职场内容系列模板
# 何时读取: 规划内容排期时、设计系列选题时、安排时令内容时

系列类型:

  时令系列_年度职场节奏:
    名称模板: "职场{时令节点}系列"
    周期: "按年度职场节奏安排（招聘季/考核季/晋升季/年终季）"
    排期表格式:
      第1周: "{时令节点}启动→核心选题"
      第2周: "{时令节点}进阶→深度选题"
      第3周: "{时令节点}实操→方法论选题"
      第4周: "{时令节点}收官→反思总结选题"
    示例:
      系列: "年底述职季系列"
      第1周: "述职季来了，5件事现在不做1月后悔"
      第2周: "述职不是汇报工作量，而是展示价值增量"
      第3周: "3步述职法：让领导记住你的3个关键词"
      第4周: "述职后的人，最该做的3个职业反思"
    创作流程:
      步骤1: "确定时令节点和周期"
      步骤2: "从日历中选择对应品类和受众"
      步骤3: "设计4周递进式选题（启动→进阶→实操→收官）"
      步骤4: "每篇内容独立可读但系列感连贯"
      步骤5: "系列末篇包含下系列预告"

  主题系列_职场认知升级:
    名称模板: "{品类词}认知升级系列"
    周期: "4-6周一个主题系列"
    排期表格式:
      第1周: "认知冲击→打破常见误解"
      第2周: "底层逻辑→揭示本质规律"
      第3周: "方法论→拆成可操作步骤"
      第4周: "实战场景→还原真实应用"
      第5周: "(可选)进阶→延伸到更深层认知"
      第6周: "(可选)收官→总结升华+预告下系列"
    示例:
      系列: "职场生存认知升级系列"
      第1周: "你以为职场是公平竞争？其实规则从来不是明面上的"
      第2周: "职场生存的底层逻辑：不是努力而是边界感"
      第3周: "5步职场边界感建立法"
      第4周: "当领导说'你随意'时——3个真实场景还原"
    创作流程:
      步骤1: "确定主题品类和核心认知"
      步骤2: "设计认知递进路线（冲击→逻辑→方法→场景）"
      步骤3: "从标题公式库选择对应公式"
      步骤4: "从写作风格库选择对应手法"
      步骤5: "确保每篇独立可读，系列整体通透感连贯"

  事件系列_职场人物故事:
    名称模板: "职场{角色/事件}系列"
    周期: "3-4周一个事件系列"
    排期表格式:
      第1周: "人物/事件全景→困境描绘"
      第2周: "人物/事件拆解→底层逻辑"
      第3周: "方法论→从故事中提炼可复制方法"
      第4周: "(可选)延伸→更广泛的职场洞察"
    示例:
      系列: "中层管理者困境系列"
      第1周: "中层管理者的真实困境：上面期待下面需求，你夹在中间"
      第2周: "中层困境的底层逻辑：不是能力不够，是认知没有升级"
      第3周: "3步中层破局法：从执行思维到战略思维"
      第4周: "从'夹心层'到'价值枢纽'：中层的身份觉醒"
    创作流程:
      步骤1: "确定职场角色或事件触发器"
      步骤2: "从生命事件维度选择对应触发器"
      步骤3: "设计共鸣→逻辑→方法→延伸递进"
      步骤4: "每篇开头人物/事件引入，结尾方法论提炼"
      步骤5: "系列收官时预告下一角色/事件系列"

排期表_年度节奏总览:
  1-2月: "年终考核系列 → 年度复盘系列 → 新年规划系列"
  3-4月: "春招求职系列 → 职场新人生存系列 → 跳槽决策系列"
  5-6月: "劳动节反思系列 → 中年考核系列 → 毕业季系列"
  7-8月: "职场倦怠自救系列 → 副业探索系列 → 晋升准备系列"
  9-10月: "秋招攻略系列 → 晋升季系列 → 管理转型系列"
  11-12月: "年终冲刺系列 → 述职季系列 → 年度复盘系列"

创作流程_通用:
  步骤1: "从排期表选择当周品类和受众"
  步骤2: "从品类交叉矩阵选择切入角度"
  步骤3: "从标题公式库选择标题公式"
  步骤4: "从写作风格库选择写作手法"
  步骤5: "从正向叙事模板选择叙事基调"
  步骤6: "从生命事件维度确认情感触发点"
  步骤7: "从长尾关键词总表选择SEO关键词"
  步骤8: "写入content_history.json去重"